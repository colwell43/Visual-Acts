 the dead.”"},{"type":"q","id":"17.4","field":"q108","text":"<b>Action:<\/b> Look at the image of the inscription. Paul found an altar with the words “TO AN UNKNOWN GOD” (v. 23). How might people around you be searching for a God they do not know? How could you speak with one of them?"},{"type":"q","id":"17.5","field":"q109","text":"<b>Heart:<\/b> Paul said God “is not far from each one of us” (v. 27). When have you sensed that God was near?"},{"type":"q","id":"17.6","field":"q110","text":"<b>Heart:<\/b> Consider the image of the breath. “For in him we live, move, and have our being” (v. 28). What does it mean to you that every breath comes from God?"},{"type":"p","html":"<sup class=\"v\">32<\/sup> Now when they heard of the resurrection of the dead, some mocked; but others said, “We want to hear you again concerning this.”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> Thus Paul went out from among them. <sup class=\"v\">34<\/sup> But certain men joined with him and believed, among whom also was Dionysius the Areopagite, and a woman named Damaris, and others with them."},{"type":"q","id":"17.7","field":"q111","text":"<b>Heart:<\/b> Some mocked, others said, “We want to hear you again concerning this,” and some believed (v. 32-34). Which response is closest to yours today?"}],"prayer":"God, you made the world, and you give “life and breath, and all things” (17:24–25). Give me wisdom as I read, and help me seek you, for you are “not far from each one of us” (17:27)."},{"num":18,"hero":{"src":"img/acts18-hero.jpg","w":1100,"h":619,"alt":"A canvas tent in a field"},"blocks":[{"type":"h2","text":"In Corinth"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After these things Paul departed from Athens, and came to Corinth. <sup class=\"v\">2<\/sup> He found a certain Jew named Aquila, a man of Pontus by race, who had recently come from Italy, with his wife Priscilla, because Claudius had commanded all the Jews to depart from Rome. He came to them, <sup class=\"v\">3<\/sup> and because he practiced the same trade, he lived with them and worked, for by trade they were tent makers. <sup class=\"v\">4<\/sup> He reasoned in the synagogue every Sabbath and persuaded Jews and Greeks. <sup class=\"v\">5<\/sup> But when Silas and Timothy came down from Macedonia, Paul was compelled by the Spirit, testifying to the Jews that Jesus was the Christ. <sup class=\"v\">6<\/sup> When they opposed him and blasphemed, he shook out his clothing and said to them, “Your blood be on your own heads! I am clean. From now on, I will go to the Gentiles!”"},{"type":"q","id":"18.1","field":"q112","text":"<b>Action:<\/b> Look at the image that opens this chapter. Paul worked as a tentmaker with Aquila and Priscilla (v. 3). How can your daily work be part of your service to God? What will you do differently at work this week?"},{"type":"p","html":"<sup class=\"v\">7<\/sup> He departed there, and went into the house of a certain man named Justus, one who worshiped God, whose house was next door to the synagogue. <sup class=\"v\">8<\/sup> Crispus, the ruler of the synagogue, believed in the Lord with all his house. Many of the Corinthians, when they heard, believed and were baptized."},{"type":"img","src":"img/acts18-v09.jpg","w":1100,"h":824,"alt":"Stars over a city at night"},{"type":"p","html":"<sup class=\"v\">9<\/sup> The Lord said to Paul in the night by a vision, “Don’t be afraid, but speak and don’t be silent; <sup class=\"v\">10<\/sup> for I am with you, and no one will attack you to harm you, for I have many people in this city.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> He lived there a year and six months, teaching the word of God among them. <sup class=\"v\">12<\/sup> But when Gallio was proconsul of Achaia, the Jews with one accord rose up against Paul and brought him before the judgment seat, <sup class=\"v\">13<\/sup> saying, “This man persuades men to worship God contrary to the law.”"},{"type":"q","id":"18.2","field":"q113","text":"<b>Heart:<\/b> Consider the image of the night sky. The Lord said to Paul in the night, “Don’t be afraid, but speak and don’t be silent; for I am with you” (v. 9-10). Where do you need this encouragement?"},{"type":"q","id":"18.3","field":"q114","text":"<b>Head:<\/b> The Lord said, “I have many people in this city” (v. 10). What would it look like to believe that about your own town?"},{"type":"p","html":"<sup class=\"v\">14<\/sup> But when Paul was about to open his mouth, Gallio said to the Jews, “If indeed it were a matter of wrong or of wicked crime, you Jews, it would be reasonable that I should bear with you; <sup class=\"v\">15<\/sup> but if they are questions about words and names and your own law, look to it yourselves. For I don’t want to be a judge of these matters.” <sup class=\"v\">16<\/sup> So he drove them from the judgment seat."},{"type":"p","html":"<sup class=\"v\">17<\/sup> Then all the Greeks seized Sosthenes, the ruler of the synagogue, and beat him before the judgment seat. Gallio didn’t care about any of these things."},{"type":"h2","text":"Paul Returns to Antioch"},{"type":"img","src":"img/acts18-v18.jpg","w":1100,"h":733,"alt":"Boats in a harbor below snowy mountains"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Paul, having stayed after this many more days, took his leave of the brothers, and sailed from there for Syria, together with Priscilla and Aquila. He shaved his head in Cenchreae, for he had a vow. <sup class=\"v\">19<\/sup> He came to Ephesus, and he left them there; but he himself entered into the synagogue, and reasoned with the Jews. <sup class=\"v\">20<\/sup> When they asked him to stay with them a longer time, he declined; <sup class=\"v\">21<\/sup> but taking his leave of them, he said, “I must by all means keep this coming feast in Jerusalem, but I will return again to you if God wills.” Then he set sail from Ephesus."},{"type":"p","html":"<sup class=\"v\">22<\/sup> When he had landed at Caesarea, he went up and greeted the assembly, and went down to Antioch. <sup class=\"v\">23<\/sup> Having spent some time there, he departed, and went through the region of Galatia, and Phrygia, in order, establishing all the disciples."},{"type":"q","id":"18.4","field":"q115","text":"<b>Heart:<\/b> Look at the image of the harbor. Paul traveled on, “establishing all the disciples” (v. 23). Who has strengthened your faith?"},{"type":"h2","text":"Apollos Is Taught"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Now a certain Jew named Apollos, an Alexandrian by race, an eloquent man, came to Ephesus. He was mighty in the Scriptures. <sup class=\"v\">25<\/sup> This man had been instructed in the way of the Lord; and being fervent in spirit, he spoke and taught accurately the things concerning Jesus, although he knew only the baptism of John."},{"type":"img","src":"img/acts18-v26.jpg","w":1100,"h":714,"alt":"A teacher correcting a student’s work"},{"type":"p","html":"<sup class=\"v\">26<\/sup> He began to speak boldly in the synagogue. But when Priscilla and Aquila heard him, they took him aside, and explained to him the way of God more accurately."},{"type":"p","html":"<sup class=\"v\">27<\/sup> When he had determined to pass over into Achaia, the brothers encouraged him, and wrote to the disciples to receive him. When he had come, he greatly helped those who had believed through grace; <sup class=\"v\">28<\/sup> for he powerfully refuted the Jews, publicly showing by the Scriptures that Jesus was the Christ."},{"type":"q","id":"18.5","field":"q116","text":"<b>Action:<\/b> Consider the image of the mentor. Priscilla and Aquila took Apollos aside and “explained to him the way of God more accurately” (v. 26). How can you gently help others grow? Whom could you help this week?"},{"type":"q","id":"18.6","field":"q117","text":"<b>Head:<\/b> Apollos was eloquent and “greatly helped those who had believed through grace” (v. 27). What gifts has God given you to help others?"}],"prayer":"God, you told Paul, “Don’t be afraid, but speak and don’t be silent” (18:9). Give me wisdom as I read, and help me speak for you, knowing that you are with me (18:10)."},{"num":19,"hero":{"src":"img/acts19-hero.jpg","w":1100,"h":733,"alt":"An ancient stone theater"},"blocks":[{"type":"h2","text":"Paul in Ephesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> While Apollos was at Corinth, Paul, having passed through the upper country, came to Ephesus and found certain disciples. <sup class=\"v\">2<\/sup> He said to them, “Did you receive the Holy Spirit when you believed?”"},{"type":"p","html":"They said to him, “No, we haven’t even heard that there is a Holy Spirit.”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> He said, “Into what then were you baptized?”"},{"type":"p","html":"They said, “Into John’s baptism.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Paul said, “John indeed baptized with the baptism of repentance, saying to the people that they should believe in the one who would come after him, that is, in Jesus.”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> When they heard this, they were baptized in the name of the Lord Jesus. <sup class=\"v\">6<\/sup> When Paul had laid his hands on them, the Holy Spirit came on them and they spoke with other languages and prophesied. <sup class=\"v\">7<\/sup> They were about twelve men in all. <sup class=\"v\">8<\/sup> He entered into the synagogue and spoke boldly for a period of three months, reasoning and persuading about the things concerning God’s Kingdom."},{"type":"q","id":"19.1","field":"q118","text":"<b>Heart:<\/b> Paul asked some disciples, “Did you receive the Holy Spirit when you believed?” (v. 2). What difference does the Holy Spirit make in your life?"},{"type":"p","html":"<sup class=\"v\">9<\/sup> But when some were hardened and disobedient, speaking evil of the Way before the multitude, he departed from them, and separated the disciples, reasoning daily in the school of Tyrannus. <sup class=\"v\">10<\/sup> This continued for two years, so that all those who lived in Asia heard the word of the Lord Jesus, both Jews and Greeks."},{"type":"q","id":"19.2","field":"q119","text":"<b>Head:<\/b> Look at the image that opens this chapter. Paul reasoned daily in the lecture hall for two years, so that all who lived in Asia heard the word (v. 9-10). What does faithful, steady work for God look like?"},{"type":"h2","text":"The Sons of Sceva"},{"type":"img","src":"img/acts19-v11.jpg","w":1100,"h":733,"alt":"A lace handkerchief"},{"type":"p","html":"<sup class=\"v\">11<\/sup> God worked special miracles by the hands of Paul, <sup class=\"v\">12<\/sup> so that even handkerchiefs or aprons were carried away from his body to the sick, and the diseases departed from them, and the evil spirits went out. <sup class=\"v\">13<\/sup> But some of the itinerant Jews, exorcists, took on themselves to invoke over those who had the evil spirits the name of the Lord Jesus, saying, “We adjure you by Jesus whom Paul preaches.” <sup class=\"v\">14<\/sup> There were seven sons of one Sceva, a Jewish chief priest, who did this."},{"type":"p","html":"<sup class=\"v\">15<\/sup> The evil spirit answered, “Jesus I know, and Paul I know, but who are you?” <sup class=\"v\">16<\/sup> The man in whom the evil spirit was leaped on them, overpowered them, and prevailed against them, so that they fled out of that house naked and wounded. <sup class=\"v\">17<\/sup> This became known to all, both Jews and Greeks, who lived at Ephesus. Fear fell on them all, and the name of the Lord Jesus was magnified."},{"type":"img","src":"img/acts19-v18.jpg","w":1100,"h":733,"alt":"A book burning in a fire"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Many also of those who had believed came, confessing, and declaring their deeds. <sup class=\"v\">19<\/sup> Many of those who practiced magical arts brought their books together and burned them in the sight of all. They counted their price, and found it to be fifty thousand pieces of silver. <sup class=\"v\">20<\/sup> So the word of the Lord was growing and becoming mighty."},{"type":"q","id":"19.3","field":"q120","text":"<b>Head:<\/b> Consider the image of the cloth. God did special miracles through Paul (v. 11-12). How do you understand God’s healing power today?"},{"type":"q","id":"19.4","field":"q121","text":"<b>Action:<\/b> Look at the image of the burning book. Many who practiced magic brought their books and burned them (v. 19). What would you need to give up to follow Jesus more fully? What step will you take this week?"},{"type":"q","id":"19.5","field":"q122","text":"<b>Heart:<\/b> “So the word of the Lord was growing and becoming mighty” (v. 20). Where do you see God’s word growing today?"},{"type":"h2","text":"The Riot in Ephesus"},{"type":"p","html":"<sup class=\"v\">21<\/sup> Now after these things had ended, Paul determined in the Spirit, when he had passed through Macedonia and Achaia, to go to Jerusalem, saying, “After I have been there, I must also see Rome.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Having sent into Macedonia two of those who served him, Timothy and Erastus, he himself stayed in Asia for a while. <sup class=\"v\">23<\/sup> About that time there arose no small disturbance concerning the Way."},{"type":"img","src":"img/acts19-v24.jpg","w":1100,"h":734,"alt":"A silversmith at work"},{"type":"p","html":"<sup class=\"v\">24<\/sup> For a certain man named Demetrius, a silversmith who made silver shrines of Artemis, brought no little business to the craftsmen, <sup class=\"v\">25<\/sup> whom he gathered together, with the workmen of like occupation, and said, “Sirs, you know that by this business we have our wealth. <sup class=\"v\">26<\/sup> You see and hear that not at Ephesus alone, but almost throughout all Asia, this Paul has persuaded and turned away many people, saying that they are no gods that are made with hands. <sup class=\"v\">27<\/sup> Not only is there danger that this our trade come into disrepute, but also that the temple of the great goddess Artemis will be counted as nothing and her majesty destroyed, whom all Asia and the world worships.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> When they heard this they were filled with anger, and cried out, saying, “Great is Artemis of the Ephesians!” <sup class=\"v\">29<\/sup> The whole city was filled with confusion, and they rushed with one accord into the theater, having seized Gaius and Aristarchus, men of Macedonia, Paul’s companions in travel. <sup class=\"v\">30<\/sup> When Paul wanted to enter in to the people, the disciples didn’t allow him. <sup class=\"v\">31<\/sup> Certain also of the Asiarchs, being his friends, sent to him and begged him not to venture into the theater. <sup class=\"v\">32<\/sup> Some therefore cried one thing, and some another, for the assembly was in confusion. Most of them didn’t know why they had come together. <sup class=\"v\">33<\/sup> They brought Alexander out of the multitude, the Jews putting him forward. Alexander beckoned with his hand, and would have made a defense to the people. <sup class=\"v\">34<\/sup> But when they perceived that he was a Jew, all with one voice for a time of about two hours cried out, “Great is Artemis of the Ephesians!”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> When the town clerk had quieted the multitude, he said, “You men of Ephesus, what man is there who doesn’t know that the city of the Ephesians is temple keeper of the great goddess Artemis, and of the image which fell down from Zeus? <sup class=\"v\">36<\/sup> Seeing then that these things can’t be denied, you ought to be quiet and to do nothing rash. <sup class=\"v\">37<\/sup> For you have brought these men here, who are neither robbers of temples nor blasphemers of your goddess. <sup class=\"v\">38<\/sup> If therefore Demetrius and the craftsmen who are with him have a matter against anyone, the courts are open, and there are proconsuls. Let them press charges against one another. <sup class=\"v\">39<\/sup> But if you seek anything about other matters, it will be settled in the regular assembly. <sup class=\"v\">40<\/sup> For indeed we are in danger of being accused concerning today’s riot, there being no cause. Concerning it, we wouldn’t be able to give an account of this commotion.” <sup class=\"v\">41<\/sup> When he had thus spoken, he dismissed the assembly."},{"type":"q","id":"19.6","field":"q123","text":"<b>Head:<\/b> Consider the image of the workshop. The silversmiths feared losing money because of the gospel (v. 25-27). How can money and business interests stand in the way of truth?"},{"type":"q","id":"19.7","field":"q124","text":"<b>Action:<\/b> Choose one image from this chapter. If an image is worth a thousand words, what words would you put with it? Share them with someone this week."}],"prayer":"Father in heaven, your word “was growing and becoming mighty” (19:20). Give me wisdom as I read, and help me turn away from anything that competes with you (19:18–19)."},{"num":20,"hero":{"src":"img/acts20-hero.jpg","w":1100,"h":825,"alt":"Candles glowing over a table set with bread"},"blocks":[{"type":"h2","text":"Through Macedonia and Greece"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After the uproar had ceased, Paul sent for the disciples, took leave of them, and departed to go into Macedonia. <sup class=\"v\">2<\/sup> When he had gone through those parts, and had encouraged them with many words, he came into Greece. <sup class=\"v\">3<\/sup> When he had spent three months there, and a plot was made against him by Jews as he was about to set sail for Syria, he determined to return through Macedonia. <sup class=\"v\">4<\/sup> These accompanied him as far as Asia: Sopater of Beroea; Aristarchus and Secundus of the Thessalonians; Gaius of Derbe; Timothy; and Tychicus and Trophimus of Asia. <sup class=\"v\">5<\/sup> But these had gone ahead, and were waiting for us at Troas. <sup class=\"v\">6<\/sup> We sailed away from Philippi after the days of Unleavened Bread, and came to them at Troas in five days, where we stayed seven days."},{"type":"h2","text":"Eutychus Raised from the Dead"},{"type":"p","html":"<sup class=\"v\">7<\/sup> On the first day of the week, when the disciples were gathered together to break bread, Paul talked with them, intending to depart on the next day, and continued his speech until midnight. <sup class=\"v\">8<\/sup> There were many lights in the upper room where we were gathered together."},{"type":"img","src":"img/acts20-v09.jpg","w":1100,"h":778,"alt":"An open window at night"},{"type":"p","html":"<sup class=\"v\">9<\/sup> A certain young man named Eutychus sat in the window, weighed down with deep sleep. As Paul spoke still longer, being weighed down by his sleep, he fell down from the third floor and was taken up dead. <sup class=\"v\">10<\/sup> Paul went down and fell upon him, and embracing him said, “Don’t be troubled, for his life is in him.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> When he had gone up, and had broken bread and eaten, and had talked with them a long while, even until break of day, he departed. <sup class=\"v\">12<\/sup> They brought the boy in alive, and were greatly comforted."},{"type":"q","id":"20.1","field":"q125","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The believers gathered “to break bread” and there were many lights in the upper room (v. 7-8). What makes gathering with other believers important to you?"},{"type":"q","id":"20.2","field":"q126","text":"<b>Heart:<\/b> Consider the image of the window. Eutychus fell asleep in the window and fell, but God brought him back to life, and they “were greatly comforted” (v. 12). When has God turned a frightening moment into comfort?"},{"type":"p","html":"<sup class=\"v\">13<\/sup> But we, going ahead to the ship, set sail for Assos, intending to take Paul aboard there; for he had so arranged, intending himself to go by land. <sup class=\"v\">14<\/sup> When he met us at Assos, we took him aboard, and came to Mitylene. <sup class=\"v\">15<\/sup> Sailing from there, we came the following day opposite Chios. The next day we touched at Samos and stayed at Trogyllium, and the day after we came to Miletus. <sup class=\"v\">16<\/sup> For Paul had determined to sail past Ephesus, that he might not have to spend time in Asia; for he was hastening, if it were possible for him, to be in Jerusalem on the day of Pentecost."},{"type":"h2","text":"Paul Says Goodbye to the Ephesian Elders"},{"type":"p","html":"<sup class=\"v\">17<\/sup> From Miletus he sent to Ephesus, and called to himself the elders of the assembly. <sup class=\"v\">18<\/sup> When they had come to him, he said to them, “You yourselves know, from the first day that I set foot in Asia, how I was with you all the time, <sup class=\"v\">19<\/sup> serving the Lord with all humility, with many tears, and with trials which happened to me by the plots of the Jews; <sup class=\"v\">20<\/sup> how I didn’t shrink from declaring to you anything that was profitable, teaching you publicly and from house to house, <sup class=\"v\">21<\/sup> testifying both to Jews and to Greeks repentance toward God, and faith toward our Lord Jesus. <sup class=\"v\">22<\/sup> Now, behold, I go bound by the Spirit to Jerusalem, not knowing what will happen to me there; <sup class=\"v\">23<\/sup> except that the Holy Spirit testifies in every city, saying that bonds and afflictions wait for me."},{"type":"img","src":"img/acts20-v24.jpg","w":1100,"h":736,"alt":"Runners racing on a track"},{"type":"p","html":"<sup class=\"v\">24<\/sup> But these things don’t count; nor do I hold my life dear to myself, so that I may finish my race with joy, and the ministry which I received from the Lord Jesus, to fully testify to the Good News of the grace of God."},{"type":"q","id":"20.3","field":"q127","text":"<b>Head:<\/b> Paul told the elders he had served the Lord “with all humility, with many tears” (v. 19). What does humble service look like?"},{"type":"p","html":"<sup class=\"v\">25<\/sup> “Now, behold, I know that you all, among whom I went about preaching God’s Kingdom, will see my face no more. <sup class=\"v\">26<\/sup> Therefore I testify to you today that I am clean from the blood of all men, <sup class=\"v\">27<\/sup> for I didn’t shrink from declaring to you the whole counsel of God. <sup class=\"v\">28<\/sup> Take heed, therefore, to yourselves, and to all the flock, in which the Holy Spirit has made you overseers, to shepherd the assembly of the Lord and God which he purchased with his own blood. <sup class=\"v\">29<\/sup> For I know that after my departure, vicious wolves will enter in among you, not sparing the flock. <sup class=\"v\">30<\/sup> Men will arise from among your own selves, speaking perverse things, to draw away the disciples after them. <sup class=\"v\">31<\/sup> Therefore watch, remembering that for a period of three years I didn’t cease to admonish everyone night and day with tears. <sup class=\"v\">32<\/sup> Now, brothers, I entrust you to God and to the word of his grace, which is able to build up, and to give you the inheritance among all those who are sanctified. <sup class=\"v\">33<\/sup> I coveted no one’s silver, gold, or clothing. <sup class=\"v\">34<\/sup> You yourselves know that these hands served my necessities, and those who were with me. <sup class=\"v\">35<\/sup> In all things I gave you an example, that so laboring you ought to help the weak, and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’”"},{"type":"q","id":"20.4","field":"q128","text":"<b>Action:<\/b> Look at the image of the runners. Paul said, “so that I may finish my race with joy” (v. 24). What race has God given you to run? What will help you finish it with joy?"},{"type":"q","id":"20.5","field":"q129","text":"<b>Action:<\/b> Paul told the elders to “shepherd the assembly of the Lord and God” (v. 28). Who are the shepherds in your life? How will you support them this week?"},{"type":"q","id":"20.6","field":"q130","text":"<b>Head:<\/b> Paul reminded them of Jesus’ words, “It is more blessed to give than to receive” (v. 35). Why is it more blessed to give? When have you found this to be true?"},{"type":"p","html":"<sup class=\"v\">36<\/sup> When he had spoken these things, he knelt down and prayed with them all."},{"type":"img","src":"img/acts20-v37.jpg","w":1100,"h":700,"alt":"Two children hugging"},{"type":"p","html":"<sup class=\"v\">37<\/sup> They all wept freely, and fell on Paul’s neck and kissed him, <sup class=\"v\">38<\/sup> sorrowing most of all because of the word which he had spoken, that they should see his face no more. Then they accompanied him to the ship."},{"type":"q","id":"20.7","field":"q131","text":"<b>Heart:<\/b> Consider the image of the hug. They all wept and embraced Paul (v. 37). How does God comfort us when we must say goodbye?"}],"prayer":"Father in heaven, your church was “purchased with his own blood” (20:28). Give me wisdom as I read, and help me “finish my race with joy” (20:24)."},{"num":21,"hero":{"src":"img/acts21-hero.jpg","w":1100,"h":733,"alt":"People standing on a beach by the sea"},"blocks":[{"type":"h2","text":"Paul Goes to Jerusalem"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When we had departed from them and had set sail, we came with a straight course to Cos, and the next day to Rhodes, and from there to Patara. <sup class=\"v\">2<\/sup> Having found a ship crossing over to Phoenicia, we went aboard, and set sail. <sup class=\"v\">3<\/sup> When we had come in sight of Cyprus, leaving it on the left hand, we sailed to Syria and landed at Tyre, for the ship was there to unload her cargo. <sup class=\"v\">4<\/sup> Having found disciples, we stayed there seven days. These said to Paul through the Spirit that he should not go up to Jerusalem."},{"type":"img","src":"img/acts21-v05.jpg","w":1100,"h":733,"alt":"A parent and child walking on the beach at sunset"},{"type":"p","html":"<sup class=\"v\">5<\/sup> When those days were over, we departed and went on our journey. They all, with wives and children, brought us on our way until we were out of the city. Kneeling down on the beach, we prayed. <sup class=\"v\">6<\/sup> After saying goodbye to each other, we went on board the ship, and they returned home again."},{"type":"q","id":"21.1","field":"q132","text":"<b>Heart:<\/b> Look at the image of the family on the beach. The believers, with their wives and children, walked with Paul to the shore, and “kneeling down on the beach, we prayed” (v. 5). What does it mean to you to be sent off with prayer?"},{"type":"p","html":"<sup class=\"v\">7<\/sup> When we had finished the voyage from Tyre, we arrived at Ptolemais. We greeted the brothers and stayed with them one day. <sup class=\"v\">8<\/sup> On the next day, we who were Paul’s companions departed, and came to Caesarea."},{"type":"p","html":"We entered into the house of Philip the evangelist, who was one of the seven, and stayed with him. <sup class=\"v\">9<\/sup> Now this man had four virgin daughters who prophesied. <sup class=\"v\">10<\/sup> As we stayed there some days, a certain prophet named Agabus came down from Judea."},{"type":"img","src":"img/acts21-v11.jpg","w":1100,"h":730,"alt":"A coiled leather belt"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Coming to us and taking Paul’s belt, he bound his own feet and hands, and said, “The Holy Spirit says: ‘So the Jews at Jerusalem will bind the man who owns this belt, and will deliver him into the hands of the Gentiles.’ ”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> When we heard these things, both we and the people of that place begged him not to go up to Jerusalem. <sup class=\"v\">13<\/sup> Then Paul answered, “What are you doing, weeping and breaking my heart? For I am ready not only to be bound, but also to die at Jerusalem for the name of the Lord Jesus.”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> When he would not be persuaded, we ceased, saying, “The Lord’s will be done.”"},{"type":"q","id":"21.2","field":"q133","text":"<b>Head:<\/b> Consider the image of the belt. Agabus tied himself with Paul’s belt to show that Paul would be bound in Jerusalem (v. 11). Why did Agabus act out his message? How do you respond when obeying God may lead to hardship?"},{"type":"q","id":"21.3","field":"q134","text":"<b>Head:<\/b> Paul said, “I am ready not only to be bound, but also to die at Jerusalem for the name of the Lord Jesus” (v. 13). What gave Paul such courage?"},{"type":"q","id":"21.4","field":"q135","text":"<b>Heart:<\/b> His friends finally said, “The Lord’s will be done” (v. 14). When have you had to pray those words?"},{"type":"p","html":"<sup class=\"v\">15<\/sup> After these days we took up our baggage and went up to Jerusalem. <sup class=\"v\">16<\/sup> Some of the disciples from Caesarea also went with us, bringing one Mnason of Cyprus, an early disciple, with whom we would stay."},{"type":"h2","text":"Paul Visits James"},{"type":"p","html":"<sup class=\"v\">17<\/sup> When we had come to Jerusalem, the brothers received us gladly. <sup class=\"v\">18<\/sup> The day following, Paul went in with us to James; and all the elders were present. <sup class=\"v\">19<\/sup> When he had greeted them, he reported one by one the things which God had worked among the Gentiles through his ministry. <sup class=\"v\">20<\/sup> They, when they heard it, glorified God. They said to him, “You see, brother, how many thousands there are among the Jews of those who have believed, and they are all zealous for the law. <sup class=\"v\">21<\/sup> They have been informed about you, that you teach all the Jews who are among the Gentiles to forsake Moses, telling them not to circumcise their children and not to walk after the customs. <sup class=\"v\">22<\/sup> What then? The assembly must certainly meet, for they will hear that you have come. <sup class=\"v\">23<\/sup> Therefore do what we tell you. We have four men who have taken a vow. <sup class=\"v\">24<\/sup> Take them and purify yourself with them, and pay their expenses for them, that they may shave their heads. Then all will know that there is no truth in the things that they have been informed about you, but that you yourself also walk keeping the law. <sup class=\"v\">25<\/sup> But concerning the Gentiles who believe, we have written our decision that they should observe no such thing, except that they should keep themselves from food offered to idols, from blood, from strangled things, and from sexual immorality.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> Then Paul took the men, and the next day purified himself and went with them into the temple, declaring the fulfillment of the days of purification, until the offering was offered for every one of them."},{"type":"q","id":"21.5","field":"q136","text":"<b>Action:<\/b> When Paul reported what God had done among the Gentiles, the leaders “glorified God” (v. 20). How can you celebrate what God is doing through others this week?"},{"type":"h2","text":"Paul Is Arrested in the Temple"},{"type":"p","html":"<sup class=\"v\">27<\/sup> When the seven days were almost completed, the Jews from Asia, when they saw him in the temple, stirred up all the multitude and laid hands on him, <sup class=\"v\">28<\/sup> crying out, “Men of Israel, help! This is the man who teaches all men everywhere against the people, and the law, and this place. Moreover, he also brought Greeks into the temple, and has defiled this holy place!” <sup class=\"v\">29<\/sup> For they had seen Trophimus, the Ephesian, with him in the city, and they supposed that Paul had brought him into the temple."},{"type":"img","src":"img/acts21-v30.jpg","w":1100,"h":733,"alt":"A crowd on a city street"},{"type":"p","html":"<sup class=\"v\">30<\/sup> All the city was moved and the people ran together. They seized Paul and dragged him out of the temple. Immediately the doors were shut. <sup class=\"v\">31<\/sup> As they were trying to kill him, news came up to the commanding officer of the regiment that all Jerusalem was in an uproar. <sup class=\"v\">32<\/sup> Immediately he took soldiers and centurions and ran down to them. They, when they saw the chief captain and the soldiers, stopped beating Paul. <sup class=\"v\">33<\/sup> Then the commanding officer came near, arrested him, commanded him to be bound with two chains, and inquired who he was and what he had done. <sup class=\"v\">34<\/sup> Some shouted one thing, and some another, among the crowd. When he couldn’t find out the truth because of the noise, he commanded him to be brought into the barracks."},{"type":"p","html":"<sup class=\"v\">35<\/sup> When he came to the stairs, he was carried by the soldiers because of the violence of the crowd; <sup class=\"v\">36<\/sup> for the multitude of the people followed after, crying out, “Away with him!” <sup class=\"v\">37<\/sup> As Paul was about to be brought into the barracks, he asked the commanding officer, “May I speak to you?”"},{"type":"p","html":"He said, “Do you know Greek? <sup class=\"v\">38<\/sup> Aren’t you then the Egyptian, who before these days stirred up to sedition and led out into the wilderness the four thousand men of the Assassins?”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> But Paul said, “I am a Jew, from Tarsus in Cilicia, a citizen of no insignificant city. I beg you, allow me to speak to the people.”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> When he had given him permission, Paul, standing on the stairs, beckoned with his hand to the people. When there was a great silence, he spoke to them in the Hebrew language, saying,"},{"type":"q","id":"21.6","field":"q137","text":"<b>Action:<\/b> Look at the image of the crowd. The whole city was moved and a crowd seized Paul (v. 30). How do you stay calm and faithful when others are angry? What will help you do that next time?"}],"prayer":"God, your will is good even when the road is hard. Give me wisdom as I read, and help me say with Paul’s friends, “The Lord’s will be done” (21:14)."},{"num":22,"hero":{"src":"img/acts22-hero.jpg","w":1100,"h":700,"alt":"Stairs in a city"},"blocks":[{"type":"h2","text":"Paul Tells His Story"},{"type":"p","html":"<sup class=\"v\">1<\/sup> “Brothers and fathers, listen to the defense which I now make to you.”"},{"type":"p","html":"<sup class=\"v\">2<\/sup> When they heard that he spoke to them in the Hebrew language, they were even more quiet. He said, <sup class=\"v\">3<\/sup> “I am indeed a Jew, born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, instructed according to the strict tradition of the law of our fathers, being zealous for God, even as you all are today. <sup class=\"v\">4<\/sup> I persecuted this Way to the death, binding and delivering into prisons both men and women. <sup class=\"v\">5<\/sup> As also the high priest and all the council of the elders testify, from whom also I received letters to the brothers, and traveled to Damascus to bring them also who were there to Jerusalem in bonds to be punished."},{"type":"q","id":"22.1","field":"q138","text":"<b>Head:<\/b> Look at the image that opens this chapter. Standing on the stairs, Paul told the crowd his story (v. 1-3). Why is your own story of faith powerful?"},{"type":"img","src":"img/acts22-v06.jpg","w":1100,"h":711,"alt":"Bright sunlight breaking through trees"},{"type":"p","html":"<sup class=\"v\">6<\/sup> As I made my journey, and came close to Damascus, about noon, suddenly a great light shone around me from the sky. <sup class=\"v\">7<\/sup> I fell to the ground, and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’ <sup class=\"v\">8<\/sup> I answered, ‘Who are you, Lord?’ He said to me, ‘I am Jesus of Nazareth, whom you persecute.’"},{"type":"p","html":"<sup class=\"v\">9<\/sup> “Those who were with me indeed saw the light and were afraid, but they didn’t understand the voice of him who spoke to me. <sup class=\"v\">10<\/sup> I said, ‘What shall I do, Lord?’ The Lord said to me, ‘Arise, and go into Damascus. There you will be told about all things which are appointed for you to do.’ <sup class=\"v\">11<\/sup> When I couldn’t see for the glory of that light, being led by the hand of those who were with me, I came into Damascus. <sup class=\"v\">12<\/sup> One Ananias, a devout man according to the law, well reported of by all the Jews who lived in Damascus, <sup class=\"v\">13<\/sup> came to me, and standing by me said to me, ‘Brother Saul, receive your sight!’ In that very hour I looked up at him. <sup class=\"v\">14<\/sup> He said, ‘The God of our fathers has appointed you to know his will, and to see the Righteous One, and to hear a voice from his mouth. <sup class=\"v\">15<\/sup> For you will be a witness for him to all men of what you have seen and heard."},{"type":"q","id":"22.2","field":"q139","text":"<b>Action:<\/b> Consider the image of the bright light. At noon a great light shone around Paul (v. 6). He asked, “What shall I do, Lord?” (v. 10). How would you answer that question in your life today?"},{"type":"img","src":"img/acts22-v16.jpg","w":1100,"h":733,"alt":"Water pouring over hands"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Now why do you wait? Arise, be baptized, and wash away your sins, calling on the name of the Lord.’"},{"type":"q","id":"22.3","field":"q140","text":"<b>Heart:<\/b> Ananias told Paul, “You will be a witness for him to all men of what you have seen and heard” (v. 15). What have you seen and heard of God?"},{"type":"q","id":"22.4","field":"q141","text":"<b>Action:<\/b> Look at the image of the washing. “Now why do you wait? Arise, be baptized, and wash away your sins” (v. 16). What might you be waiting to do in obedience to God?"},{"type":"p","html":"<sup class=\"v\">17<\/sup> “When I had returned to Jerusalem, and while I prayed in the temple, I fell into a trance, <sup class=\"v\">18<\/sup> and saw him saying to me, ‘Hurry and get out of Jerusalem quickly, because they will not receive testimony concerning me from you.’ <sup class=\"v\">19<\/sup> I said, ‘Lord, they themselves know that I imprisoned and beat in every synagogue those who believed in you. <sup class=\"v\">20<\/sup> When the blood of Stephen, your witness, was shed, I also was standing by, consenting to his death, and guarding the cloaks of those who killed him.’"},{"type":"p","html":"<sup class=\"v\">21<\/sup> “He said to me, ‘Depart, for I will send you out far from here to the Gentiles.’”"},{"type":"q","id":"22.5","field":"q142","text":"<b>Heart:<\/b> Jesus told Paul, “Depart, for I will send you out far from here to the Gentiles” (v. 21). Where might God be sending you?"},{"type":"h2","text":"Paul the Roman Citizen"},{"type":"p","html":"<sup class=\"v\">22<\/sup> They listened to him until he said that; then they lifted up their voice and said, “Rid the earth of this fellow, for he isn’t fit to live!”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> As they cried out, threw off their cloaks, and threw dust into the air, <sup class=\"v\">24<\/sup> the commanding officer commanded him to be brought into the barracks, ordering him to be examined by scourging, that he might know for what crime they shouted against him like that."},{"type":"img","src":"img/acts22-v25.jpg","w":1100,"h":733,"alt":"An old handwritten document"},{"type":"p","html":"<sup class=\"v\">25<\/sup> When they had tied him up with thongs, Paul asked the centurion who stood by, “Is it lawful for you to scourge a man who is a Roman, and not found guilty?”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> When the centurion heard it, he went to the commanding officer and told him, “Watch what you are about to do, for this man is a Roman!”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> The commanding officer came and asked him, “Tell me, are you a Roman?”"},{"type":"p","html":"He said, “Yes.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> The commanding officer answered, “I bought my citizenship for a great price.”"},{"type":"p","html":"Paul said, “But I was born a Roman.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Immediately those who were about to examine him departed from him, and the commanding officer also was afraid when he realized that he was a Roman, because he had bound him. <sup class=\"v\">30<\/sup> But on the next day, desiring to know the truth about why he was accused by the Jews, he freed him from the bonds, and commanded the chief priests and all the council to come together, and brought Paul down and set him before them."},{"type":"q","id":"22.6","field":"q143","text":"<b>Head:<\/b> Consider the image of the document. Paul used his rights as a Roman citizen wisely (v. 25). How can Christians use their rights and freedoms to serve God?"}],"prayer":"God, you call people to see and hear your Son and then to tell others (22:15). Give me wisdom as I read, and help me tell my own story of how you met me."},{"num":23,"hero":{"src":"img/acts23-hero.jpg","w":1100,"h":588,"alt":"A judge’s gavel"},"blocks":[{"type":"h2","text":"Paul Before the Council"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Paul, looking steadfastly at the council, said, “Brothers, I have lived before God in all good conscience until today.”"},{"type":"p","html":"<sup class=\"v\">2<\/sup> The high priest, Ananias, commanded those who stood by him to strike him on the mouth."},{"type":"p","html":"<sup class=\"v\">3<\/sup> Then Paul said to him, “God will strike you, you whitewashed wall! Do you sit to judge me according to the law, and command me to be struck contrary to the law?”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Those who stood by said, “Do you malign God’s high priest?”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Paul said, “I didn’t know, brothers, that he was high priest. For it is written, ‘You shall not speak evil of a ruler of your people.’ ” <sup class=\"v\">6<\/sup> But when Paul perceived that the one part were Sadducees and the other Pharisees, he cried out in the council, “Men and brothers, I am a Pharisee, a son of Pharisees. Concerning the hope and resurrection of the dead I am being judged!”"},{"type":"q","id":"23.1","field":"q144","text":"<b>Action:<\/b> Look at the image that opens this chapter. Paul said, “I have lived before God in all good conscience until today” (v. 1). What helps you keep a clear conscience? Is there anything you need to make right this week?"},{"type":"p","html":"<sup class=\"v\">7<\/sup> When he had said this, an argument arose between the Pharisees and Sadducees, and the crowd was divided. <sup class=\"v\">8<\/sup> For the Sadducees say that there is no resurrection, nor angel, nor spirit; but the Pharisees confess all of these. <sup class=\"v\">9<\/sup> A great clamor arose, and some of the scribes of the Pharisees’ part stood up, and contended, saying, “We find no evil in this man. But if a spirit or angel has spoken to him, let’s not fight against God!”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> When a great argument arose, the commanding officer, fearing that Paul would be torn in pieces by them, commanded the soldiers to go down and take him by force from among them, and bring him into the barracks."},{"type":"q","id":"23.2","field":"q145","text":"<b>Action:<\/b> Paul’s words caused a great argument in the council (v. 7-10). How do you stay faithful when things become heated? What will you do next time?"},{"type":"img","src":"img/acts23-v11.jpg","w":1100,"h":639,"alt":"A man sitting by a window at night"},{"type":"p","html":"<sup class=\"v\">11<\/sup> The following night, the Lord stood by him and said, “Cheer up, Paul, for as you have testified about me at Jerusalem, so you must testify also at Rome.”"},{"type":"q","id":"23.3","field":"q146","text":"<b>Heart:<\/b> Consider the image of the night window. The Lord stood by Paul at night and said, “Cheer up, Paul, for as you have testified about me at Jerusalem, so you must testify also at Rome” (v. 11). When has God given you courage at a lonely time?"},{"type":"h2","text":"The Plot to Kill Paul"},{"type":"p","html":"<sup class=\"v\">12<\/sup> When it was day, some of the Jews banded together, and bound themselves under a curse, saying that they would neither eat nor drink until they had killed Paul. <sup class=\"v\">13<\/sup> There were more than forty people who had made this conspiracy. <sup class=\"v\">14<\/sup> They came to the chief priests and the elders, and said, “We have bound ourselves under a great curse to taste nothing until we have killed Paul. <sup class=\"v\">15<\/sup> Now therefore, you with the council inform the commanding officer that he should bring him down to you tomorrow, as though you were going to judge his case more exactly. We are ready to kill him before he comes near.”"},{"type":"img","src":"img/acts23-v16.jpg","w":1100,"h":730,"alt":"Two boys talking"},{"type":"p","html":"<sup class=\"v\">16<\/sup> But Paul’s sister’s son heard they were lying in wait, and he came and entered into the barracks and told Paul. <sup class=\"v\">17<\/sup> Paul summoned one of the centurions, and said, “Bring this young man to the commanding officer, for he has something to tell him.”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> So he took him, and brought him to the commanding officer, and said, “Paul, the prisoner, summoned me and asked me to bring this young man to you. He has something to tell you.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> The commanding officer took him by the hand, and going aside, asked him privately, “What is it that you have to tell me?”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> He said, “The Jews have agreed to ask you to bring Paul down to the council tomorrow, as though intending to inquire somewhat more accurately concerning him. <sup class=\"v\">21<\/sup> Therefore don’t yield to them, for more than forty men lie in wait for him, who have bound themselves under a curse to neither eat nor drink until they have killed him. Now they are ready, looking for the promise from you.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> So the commanding officer let the young man go, charging him, “Tell no one that you have revealed these things to me.”"},{"type":"q","id":"23.4","field":"q147","text":"<b>Head:<\/b> Look at the image of the boys talking. Paul’s nephew heard of the plot and told Paul (v. 16). How can God use young people or unlikely helpers?"},{"type":"h2","text":"Paul Is Sent to Felix"},{"type":"img","src":"img/acts23-v23.jpg","w":853,"h":1280,"alt":"A soldier on horseback"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He called to himself two of the centurions, and said, “Prepare two hundred soldiers to go as far as Caesarea, with seventy horsemen, and two hundred men armed with spears, at the third hour of the night.” <sup class=\"v\">24<\/sup> He asked them to provide animals, that they might set Paul on one, and bring him safely to Felix the governor. <sup class=\"v\">25<\/sup> He wrote a letter like this:"},{"type":"p","html":"<sup class=\"v\">26<\/sup> “Claudius Lysias to the most excellent governor Felix: Greetings."},{"type":"p","html":"<sup class=\"v\">27<\/sup> “This man was seized by the Jews, and was about to be killed by them, when I came with the soldiers and rescued him, having learned that he was a Roman. <sup class=\"v\">28<\/sup> Desiring to know the cause why they accused him, I brought him down to their council. <sup class=\"v\">29<\/sup> I found him to be accused about questions of their law, but not to be charged with anything worthy of death or of imprisonment. <sup class=\"v\">30<\/sup> When I was told that the Jews lay in wait for the man, I sent him to you immediately, charging his accusers also to bring their accusations against him before you. Farewell.”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> So the soldiers, carrying out their orders, took Paul and brought him by night to Antipatris. <sup class=\"v\">32<\/sup> But on the next day they left the horsemen to go with him, and returned to the barracks. <sup class=\"v\">33<\/sup> When they came to Caesarea and delivered the letter to the governor, they also presented Paul to him. <sup class=\"v\">34<\/sup> When the governor had read it, he asked what province he was from. When he understood that he was from Cilicia, he said, <sup class=\"v\">35<\/sup> “I will hear you fully when your accusers also arrive.” He commanded that he be kept in Herod’s palace."},{"type":"q","id":"23.5","field":"q148","text":"<b>Heart:<\/b> Consider the image of the soldier on horseback. Paul was protected by many soldiers as he traveled by night (v. 23). How has God protected you through unexpected means?"},{"type":"q","id":"23.6","field":"q149","text":"<b>Head:<\/b> Looking back over this chapter, how do you see God keeping his promise to Paul?"}],"prayer":"Father in heaven, your Son stood by Paul in the night and said, “Cheer up” (23:11). Give me wisdom as I read, and help me trust that you are with me in danger."},{"num":24,"hero":{"src":"img/acts24-hero.jpg","w":1100,"h":828,"alt":"A courtroom"},"blocks":[{"type":"h2","text":"Paul Before Felix"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After five days, the high priest, Ananias, came down with certain elders and an orator, one Tertullus. They informed the governor against Paul. <sup class=\"v\">2<\/sup> When he was called, Tertullus began to accuse him, saying, “Seeing that by you we enjoy much peace, and that prosperity is coming to this nation by your foresight, <sup class=\"v\">3<\/sup> we accept it in all ways and in all places, most excellent Felix, with all thankfulness. <sup class=\"v\">4<\/sup> But that I don’t delay you, I entreat you to bear with us and hear a few words. <sup class=\"v\">5<\/sup> For we have found this man to be a plague, an instigator of insurrections among all the Jews throughout the world, and a ringleader of the sect of the Nazarenes. <sup class=\"v\">6<\/sup> He even tried to profane the temple, and we arrested him. <sup class=\"v\">7<\/sup>  <sup class=\"v\">8<\/sup> By examining him yourself you may ascertain all these things of which we accuse him.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> The Jews also joined in the attack, affirming that these things were so. <sup class=\"v\">10<\/sup> When the governor had beckoned to him to speak, Paul answered, “Because I know that you have been a judge of this nation for many years, I cheerfully make my defense, <sup class=\"v\">11<\/sup> seeing that you can verify that it is not more than twelve days since I went up to worship at Jerusalem. <sup class=\"v\">12<\/sup> In the temple they didn’t find me disputing with anyone or stirring up a crowd, either in the synagogues, or in the city. <sup class=\"v\">13<\/sup> Nor can they prove to you the things of which they now accuse me. <sup class=\"v\">14<\/sup> But this I confess to you, that after the Way, which they call a sect, so I serve the God of our fathers, believing all things which are according to the law, and which are written in the prophets; <sup class=\"v\">15<\/sup> having hope toward God, which these also themselves look for, that there will be a resurrection of the dead, both of the just and unjust."},{"type":"q","id":"24.1","field":"q150","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Paul’s accusers called him “a plague” (v. 5). How do you respond when others speak badly of you?"},{"type":"img","src":"img/acts24-v16.jpg","w":1100,"h":619,"alt":"A clear mountain lake"},{"type":"p","html":"<sup class=\"v\">16<\/sup> In this I also practice always having a conscience void of offense toward God and men. <sup class=\"v\">17<\/sup> Now after some years, I came to bring gifts for the needy to my nation, and offerings; <sup class=\"v\">18<\/sup> amid which certain Jews from Asia found me purified in the temple, not with a mob, nor with turmoil. <sup class=\"v\">19<\/sup> They ought to have been here before you, and to make accusation, if they had anything against me. <sup class=\"v\">20<\/sup> Or else let these men themselves say what injustice they found in me when I stood before the council, <sup class=\"v\">21<\/sup> unless it is for this one thing that I cried standing among them, ‘Concerning the resurrection of the dead I am being judged before you today!’ ”"},{"type":"q","id":"24.2","field":"q151","text":"<b>Heart:<\/b> Paul said, “I serve the God of our fathers” (v. 14) and he had “hope toward God” (v. 15). What is your hope?"},{"type":"q","id":"24.3","field":"q152","text":"<b>Action:<\/b> Consider the image of the clear lake. Paul said, “I also practice always having a conscience void of offense toward God and men” (v. 16). What would help your conscience to be clear? What will you do this week?"},{"type":"h2","text":"Felix Puts Off a Decision"},{"type":"img","src":"img/acts24-v22.jpg","w":1100,"h":733,"alt":"A calendar page"},{"type":"p","html":"<sup class=\"v\">22<\/sup> But Felix, having more exact knowledge concerning the Way, deferred them, saying, “When Lysias, the commanding officer, comes down, I will decide your case.” <sup class=\"v\">23<\/sup> He ordered the centurion that Paul should be kept in custody, and should have some privileges, and not to forbid any of his friends to serve him or to visit him. <sup class=\"v\">24<\/sup> But after some days, Felix came with Drusilla, his wife, who was a Jewess, and sent for Paul, and heard him concerning the faith in Christ Jesus. <sup class=\"v\">25<\/sup> As he reasoned about righteousness, self-control, and the judgment to come, Felix was terrified, and answered, “Go your way for this time, and when it is convenient for me, I will summon you.” <sup class=\"v\">26<\/sup> Meanwhile, he also hoped that money would be given to him by Paul, that he might release him. Therefore also he sent for him more often and talked with him."},{"type":"q","id":"24.4","field":"q153","text":"<b>Head:<\/b> Look at the image of the calendar. Felix became afraid when Paul spoke of righteousness and judgment, and said, “when it is convenient for me, I will summon you” (v. 25). Why do people put off decisions about God?"},{"type":"img","src":"img/acts24-v27.jpg","w":1100,"h":731,"alt":"An old wall clock"},{"type":"p","html":"<sup class=\"v\">27<\/sup> But when two years were fulfilled, Felix was succeeded by Porcius Festus, and desiring to gain favor with the Jews, Felix left Paul in bonds."},{"type":"q","id":"24.5","field":"q154","text":"<b>Action:<\/b> Consider the image of the clock. Paul waited in custody for two years (v. 27). How can you stay faithful during a long season of waiting? What will help you this week?"},{"type":"q","id":"24.6","field":"q155","text":"<b>Head:<\/b> Felix hoped Paul would give him money (v. 26). What can get in the way of hearing the truth?"}],"prayer":"God, you will raise the dead, “both of the just and unjust” (24:15). Give me wisdom as I read, and help me keep “a conscience void of offense toward God and men” (24:16)."},{"num":25,"hero":{"src":"img/acts25-hero.jpg","w":1100,"h":727,"alt":"A grand marble hall"},"blocks":[{"type":"h2","text":"Paul Appeals to Caesar"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Festus therefore, having come into the province, after three days went up to Jerusalem from Caesarea. <sup class=\"v\">2<\/sup> Then the high priest and the principal men of the Jews informed him against Paul, and they begged him, <sup class=\"v\">3<\/sup> asking a favor against him, that he would summon him to Jerusalem; plotting to kill him on the way. <sup class=\"v\">4<\/sup> However Festus answered that Paul should be kept in custody at Caesarea, and that he himself was about to depart shortly. <sup class=\"v\">5<\/sup> “Let them therefore”, he said, “that are in power among you go down with me, and if there is anything wrong in the man, let them accuse him.”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> When he had stayed among them more than ten days, he went down to Caesarea, and on the next day he sat on the judgment seat, and commanded Paul to be brought. <sup class=\"v\">7<\/sup> When he had come, the Jews who had come down from Jerusalem stood around him, bringing against him many and grievous charges which they could not prove, <sup class=\"v\">8<\/sup> while he said in his defense, “Neither against the law of the Jews, nor against the temple, nor against Caesar, have I sinned at all.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> But Festus, desiring to gain favor with the Jews, answered Paul and said, “Are you willing to go up to Jerusalem, and be judged by me there concerning these things?”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> But Paul said, “I am standing before Caesar’s judgment seat, where I ought to be tried. I have done no wrong to the Jews, as you also know very well."},{"type":"img","src":"img/acts25-v11.jpg","w":1100,"h":733,"alt":"A letter sealed with wax"},{"type":"p","html":"<sup class=\"v\">11<\/sup> For if I have done wrong and have committed anything worthy of death, I don’t refuse to die; but if none of those things is true that they accuse me of, no one can give me up to them. I appeal to Caesar!”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Then Festus, when he had conferred with the council, answered, “You have appealed to Caesar. To Caesar you shall go.”"},{"type":"q","id":"25.1","field":"q156","text":"<b>Action:<\/b> Look at the image that opens this chapter. Paul stood before powerful rulers again and again. How do you think he kept his faith steady? What will help you keep yours steady this week?"},{"type":"q","id":"25.2","field":"q157","text":"<b>Action:<\/b> Consider the image of the sealed letter. Paul said, “I appeal to Caesar!” (v. 11). How can Christians use the systems of their society to keep doing God’s work? How could you?"},{"type":"h2","text":"Festus Consults King Agrippa"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Now when some days had passed, King Agrippa and Bernice arrived at Caesarea, and greeted Festus. <sup class=\"v\">14<\/sup> As he stayed there many days, Festus laid Paul’s case before the king, saying, “There is a certain man left a prisoner by Felix; <sup class=\"v\">15<\/sup> about whom, when I was at Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence against him. <sup class=\"v\">16<\/sup> I answered them that it is not the custom of the Romans to give up any man to destruction before the accused has met the accusers face to face and has had opportunity to make his defense concerning the matter laid against him. <sup class=\"v\">17<\/sup> When therefore they had come together here, I didn’t delay, but on the next day sat on the judgment seat and commanded the man to be brought. <sup class=\"v\">18<\/sup> When the accusers stood up, they brought no charges against him of such things as I supposed;"},{"type":"img","src":"img/acts25-v19.jpg","w":1100,"h":733,"alt":"An ancient garden tomb"},{"type":"p","html":"<sup class=\"v\">19<\/sup> but had certain questions against him about their own religion, and about one Jesus, who was dead, whom Paul affirmed to be alive. <sup class=\"v\">20<\/sup> Being perplexed how to inquire concerning these things, I asked whether he was willing to go to Jerusalem and there be judged concerning these matters. <sup class=\"v\">21<\/sup> But when Paul had appealed to be kept for the decision of the emperor, I commanded him to be kept until I could send him to Caesar.”"},{"type":"q","id":"25.3","field":"q158","text":"<b>Head:<\/b> Look at the image of the empty tomb. Festus said the dispute was about “one Jesus, who was dead, whom Paul affirmed to be alive” (v. 19). Why is the resurrection at the center of Paul’s message?"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Agrippa said to Festus, “I also would like to hear the man myself.”"},{"type":"p","html":"“Tomorrow,” he said, “you shall hear him.”"},{"type":"img","src":"img/acts25-v23.jpg","w":1100,"h":744,"alt":"A royal carriage procession"},{"type":"p","html":"<sup class=\"v\">23<\/sup> So on the next day, when Agrippa and Bernice had come with great pomp, and they had entered into the place of hearing with the commanding officers and the principal men of the city, at the command of Festus, Paul was brought in. <sup class=\"v\">24<\/sup> Festus said, “King Agrippa, and all men who are here present with us, you see this man about whom all the multitude of the Jews petitioned me, both at Jerusalem and here, crying that he ought not to live any longer. <sup class=\"v\">25<\/sup> But when I found that he had committed nothing worthy of death, and as he himself appealed to the emperor I determined to send him, <sup class=\"v\">26<\/sup> of whom I have no certain thing to write to my lord. Therefore I have brought him out before you, and especially before you, King Agrippa, that, after examination, I may have something to write. <sup class=\"v\">27<\/sup> For it seems to me unreasonable, in sending a prisoner, not to also specify the charges against him.”"},{"type":"q","id":"25.4","field":"q159","text":"<b>Heart:<\/b> Consider the image of the procession. Agrippa and Bernice came “with great pomp” (v. 23). How does Paul’s quiet faith compare to the rulers’ show of power? Which are you more drawn to?"},{"type":"q","id":"25.5","field":"q160","text":"<b>Heart:<\/b> Festus admitted that Paul had done nothing worthy of death (v. 25). How does God use even unbelievers to protect his people? When has he done that for you?"},{"type":"q","id":"25.6","field":"q161","text":"<b>Head:<\/b> Which image in this chapter helps you understand Paul’s situation? Why?"}],"prayer":"God, you rule over courts and rulers, and you carry out your plans through them (25:11–12). Give me wisdom as I read, and help me trust you when others decide my future."},{"num":26,"hero":{"src":"img/acts26-hero.jpg","w":1100,"h":667,"alt":"A road leading into the morning mist"},"blocks":[{"type":"h2","text":"Paul Speaks to King Agrippa"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Agrippa said to Paul, “You may speak for yourself.”"},{"type":"p","html":"Then Paul stretched out his hand, and made his defense. <sup class=\"v\">2<\/sup> “I think myself happy, King Agrippa, that I am to make my defense before you today concerning all the things that I am accused by the Jews, <sup class=\"v\">3<\/sup> especially because you are expert in all customs and questions which are among the Jews. Therefore I beg you to hear me patiently."},{"type":"p","html":"<sup class=\"v\">4<\/sup> “Indeed, all the Jews know my way of life from my youth up, which was from the beginning among my own nation and at Jerusalem; <sup class=\"v\">5<\/sup> having known me from the first, if they are willing to testify, that after the strictest sect of our religion I lived a Pharisee. <sup class=\"v\">6<\/sup> Now I stand here to be judged for the hope of the promise made by God to our fathers, <sup class=\"v\">7<\/sup> which our twelve tribes, earnestly serving night and day, hope to attain. Concerning this hope I am accused by the Jews, King Agrippa! <sup class=\"v\">8<\/sup> Why is it judged incredible with you, if God does raise the dead?"},{"type":"q","id":"26.1","field":"q162","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Paul spoke of “the hope of the promise made by God to our fathers” (v. 6). What promise of God gives you hope?"},{"type":"p","html":"<sup class=\"v\">9<\/sup> “I myself most certainly thought that I ought to do many things contrary to the name of Jesus of Nazareth. <sup class=\"v\">10<\/sup> I also did this in Jerusalem. I both shut up many of the saints in prisons, having received authority from the chief priests, and when they were put to death I gave my vote against them. <sup class=\"v\">11<\/sup> Punishing them often in all the synagogues, I tried to make them blaspheme. Being exceedingly enraged against them, I persecuted them even to foreign cities."},{"type":"p","html":"<sup class=\"v\">12<\/sup> “Whereupon as I traveled to Damascus with the authority and commission from the chief priests,"},{"type":"img","src":"img/acts26-v13.jpg","w":1100,"h":687,"alt":"The bright sun in a blue sky"},{"type":"p","html":"<sup class=\"v\">13<\/sup> at noon, O king, I saw on the way a light from the sky, brighter than the sun, shining around me and those who traveled with me. <sup class=\"v\">14<\/sup> When we had all fallen to the earth, I heard a voice saying to me in the Hebrew language, ‘Saul, Saul, why are you persecuting me? It is hard for you to kick against the goads.’"},{"type":"p","html":"<sup class=\"v\">15<\/sup> “I said, ‘Who are you, Lord?’"},{"type":"p","html":"“He said, ‘I am Jesus, whom you are persecuting. <sup class=\"v\">16<\/sup> But arise, and stand on your feet, for I have appeared to you for this purpose: to appoint you a servant and a witness both of the things which you have seen, and of the things which I will reveal to you; <sup class=\"v\">17<\/sup> delivering you from the people, and from the Gentiles, to whom I send you,"},{"type":"img","src":"img/acts26-v18.jpg","w":1100,"h":733,"alt":"Light coming through a doorway into a dark room"},{"type":"p","html":"<sup class=\"v\">18<\/sup> to open their eyes, that they may turn from darkness to light and from the power of Satan to God, that they may receive remission of sins and an inheritance among those who are sanctified by faith in me.’"},{"type":"q","id":"26.2","field":"q163","text":"<b>Head:<\/b> Consider the image of the sun. Paul saw “a light from the sky, brighter than the sun” (v. 13). How did meeting Jesus change the direction of Paul’s life?"},{"type":"q","id":"26.3","field":"q164","text":"<b>Action:<\/b> Look at the image of the light in the room. Jesus sent Paul “to open their eyes, that they may turn from darkness to light” (v. 18). Who might God want you to help turn toward the light?"},{"type":"p","html":"<sup class=\"v\">19<\/sup> “Therefore, King Agrippa, I was not disobedient to the heavenly vision, <sup class=\"v\">20<\/sup> but declared first to them of Damascus, at Jerusalem, and throughout all the country of Judea, and also to the Gentiles, that they should repent and turn to God, doing works worthy of repentance. <sup class=\"v\">21<\/sup> For this reason the Jews seized me in the temple and tried to kill me. <sup class=\"v\">22<\/sup> Having therefore obtained the help that is from God, I stand to this day testifying both to small and great, saying nothing but what the prophets and Moses said would happen, <sup class=\"v\">23<\/sup> how the Christ must suffer, and how, by the resurrection of the dead, he would be first to proclaim light both to these people and to the Gentiles.”"},{"type":"q","id":"26.4","field":"q165","text":"<b>Heart:<\/b> Paul said, “I was not disobedient to the heavenly vision” (v. 19). What vision or calling has God given you?"},{"type":"h2","text":"Almost Persuaded"},{"type":"p","html":"<sup class=\"v\">24<\/sup> As he thus made his defense, Festus said with a loud voice, “Paul, you are crazy! Your great learning is driving you insane!”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> But he said, “I am not crazy, most excellent Festus, but boldly declare words of truth and reasonableness. <sup class=\"v\">26<\/sup> For the king knows of these things, to whom also I speak freely. For I am persuaded that none of these things is hidden from him, for this has not been done in a corner. <sup class=\"v\">27<\/sup> King Agrippa, do you believe the prophets? I know that you believe.”"},{"type":"img","src":"img/acts26-v28.jpg","w":1100,"h":1100,"alt":"A statue of two men in conversation"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Agrippa said to Paul, “With a little persuasion are you trying to make me a Christian?”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Paul said, “I pray to God, that whether with little or with much, not only you, but also all that hear me today, might become such as I am, except for these bonds.”"},{"type":"q","id":"26.5","field":"q166","text":"<b>Heart:<\/b> Festus shouted, “Paul, you are crazy!” (v. 24). How do you respond when faith seems foolish to others?"},{"type":"q","id":"26.6","field":"q167","text":"<b>Head:<\/b> Consider the image of the conversation. Agrippa said, “With a little persuasion are you trying to make me a Christian?” (v. 28). What keeps people from taking the final step of faith?"},{"type":"p","html":"<sup class=\"v\">30<\/sup> The king rose up with the governor, and Bernice, and those who sat with them. <sup class=\"v\">31<\/sup> When they had withdrawn, they spoke to one another, saying, “This man does nothing worthy of death or of bonds.” <sup class=\"v\">32<\/sup> Agrippa said to Festus, “This man might have been set free if he had not appealed to Caesar.”"},{"type":"q","id":"26.7","field":"q168","text":"<b>Action:<\/b> Paul answered, “I pray to God, that whether with little or with much, not only you, but also all that hear me today, might become such as I am, except for these bonds” (v. 29). Who do you pray will come to faith? Pray for them by name this week."}],"prayer":"God, you send your servants to open eyes, “that they may turn from darkness to light” (26:18). Give me wisdom as I read, and help me share the good news with courage and love (26:29)."},{"num":27,"hero":{"src":"img/acts27-hero.jpg","w":1100,"h":747,"alt":"An old sailing ship"},"blocks":[{"type":"h2","text":"Paul Sails for Rome"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When it was determined that we should sail for Italy, they delivered Paul and certain other prisoners to a centurion named Julius, of the Augustan band. <sup class=\"v\">2<\/sup> Embarking in a ship of Adramyttium, which was about to sail to places on the coast of Asia, we put to sea, Aristarchus, a Macedonian of Thessalonica, being with us. <sup class=\"v\">3<\/sup> The next day, we touched at Sidon. Julius treated Paul kindly, and gave him permission to go to his friends and refresh himself. <sup class=\"v\">4<\/sup> Putting to sea from there, we sailed under the lee of Cyprus, because the winds were contrary. <sup class=\"v\">5<\/sup> When we had sailed across the sea which is off Cilicia and Pamphylia, we came to Myra, a city of Lycia. <sup class=\"v\">6<\/sup> There the centurion found a ship of Alexandria sailing for Italy, and he put us on board. <sup class=\"v\">7<\/sup> When we had sailed slowly many days, and had come with difficulty opposite Cnidus, the wind not allowing us further, we sailed under the lee of Crete, opposite Salmone. <sup class=\"v\">8<\/sup> With difficulty sailing along it we came to a certain place called Fair Havens, near the city of Lasea."},{"type":"p","html":"<sup class=\"v\">9<\/sup> When much time had passed and the voyage was now dangerous, because the Fast had now already gone by, Paul admonished them <sup class=\"v\">10<\/sup> and said to them, “Sirs, I perceive that the voyage will be with injury and much loss, not only of the cargo and the ship, but also of our lives.” <sup class=\"v\">11<\/sup> But the centurion gave more heed to the master and to the owner of the ship than to those things which were spoken by Paul. <sup class=\"v\">12<\/sup> Because the haven was not suitable to winter in, the majority advised going to sea from there, if by any means they could reach Phoenix, and winter there, which is a port of Crete, looking southwest and northwest."},{"type":"q","id":"27.1","field":"q169","text":"<b>Head:<\/b> Look at the image that opens this chapter. Paul warned that the voyage would be dangerous, but the centurion believed the ship’s master instead (v. 10-11). Why did the centurion trust the ship’s master instead of Paul? When have you ignored a warning?"},{"type":"h2","text":"The Storm at Sea"},{"type":"p","html":"<sup class=\"v\">13<\/sup> When the south wind blew softly, supposing that they had obtained their purpose, they weighed anchor and sailed along Crete, close to shore. <sup class=\"v\">14<\/sup> But before long, a stormy wind beat down from shore, which is called Euroclydon. <sup class=\"v\">15<\/sup> When the ship was caught and couldn’t face the wind, we gave way to it and were driven along. <sup class=\"v\">16<\/sup> Running under the lee of a small island called Clauda, we were able, with difficulty, to secure the boat. <sup class=\"v\">17<\/sup> After they had hoisted it up, they used cables to help reinforce the ship. Fearing that they would run aground on the Syrtis sand bars, they lowered the sea anchor, and so were driven along. <sup class=\"v\">18<\/sup> As we labored exceedingly with the storm, the next day they began to throw things overboard. <sup class=\"v\">19<\/sup> On the third day, they threw out the ship’s tackle with their own hands."},{"type":"img","src":"img/acts27-v20.jpg","w":1100,"h":619,"alt":"A huge wave on a stormy sea"},{"type":"p","html":"<sup class=\"v\">20<\/sup> When neither sun nor stars shone on us for many days, and no small storm pressed on us, all hope that we would be saved was now taken away."},{"type":"q","id":"27.2","field":"q170","text":"<b>Heart:<\/b> Consider the image of the storm. “All hope that we would be saved was now taken away” (v. 20). When have you felt that kind of hopelessness?"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When they had been long without food, Paul stood up in the middle of them, and said, “Sirs, you should have listened to me, and not have set sail from Crete and have gotten this injury and loss. <sup class=\"v\">22<\/sup> Now I exhort you to cheer up, for there will be no loss of life among you, but only of the ship. <sup class=\"v\">23<\/sup> For there stood by me this night an angel, belonging to the God whose I am and whom I serve, <sup class=\"v\">24<\/sup> saying, ‘Don’t be afraid, Paul. You must stand before Caesar. Behold, God has granted you all those who sail with you.’ <sup class=\"v\">25<\/sup> Therefore, sirs, cheer up! For I believe God, that it will be just as it has been spoken to me. <sup class=\"v\">26<\/sup> But we must run aground on a certain island.”"},{"type":"q","id":"27.3","field":"q171","text":"<b>Action:<\/b> An angel told Paul, “Don’t be afraid, Paul” (v. 24). Paul said, “Therefore, sirs, cheer up! For I believe God” (v. 25). How can you bring hope to someone in a storm this week?"},{"type":"h2","text":"The Shipwreck"},{"type":"p","html":"<sup class=\"v\">27<\/sup> But when the fourteenth night had come, as we were driven back and forth in the Adriatic Sea, about midnight the sailors surmised that they were drawing near to some land. <sup class=\"v\">28<\/sup> They took soundings, and found twenty fathoms. After a little while, they took soundings again, and found fifteen fathoms. <sup class=\"v\">29<\/sup> Fearing that we would run aground on rocky ground, they let go four anchors from the stern, and wished for daylight. <sup class=\"v\">30<\/sup> As the sailors were trying to flee out of the ship, and had lowered the boat into the sea, pretending that they would lay out anchors from the bow, <sup class=\"v\">31<\/sup> Paul said to the centurion and to the soldiers, “Unless these stay in the ship, you can’t be saved.” <sup class=\"v\">32<\/sup> Then the soldiers cut away the ropes of the boat, and let it fall off."},{"type":"q","id":"27.4","field":"q172","text":"<b>Head:<\/b> In the middle of the storm, Paul still saw that every life mattered (v. 31). How does faith help us care for others when we are afraid?"},{"type":"img","src":"img/acts27-v33.jpg","w":1100,"h":733,"alt":"A loaf of bread on a wooden table"},{"type":"p","html":"<sup class=\"v\">33<\/sup> While the day was coming on, Paul begged them all to take some food, saying, “Today is the fourteenth day that you wait and continue fasting, having taken nothing. <sup class=\"v\">34<\/sup> Therefore I beg you to take some food; for this is for your safety; for not a hair will perish from any of your heads.” <sup class=\"v\">35<\/sup> When he had said this, and had taken bread, he gave thanks to God in the presence of all, then he broke it and began to eat. <sup class=\"v\">36<\/sup> Then they all cheered up, and they also took food. <sup class=\"v\">37<\/sup> In all, we were two hundred seventy-six souls on the ship. <sup class=\"v\">38<\/sup> When they had eaten enough, they lightened the ship, throwing out the wheat into the sea. <sup class=\"v\">39<\/sup> When it was day, they didn’t recognize the land, but they noticed a certain bay with a beach, and they decided to try to drive the ship onto it. <sup class=\"v\">40<\/sup> Casting off the anchors, they left them in the sea, at the same time untying the rudder ropes. Hoisting up the foresail to the wind, they made for the beach."},{"type":"q","id":"27.5","field":"q173","text":"<b>Action:<\/b> Look at the image of the bread. When Paul “had taken bread, he gave thanks to God in the presence of all, then he broke it and began to eat” (v. 35). How can giving thanks change the mood of a room? Where could you give thanks out loud this week?"},{"type":"img","src":"img/acts27-v41.jpg","w":1100,"h":733,"alt":"Driftwood on a beach at sunset"},{"type":"p","html":"<sup class=\"v\">41<\/sup> But coming to a place where two seas met, they ran the vessel aground. The bow struck and remained immovable, but the stern began to break up by the violence of the waves."},{"type":"p","html":"<sup class=\"v\">42<\/sup> The soldiers’ counsel was to kill the prisoners, so that none of them would swim out and escape. <sup class=\"v\">43<\/sup> But the centurion, desiring to save Paul, stopped them from their purpose, and commanded that those who could swim should throw themselves overboard first to go toward the land; <sup class=\"v\">44<\/sup> and the rest should follow, some on planks, and some on other things from the ship. So they all escaped safely to the land."},{"type":"q","id":"27.6","field":"q174","text":"<b>Heart:<\/b> Consider the image of the driftwood. Some swam and others floated on boards and pieces of the ship, “So they all escaped safely to the land” (v. 44). How has God brought you safely through?"}],"prayer":"Father in heaven, in the storm you told Paul, “Don’t be afraid” (27:24), and you brought everyone safely to land (27:44). Give me wisdom as I read, and help me believe you, as Paul did (27:25)."},{"num":28,"hero":{"src":"img/acts28-hero.jpg","w":1100,"h":762,"alt":"The harbor of Malta from the air"},"blocks":[{"type":"h2","text":"On the Island of Malta"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When we had escaped, then they learned that the island was called Malta."},{"type":"img","src":"img/acts28-v02.jpg","w":1100,"h":744,"alt":"A bonfire burning at dusk"},{"type":"p","html":"<sup class=\"v\">2<\/sup> The natives showed us uncommon kindness; for they kindled a fire and received us all, because of the present rain and because of the cold. <sup class=\"v\">3<\/sup> But when Paul had gathered a bundle of sticks and laid them on the fire, a viper came out because of the heat, and fastened on his hand. <sup class=\"v\">4<\/sup> When the natives saw the creature hanging from his hand, they said to one another, “No doubt this man is a murderer, whom, though he has escaped from the sea, yet Justice has not allowed to live.” <sup class=\"v\">5<\/sup> However he shook off the creature into the fire, and wasn’t harmed. <sup class=\"v\">6<\/sup> But they expected that he would have swollen or fallen down dead suddenly, but when they watched for a long time and saw nothing bad happen to him, they changed their minds, and said that he was a god."},{"type":"q","id":"28.1","field":"q175","text":"<b>Heart:<\/b> Look at the image that opens this chapter. After the shipwreck, they landed on the island of Malta (v. 1). How does God meet us after life’s shipwrecks?"},{"type
