h"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Saul was consenting to his death. A great persecution arose against the assembly which was in Jerusalem in that day. They were all scattered abroad throughout the regions of Judea and Samaria, except for the apostles. <sup class=\"v\">2<\/sup> Devout men buried Stephen and lamented greatly over him. <sup class=\"v\">3<\/sup> But Saul ravaged the assembly, entering into every house and dragged both men and women off to prison."},{"type":"h2","text":"Philip in Samaria"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Therefore those who were scattered abroad went around preaching the word. <sup class=\"v\">5<\/sup> Philip went down to the city of Samaria, and proclaimed to them the Christ. <sup class=\"v\">6<\/sup> The multitudes listened with one accord to the things that were spoken by Philip when they heard and saw the signs which he did. <sup class=\"v\">7<\/sup> For unclean spirits came out of many of those who had them. They came out, crying with a loud voice. Many who had been paralyzed and lame were healed."},{"type":"q","id":"8.1","field":"q47","text":"<b>Head:<\/b> Look at the image that opens this chapter. The believers were scattered by persecution, but “Those who were scattered abroad went around preaching the word” (v. 4). How has God used hard times to spread good news?"},{"type":"img","src":"img/acts08-v08.jpg","w":1100,"h":733,"alt":"Three smiling boys"},{"type":"p","html":"<sup class=\"v\">8<\/sup> There was great joy in that city."},{"type":"q","id":"8.2","field":"q48","text":"<b>Action:<\/b> Consider the image of the smiling children. “There was great joy in that city” (v. 8). What brings joy to a community? How could you bring joy to yours this week?"},{"type":"h2","text":"Simon the Sorcerer"},{"type":"p","html":"<sup class=\"v\">9<\/sup> But there was a certain man, Simon by name, who used to practice sorcery in the city and amazed the people of Samaria, making himself out to be some great one, <sup class=\"v\">10<\/sup> to whom they all listened, from the least to the greatest, saying, “This man is that great power of God.” <sup class=\"v\">11<\/sup> They listened to him, because for a long time he had amazed them with his sorceries. <sup class=\"v\">12<\/sup> But when they believed Philip preaching good news concerning God’s Kingdom and the name of Jesus Christ, they were baptized, both men and women. <sup class=\"v\">13<\/sup> Simon himself also believed. Being baptized, he continued with Philip. Seeing signs and great miracles occurring, he was amazed."},{"type":"p","html":"<sup class=\"v\">14<\/sup> Now when the apostles who were at Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them, <sup class=\"v\">15<\/sup> who, when they had come down, prayed for them, that they might receive the Holy Spirit; <sup class=\"v\">16<\/sup> for as yet he had fallen on none of them. They had only been baptized in the name of Christ Jesus. <sup class=\"v\">17<\/sup> Then they laid their hands on them, and they received the Holy Spirit. <sup class=\"v\">18<\/sup> Now when Simon saw that the Holy Spirit was given through the laying on of the apostles’ hands, he offered them money, <sup class=\"v\">19<\/sup> saying, “Give me also this power, that whomever I lay my hands on may receive the Holy Spirit.” <sup class=\"v\">20<\/sup> But Peter said to him, “May your silver perish with you, because you thought you could obtain the gift of God with money! <sup class=\"v\">21<\/sup> You have neither part nor lot in this matter, for your heart isn’t right before God. <sup class=\"v\">22<\/sup> Repent therefore of this, your wickedness, and ask God if perhaps the thought of your heart may be forgiven you. <sup class=\"v\">23<\/sup> For I see that you are in the poison of bitterness and in the bondage of iniquity.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Simon answered, “Pray for me to the Lord, that none of the things which you have spoken happen to me.”"},{"type":"q","id":"8.3","field":"q49","text":"<b>Head:<\/b> Peter told Simon, “you thought you could obtain the gift of God with money!” (v. 20). Why can’t God’s gifts be bought?"},{"type":"p","html":"<sup class=\"v\">25<\/sup> They therefore, when they had testified and spoken the word of the Lord, returned to Jerusalem, and preached the Good News to many villages of the Samaritans."},{"type":"h2","text":"Philip and the Ethiopian Official"},{"type":"img","src":"img/acts08-v26.jpg","w":1100,"h":736,"alt":"A desert road seen from a vehicle"},{"type":"p","html":"<sup class=\"v\">26<\/sup> But an angel of the Lord spoke to Philip, saying, “Arise, and go toward the south to the way that goes down from Jerusalem to Gaza. This is a desert.”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> He arose and went; and behold, there was a man of Ethiopia, a eunuch of great authority under Candace, queen of the Ethiopians, who was over all her treasure, who had come to Jerusalem to worship. <sup class=\"v\">28<\/sup> He was returning and sitting in his chariot, and was reading the prophet Isaiah."},{"type":"p","html":"<sup class=\"v\">29<\/sup> The Spirit said to Philip, “Go near, and join yourself to this chariot.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Philip ran to him, and heard him reading Isaiah the prophet, and said, “Do you understand what you are reading?”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> He said, “How can I, unless someone explains it to me?” He begged Philip to come up and sit with him. <sup class=\"v\">32<\/sup> Now the passage of the Scripture which he was reading was this,"},{"type":"q","id":"8.4","field":"q50","text":"<b>Heart:<\/b> Look at the image of the desert road. An angel sent Philip to a desert road (v. 26). When has God sent you somewhere unexpected?"},{"type":"poem","lines":["“He was led as a sheep to the slaughter.","As a lamb before his shearer is silent,","so he doesn’t open his mouth.","<sup class=\"v\">33<\/sup> In his humiliation, his judgment was taken away.","Who will declare His generation?","For his life is taken from the earth.”"]},{"type":"p","html":"<sup class=\"v\">34<\/sup> The eunuch answered Philip, “Who is the prophet talking about? About himself, or about someone else?”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Philip opened his mouth, and beginning from this Scripture, preached to him about Jesus."},{"type":"q","id":"8.5","field":"q51","text":"<b>Action:<\/b> Philip asked, “Do you understand what you are reading?” The man answered, “How can I, unless someone explains it to me?” (v. 30-31). Who helped you understand the Bible? Whom could you help in the same way?"},{"type":"img","src":"img/acts08-v36.jpg","w":1100,"h":825,"alt":"An oasis among sand dunes"},{"type":"p","html":"<sup class=\"v\">36<\/sup> As they went on the way, they came to some water, and the eunuch said, “Behold, here is water. What is keeping me from being baptized?”"},{"type":"p","html":"<sup class=\"v\">37<\/sup>  <sup class=\"v\">38<\/sup> He commanded the chariot to stand still, and they both went down into the water, both Philip and the eunuch, and he baptized him."},{"type":"p","html":"<sup class=\"v\">39<\/sup> When they came up out of the water, the Spirit of the Lord caught Philip away, and the eunuch didn’t see him any more, for he went on his way rejoicing. <sup class=\"v\">40<\/sup> But Philip was found at Azotus. Passing through, he preached the Good News to all the cities, until he came to Caesarea."},{"type":"q","id":"8.6","field":"q52","text":"<b>Heart:<\/b> Consider the image of the water. The man asked, “What is keeping me from being baptized?” (v. 36), and afterward “he went on his way rejoicing” (v. 39). When have you gone on your way rejoicing?"}],"prayer":"God, you scattered your people, and everywhere they went they preached the word (8:4). Give me wisdom as I read, and help me tell others about Jesus, as Philip did (8:35)."},{"num":9,"hero":{"src":"img/acts09-hero.jpg","w":1100,"h":733,"alt":"Bright sunlight blazing over a road"},"blocks":[{"type":"h2","text":"Saul Meets Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> But Saul, still breathing threats and slaughter against the disciples of the Lord, went to the high priest <sup class=\"v\">2<\/sup> and asked for letters from him to the synagogues of Damascus, that if he found any who were of the Way, whether men or women, he might bring them bound to Jerusalem. <sup class=\"v\">3<\/sup> As he traveled, he got close to Damascus, and suddenly a light from the sky shone around him. <sup class=\"v\">4<\/sup> He fell on the earth, and heard a voice saying to him, “Saul, Saul, why do you persecute me?”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> He said, “Who are you, Lord?”"},{"type":"p","html":"The Lord said, “I am Jesus, whom you are persecuting. <sup class=\"v\">6<\/sup> But rise up and enter into the city, then you will be told what you must do.”"},{"type":"p","html":"<sup class=\"v\">7<\/sup> The men who traveled with him stood speechless, hearing the sound, but seeing no one."},{"type":"img","src":"img/acts09-v08.jpg","w":1100,"h":733,"alt":"A man leading a small child by the hand"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Saul arose from the ground, and when his eyes were opened, he saw no one. They led him by the hand, and brought him into Damascus. <sup class=\"v\">9<\/sup> He was without sight for three days, and neither ate nor drank."},{"type":"q","id":"9.1","field":"q53","text":"<b>Head:<\/b> Look at the image that opens this chapter. A light from the sky flashed around Saul, and he heard a voice say, “Saul, Saul, why do you persecute me?” (v. 4). What does it mean that Jesus takes the suffering of his people personally?"},{"type":"q","id":"9.2","field":"q54","text":"<b>Heart:<\/b> Consider the image of being led by the hand. Saul, once powerful, had to be led into Damascus (v. 8). How can weakness open us to God? When has it opened you?"},{"type":"h2","text":"Ananias Visits Saul"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Now there was a certain disciple at Damascus named Ananias. The Lord said to him in a vision, “Ananias!”"},{"type":"p","html":"He said, “Behold, it’s me, Lord.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> The Lord said to him, “Arise, and go to the street which is called Straight, and inquire in the house of Judah for one named Saul, a man of Tarsus. For behold, he is praying, <sup class=\"v\">12<\/sup> and in a vision he has seen a man named Ananias coming in and laying his hands on him, that he might receive his sight.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> But Ananias answered, “Lord, I have heard from many about this man, how much evil he did to your saints at Jerusalem. <sup class=\"v\">14<\/sup> Here he has authority from the chief priests to bind all who call on your name.”"},{"type":"p","html":"<sup class=\"v\">15<\/sup> But the Lord said to him, “Go your way, for he is my chosen vessel to bear my name before the nations and kings, and the children of Israel. <sup class=\"v\">16<\/sup> For I will show him how many things he must suffer for my name’s sake.”"},{"type":"q","id":"9.3","field":"q55","text":"<b>Action:<\/b> Ananias was afraid of Saul (v. 13), but God said, “he is my chosen vessel” (v. 15). Who might God be calling you to reach that you are afraid of? What first step will you take?"},{"type":"img","src":"img/acts09-v17.jpg","w":1100,"h":696,"alt":"An eye catching a rainbow of light"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Ananias departed and entered into the house. Laying his hands on him, he said, “Brother Saul, the Lord, who appeared to you on the road by which you came, has sent me that you may receive your sight and be filled with the Holy Spirit.” <sup class=\"v\">18<\/sup> Immediately something like scales fell from his eyes, and he received his sight. He arose and was baptized."},{"type":"h2","text":"Saul Preaches Jesus"},{"type":"p","html":"<sup class=\"v\">19<\/sup> He took food and was strengthened. Saul stayed several days with the disciples who were at Damascus. <sup class=\"v\">20<\/sup> Immediately in the synagogues he proclaimed the Christ, that he is the Son of God. <sup class=\"v\">21<\/sup> All who heard him were amazed, and said, “Isn’t this he who in Jerusalem made havoc of those who called on this name? And he had come here intending to bring them bound before the chief priests!”"},{"type":"q","id":"9.4","field":"q56","text":"<b>Heart:<\/b> Look at the image of the eye. Ananias called him “Brother Saul” (v. 17), and something like scales fell from his eyes (v. 18). What do you think it meant to Saul to be called “brother”?"},{"type":"p","html":"<sup class=\"v\">22<\/sup> But Saul increased more in strength, and confounded the Jews who lived at Damascus, proving that this is the Christ. <sup class=\"v\">23<\/sup> When many days were fulfilled, the Jews conspired together to kill him, <sup class=\"v\">24<\/sup> but their plot became known to Saul. They watched the gates both day and night that they might kill him, <sup class=\"v\">25<\/sup> but his disciples took him by night and let him down through the wall, lowering him in a basket. <sup class=\"v\">26<\/sup> When Saul had come to Jerusalem, he tried to join himself to the disciples; but they were all afraid of him, not believing that he was a disciple. <sup class=\"v\">27<\/sup> But Barnabas took him and brought him to the apostles, and declared to them how he had seen the Lord on the way, and that he had spoken to him, and how at Damascus he had preached boldly in the name of Jesus. <sup class=\"v\">28<\/sup> He was with them entering into Jerusalem, <sup class=\"v\">29<\/sup> preaching boldly in the name of the Lord Jesus. He spoke and disputed against the Hellenists, but they were seeking to kill him. <sup class=\"v\">30<\/sup> When the brothers knew it, they brought him down to Caesarea, and sent him off to Tarsus. <sup class=\"v\">31<\/sup> So the assemblies throughout all Judea, Galilee, and Samaria had peace, and were built up. They were multiplied, walking in the fear of the Lord and in the comfort of the Holy Spirit."},{"type":"q","id":"9.5","field":"q57","text":"<b>Action:<\/b> Barnabas “took him and brought him to the apostles” (v. 27). Whom could you help feel welcome this week?"},{"type":"q","id":"9.6","field":"q58","text":"<b>Head:<\/b> “So the assemblies throughout all Judea, Galilee, and Samaria had peace, and were built up” (v. 31). What builds up a church?"},{"type":"h2","text":"Peter Heals Aeneas and Raises Dorcas"},{"type":"p","html":"<sup class=\"v\">32<\/sup> As Peter went throughout all those parts, he came down also to the saints who lived at Lydda. <sup class=\"v\">33<\/sup> There he found a certain man named Aeneas, who had been bedridden for eight years, because he was paralyzed. <sup class=\"v\">34<\/sup> Peter said to him, “Aeneas, Jesus Christ heals you. Get up and make your bed!” Immediately he arose. <sup class=\"v\">35<\/sup> All who lived at Lydda and in Sharon saw him, and they turned to the Lord."},{"type":"img","src":"img/acts09-v36.jpg","w":1100,"h":733,"alt":"Hands sewing clothing"},{"type":"p","html":"<sup class=\"v\">36<\/sup> Now there was at Joppa a certain disciple named Tabitha, which when translated, means Dorcas. This woman was full of good works and acts of mercy which she did. <sup class=\"v\">37<\/sup> In those days, she became sick, and died. When they had washed her, they laid her in an upper room. <sup class=\"v\">38<\/sup> As Lydda was near Joppa, the disciples, hearing that Peter was there, sent two men to him, imploring him not to delay in coming to them. <sup class=\"v\">39<\/sup> Peter got up and went with them. When he had come, they brought him into the upper room. All the widows stood by him weeping, and showing the coats and garments which Dorcas had made while she was with them. <sup class=\"v\">40<\/sup> Peter sent them all out, and knelt down and prayed. Turning to the body, he said, “Tabitha, get up!” She opened her eyes, and when she saw Peter, she sat up. <sup class=\"v\">41<\/sup> He gave her his hand, and raised her up. Calling the saints and widows, he presented her alive. <sup class=\"v\">42<\/sup> This became known throughout all Joppa, and many believed in the Lord. <sup class=\"v\">43<\/sup> He stayed many days in Joppa with a tanner named Simon."},{"type":"q","id":"9.7","field":"q59","text":"<b>Action:<\/b> Consider the image of the sewing. Dorcas was “full of good works and acts of mercy which she did” (v. 36). What simple acts of kindness could you do this week?"}],"prayer":"Father in heaven, your Son met Saul on the road and said, “I am Jesus, whom you are persecuting” (9:5). Give me wisdom as I read, and help me believe that no one is beyond the reach of your grace."},{"num":10,"hero":{"src":"img/acts10-hero.jpg","w":1100,"h":643,"alt":"A rooftop terrace above the sea"},"blocks":[{"type":"h2","text":"Cornelius Sends for Peter"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now there was a certain man in Caesarea, Cornelius by name, a centurion of what was called the Italian Regiment, <sup class=\"v\">2<\/sup> a devout man, and one who feared God with all his house, who gave gifts for the needy generously to the people, and always prayed to God. <sup class=\"v\">3<\/sup> At about the ninth hour of the day, he clearly saw in a vision an angel of God coming to him, and saying to him, “Cornelius!”"},{"type":"img","src":"img/acts10-v04.jpg","w":1100,"h":770,"alt":"Hands giving coins and money"},{"type":"p","html":"<sup class=\"v\">4<\/sup> He, fastening his eyes on him, and being frightened, said, “What is it, Lord?”"},{"type":"p","html":"He said to him, “Your prayers and your gifts to the needy have gone up for a memorial before God. <sup class=\"v\">5<\/sup> Now send men to Joppa, and get Simon, who is also called Peter. <sup class=\"v\">6<\/sup> He is staying with a tanner named Simon, whose house is by the seaside."},{"type":"p","html":"<sup class=\"v\">7<\/sup> When the angel who spoke to him had departed, Cornelius called two of his household servants and a devout soldier of those who waited on him continually. <sup class=\"v\">8<\/sup> Having explained everything to them, he sent them to Joppa."},{"type":"q","id":"10.1","field":"q60","text":"<b>Head:<\/b> Consider the image of the giving. An angel told Cornelius, “Your prayers and your gifts to the needy have gone up for a memorial before God” (v. 4). How do prayer and generosity go together?"},{"type":"h2","text":"Peter’s Vision"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Now on the next day as they were on their journey, and got close to the city, Peter went up on the housetop to pray at about noon. <sup class=\"v\">10<\/sup> He became hungry and desired to eat, but while they were preparing, he fell into a trance."},{"type":"img","src":"img/acts10-v11.jpg","w":1100,"h":733,"alt":"Sheets blowing on a clothesline"},{"type":"p","html":"<sup class=\"v\">11<\/sup> He saw heaven opened and a certain container descending to him, like a great sheet let down by four corners on the earth, <sup class=\"v\">12<\/sup> in which were all kinds of four-footed animals of the earth, wild animals, reptiles, and birds of the sky. <sup class=\"v\">13<\/sup> A voice came to him, “Rise, Peter, kill and eat!”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> But Peter said, “Not so, Lord; for I have never eaten anything that is common or unclean.”"},{"type":"p","html":"<sup class=\"v\">15<\/sup> A voice came to him again the second time, “What God has cleansed, you must not call unclean.” <sup class=\"v\">16<\/sup> This was done three times, and immediately the vessel was received up into heaven. <sup class=\"v\">17<\/sup> Now while Peter was very perplexed in himself what the vision which he had seen might mean, behold, the men who were sent by Cornelius, having made inquiry for Simon’s house, stood before the gate, <sup class=\"v\">18<\/sup> and called and asked whether Simon, who was also called Peter, was lodging there. <sup class=\"v\">19<\/sup> While Peter was pondering the vision, the Spirit said to him, “Behold, three men seek you. <sup class=\"v\">20<\/sup> But arise, get down, and go with them, doubting nothing; for I have sent them.”"},{"type":"q","id":"10.2","field":"q61","text":"<b>Heart:<\/b> Look at the image of the sheet. The voice said, “What God has cleansed, you must not call unclean” (v. 15). What prejudices might God be asking you to let go of?"},{"type":"p","html":"<sup class=\"v\">21<\/sup> Peter went down to the men, and said, “Behold, I am he whom you seek. Why have you come?”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> They said, “Cornelius, a centurion, a righteous man and one who fears God, and well spoken of by all the nation of the Jews, was directed by a holy angel to invite you to his house, and to listen to what you say.”"},{"type":"q","id":"10.3","field":"q62","text":"<b>Action:<\/b> Look at the image that opens this chapter. Peter went up on the housetop to pray (v. 9). Where is your quiet place to pray? When will you go there this week?"},{"type":"h2","text":"Peter at Cornelius’ House"},{"type":"p","html":"<sup class=\"v\">23<\/sup> So he called them in and provided a place to stay. On the next day Peter arose and went out with them, and some of the brothers from Joppa accompanied him. <sup class=\"v\">24<\/sup> On the next day they entered into Caesarea. Cornelius was waiting for them, having called together his relatives and his near friends. <sup class=\"v\">25<\/sup> When Peter entered, Cornelius met him, fell down at his feet, and worshiped him. <sup class=\"v\">26<\/sup> But Peter raised him up, saying, “Stand up! I myself am also a man.” <sup class=\"v\">27<\/sup> As he talked with him, he went in and found many gathered together. <sup class=\"v\">28<\/sup> He said to them, “You yourselves know how it is an unlawful thing for a man who is a Jew to join himself or come to one of another nation, but God has shown me that I shouldn’t call any man unholy or unclean. <sup class=\"v\">29<\/sup> Therefore I also came without complaint when I was sent for. I ask therefore, why did you send for me?”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Cornelius said, “Four days ago, I was fasting until this hour, and at the ninth hour, I prayed in my house, and behold, a man stood before me in bright clothing, <sup class=\"v\">31<\/sup> and said, ‘Cornelius, your prayer is heard, and your gifts to the needy are remembered in the sight of God. <sup class=\"v\">32<\/sup> Send therefore to Joppa, and summon Simon, who is also called Peter. He is staying in the house of a tanner named Simon, by the seaside. When he comes, he will speak to you.’ <sup class=\"v\">33<\/sup> Therefore I sent to you at once, and it was good of you to come. Now therefore we are all here present in the sight of God to hear all things that have been commanded you by God.”"},{"type":"q","id":"10.4","field":"q63","text":"<b>Head:<\/b> Peter said, “God has shown me that I shouldn’t call any man unholy or unclean” (v. 28). How does this change the way you see others?"},{"type":"img","src":"img/acts10-v34.jpg","w":1100,"h":619,"alt":"Hands of different colors on a world map"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Peter opened his mouth and said, “Truly I perceive that God doesn’t show favoritism; <sup class=\"v\">35<\/sup> but in every nation he who fears him and works righteousness is acceptable to him. <sup class=\"v\">36<\/sup> The word which he sent to the children of Israel, preaching good news of peace by Jesus Christ—he is Lord of all— <sup class=\"v\">37<\/sup> you yourselves know what happened, which was proclaimed throughout all Judea, beginning from Galilee, after the baptism which John preached; <sup class=\"v\">38<\/sup> even Jesus of Nazareth, how God anointed him with the Holy Spirit and with power, who went about doing good and healing all who were oppressed by the devil, for God was with him. <sup class=\"v\">39<\/sup> We are witnesses of everything he did both in the country of the Jews, and in Jerusalem; whom they also killed, hanging him on a tree. <sup class=\"v\">40<\/sup> God raised him up the third day, and gave him to be revealed, <sup class=\"v\">41<\/sup> not to all the people, but to witnesses who were chosen before by God, to us, who ate and drank with him after he rose from the dead. <sup class=\"v\">42<\/sup> He commanded us to preach to the people and to testify that this is he who is appointed by God as the Judge of the living and the dead. <sup class=\"v\">43<\/sup> All the prophets testify about him, that through his name everyone who believes in him will receive remission of sins.”"},{"type":"q","id":"10.5","field":"q64","text":"<b>Action:<\/b> Consider the image of the hands. Peter said, “Truly I perceive that God doesn’t show favoritism” (v. 34). Where do you see favoritism in our world? How can you show God’s welcome?"},{"type":"q","id":"10.6","field":"q65","text":"<b>Action:<\/b> Jesus “went about doing good” (v. 38). What good could you do this week?"},{"type":"h2","text":"The Holy Spirit Comes to the Gentiles"},{"type":"p","html":"<sup class=\"v\">44<\/sup> While Peter was still speaking these words, the Holy Spirit fell on all those who heard the word. <sup class=\"v\">45<\/sup> They of the circumcision who believed were amazed, as many as came with Peter, because the gift of the Holy Spirit was also poured out on the Gentiles. <sup class=\"v\">46<\/sup> For they heard them speaking in other languages and magnifying God."},{"type":"p","html":"Then Peter answered, <sup class=\"v\">47<\/sup> “Can anyone forbid these people from being baptized with water? They have received the Holy Spirit just like us.” <sup class=\"v\">48<\/sup> He commanded them to be baptized in the name of Jesus Christ. Then they asked him to stay some days."},{"type":"q","id":"10.7","field":"q66","text":"<b>Heart:<\/b> The Holy Spirit fell on all who heard the word (v. 44). How does it feel to know that God’s gift is for everyone?"}],"prayer":"God, Peter learned that you don’t “show favoritism” (10:34). Give me wisdom as I read, and help me welcome people of every nation as you do (10:35)."},{"num":11,"hero":{"src":"img/acts11-hero.jpg","w":1100,"h":819,"alt":"An open gate into a garden"},"blocks":[{"type":"h2","text":"Peter Explains His Actions"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now the apostles and the brothers who were in Judea heard that the Gentiles had also received the word of God. <sup class=\"v\">2<\/sup> When Peter had come up to Jerusalem, those who were of the circumcision contended with him, <sup class=\"v\">3<\/sup> saying, “You went in to uncircumcised men, and ate with them!”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> But Peter began, and explained to them in order, saying, <sup class=\"v\">5<\/sup> “I was in the city of Joppa praying, and in a trance I saw a vision: a certain container descending, like it was a great sheet let down from heaven by four corners. It came as far as me. <sup class=\"v\">6<\/sup> When I had looked intently at it, I considered, and saw the four-footed animals of the earth, wild animals, creeping things, and birds of the sky. <sup class=\"v\">7<\/sup> I also heard a voice saying to me, ‘Rise, Peter, kill and eat!’ <sup class=\"v\">8<\/sup> But I said, ‘Not so, Lord, for nothing unholy or unclean has ever entered into my mouth.’ <sup class=\"v\">9<\/sup> But a voice answered me the second time out of heaven, ‘What God has cleansed, don’t you call unclean.’ <sup class=\"v\">10<\/sup> This was done three times, and all were drawn up again into heaven. <sup class=\"v\">11<\/sup> Behold, immediately three men stood before the house where I was, having been sent from Caesarea to me. <sup class=\"v\">12<\/sup> The Spirit told me to go with them, without discriminating. These six brothers also accompanied me, and we entered into the man’s house. <sup class=\"v\">13<\/sup> He told us how he had seen the angel standing in his house, and saying to him, ‘Send to Joppa, and get Simon, who is called Peter, <sup class=\"v\">14<\/sup> who will speak to you words by which you will be saved, you and all your house.’ <sup class=\"v\">15<\/sup> As I began to speak, the Holy Spirit fell on them, even as on us at the beginning. <sup class=\"v\">16<\/sup> I remembered the word of the Lord, how he said, ‘John indeed baptized in water, but you will be baptized in the Holy Spirit.’ <sup class=\"v\">17<\/sup> If then God gave to them the same gift as us, when we believed in the Lord Jesus Christ, who was I, that I could withstand God?”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> When they heard these things, they held their peace, and glorified God, saying, “Then God has also granted to the Gentiles repentance to life!”"},{"type":"q","id":"11.1","field":"q67","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Peter said, “who was I, that I could withstand God?” (v. 17). When have you had to change your mind because of what God was doing?"},{"type":"q","id":"11.2","field":"q68","text":"<b>Heart:<\/b> Hearing Peter’s story, they said, “Then God has also granted to the Gentiles repentance to life!” (v. 18). How can you rejoice when God works in unexpected people?"},{"type":"h2","text":"The Church in Antioch"},{"type":"img","src":"img/acts11-v19.jpg","w":1100,"h":733,"alt":"A city at sunrise"},{"type":"p","html":"<sup class=\"v\">19<\/sup> They therefore who were scattered abroad by the oppression that arose about Stephen traveled as far as Phoenicia, Cyprus, and Antioch, speaking the word to no one except to Jews only. <sup class=\"v\">20<\/sup> But there were some of them, men of Cyprus and Cyrene, who, when they had come to Antioch, spoke to the Hellenists, preaching the Lord Jesus. <sup class=\"v\">21<\/sup> The hand of the Lord was with them, and a great number believed and turned to the Lord."},{"type":"img","src":"img/acts11-v22.jpg","w":1100,"h":838,"alt":"Two friends holding “it is well” signs"},{"type":"p","html":"<sup class=\"v\">22<\/sup> The report concerning them came to the ears of the assembly which was in Jerusalem. They sent out Barnabas to go as far as Antioch, <sup class=\"v\">23<\/sup> who, when he had come, and had seen the grace of God, was glad. He exhorted them all, that with purpose of heart they should remain near to the Lord. <sup class=\"v\">24<\/sup> For he was a good man, and full of the Holy Spirit and of faith, and many people were added to the Lord."},{"type":"p","html":"<sup class=\"v\">25<\/sup> Barnabas went out to Tarsus to look for Saul. <sup class=\"v\">26<\/sup> When he had found him, he brought him to Antioch. For a whole year they were gathered together with the assembly, and taught many people. The disciples were first called Christians in Antioch."},{"type":"q","id":"11.3","field":"q69","text":"<b>Head:<\/b> Consider the image of the city. Ordinary believers told the good news in Antioch, “and a great number believed and turned to the Lord” (v. 21). How can ordinary people make a difference?"},{"type":"q","id":"11.4","field":"q70","text":"<b>Action:<\/b> Look at the image of the encouragement. Barnabas “was glad” and encouraged them all to remain near to the Lord (v. 23). How can you be an encourager? Whom will you encourage this week?"},{"type":"q","id":"11.5","field":"q71","text":"<b>Head:<\/b> “The disciples were first called Christians in Antioch” (v. 26). What does it mean to bear the name Christian?"},{"type":"h2","text":"Help for the Believers in Judea"},{"type":"p","html":"<sup class=\"v\">27<\/sup> Now in these days, prophets came down from Jerusalem to Antioch. <sup class=\"v\">28<\/sup> One of them named Agabus stood up, and indicated by the Spirit that there should be a great famine all over the world, which also happened in the days of Claudius."},{"type":"img","src":"img/acts11-v29.jpg","w":1100,"h":825,"alt":"Volunteers packing boxes of food"},{"type":"p","html":"<sup class=\"v\">29<\/sup> As any of the disciples had plenty, each determined to send relief to the brothers who lived in Judea; <sup class=\"v\">30<\/sup> which they also did, sending it to the elders by the hands of Barnabas and Saul."},{"type":"q","id":"11.6","field":"q72","text":"<b>Action:<\/b> Consider the image of the donations. “As any of the disciples had plenty, each determined to send relief” (v. 29). How can you give from what you have?"}],"prayer":"God, you have “granted to the Gentiles repentance to life” (11:18). Give me wisdom as I read, and help me be glad, like Barnabas, when I see your grace at work in others (11:23)."},{"num":12,"hero":{"src":"img/acts12-hero.jpg","w":1100,"h":825,"alt":"A barred window in a stone wall"},"blocks":[{"type":"h2","text":"Peter Escapes from Prison"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now about that time, King Herod stretched out his hands to oppress some of the assembly. <sup class=\"v\">2<\/sup> He killed James, the brother of John, with the sword. <sup class=\"v\">3<\/sup> When he saw that it pleased the Jews, he proceeded to seize Peter also. This was during the days of unleavened bread. <sup class=\"v\">4<\/sup> When he had arrested him, he put him in prison, and delivered him to four squads of four soldiers each to guard him, intending to bring him out to the people after the Passover. <sup class=\"v\">5<\/sup> Peter therefore was kept in the prison, but constant prayer was made by the assembly to God for him. <sup class=\"v\">6<\/sup> The same night when Herod was about to bring him out, Peter was sleeping between two soldiers, bound with two chains. Guards in front of the door kept the prison."},{"type":"q","id":"12.1","field":"q73","text":"<b>Action:<\/b> Look at the image that opens this chapter. Peter was in prison, “but constant prayer was made by the assembly to God for him” (v. 5). Who is “in prison” today that you could pray for?"},{"type":"img","src":"img/acts12-v07.jpg","w":1100,"h":734,"alt":"A broken rusty chain"},{"type":"p","html":"<sup class=\"v\">7<\/sup> And behold, an angel of the Lord stood by him, and a light shone in the cell. He struck Peter on the side, and woke him up, saying, “Stand up quickly!” His chains fell off his hands. <sup class=\"v\">8<\/sup> The angel said to him, “Get dressed and put on your sandals.” He did so. He said to him, “Put on your cloak and follow me.” <sup class=\"v\">9<\/sup> And he went out and followed him. He didn’t know that what was being done by the angel was real, but thought he saw a vision. <sup class=\"v\">10<\/sup> When they were past the first and the second guard, they came to the iron gate that leads into the city, which opened to them by itself. They went out, and went down one street, and immediately the angel departed from him."},{"type":"p","html":"<sup class=\"v\">11<\/sup> When Peter had come to himself, he said, “Now I truly know that the Lord has sent out his angel and delivered me out of the hand of Herod, and from everything the Jewish people were expecting.” <sup class=\"v\">12<\/sup> Thinking about that, he came to the house of Mary, the mother of John who was called Mark, where many were gathered together and were praying."},{"type":"q","id":"12.2","field":"q74","text":"<b>Heart:<\/b> Consider the image of the broken chain. The angel said, “Stand up quickly!” and Peter’s chains fell off from his hands (v. 7). What chains would you like God to break in your life?"},{"type":"q","id":"12.3","field":"q75","text":"<b>Heart:<\/b> Peter thought he was seeing a vision (v. 9). When has God answered prayer in a way that seemed too good to be true?"},{"type":"img","src":"img/acts12-v13.jpg","w":1100,"h":729,"alt":"An old city gate at night"},{"type":"p","html":"<sup class=\"v\">13<\/sup> When Peter knocked at the door of the gate, a servant girl named Rhoda came to answer. <sup class=\"v\">14<\/sup> When she recognized Peter’s voice, she didn’t open the gate for joy, but ran in, and reported that Peter was standing in front of the gate."},{"type":"p","html":"<sup class=\"v\">15<\/sup> They said to her, “You are crazy!” But she insisted that it was so. They said, “It is his angel.” <sup class=\"v\">16<\/sup> But Peter continued knocking. When they had opened, they saw him, and were amazed. <sup class=\"v\">17<\/sup> But he, beckoning to them with his hand to be silent, declared to them how the Lord had brought him out of the prison. He said, “Tell these things to James and to the brothers.” Then he departed and went to another place."},{"type":"q","id":"12.4","field":"q76","text":"<b>Head:<\/b> Look at the image of the gate. Rhoda was so joyful at Peter’s voice that she forgot to open the gate (v. 14). The praying believers were amazed (v. 16). Why are we sometimes surprised when God answers our prayers?"},{"type":"h2","text":"The Death of Herod"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Now as soon as it was day, there was no small stir among the soldiers about what had become of Peter. <sup class=\"v\">19<\/sup> When Herod had sought for him, and didn’t find him, he examined the guards, then commanded that they should be put to death. He went down from Judea to Caesarea, and stayed there. <sup class=\"v\">20<\/sup> Now Herod was very angry with the people of Tyre and Sidon. They came with one accord to him, and, having made Blastus, the king’s personal aide, their friend, they asked for peace, because their country depended on the king’s country for food. <sup class=\"v\">21<\/sup> On an appointed day, Herod dressed himself in royal clothing, sat on the throne, and gave a speech to them. <sup class=\"v\">22<\/sup> The people shouted, “The voice of a god, and not of a man!” <sup class=\"v\">23<\/sup> Immediately an angel of the Lord struck him, because he didn’t give God the glory. Then he was eaten by worms and died."},{"type":"q","id":"12.5","field":"q77","text":"<b>Action:<\/b> Herod died “because he didn’t give God the glory” (v. 23). How can you give God the glory for the good things in your life?"},{"type":"h2","text":"God’s Word Spreads"},{"type":"img","src":"img/acts12-v24.jpg","w":1100,"h":733,"alt":"Young green plants growing"},{"type":"p","html":"<sup class=\"v\">24<\/sup> But the word of God grew and multiplied. <sup class=\"v\">25<\/sup> Barnabas and Saul returned to Jerusalem when they had fulfilled their service, also taking with them John who was called Mark."},{"type":"q","id":"12.6","field":"q78","text":"<b>Head:<\/b> Consider the image of the plants. “But the word of God grew and multiplied” (v. 24). How have you seen God’s word grow, even when people opposed it?"}],"prayer":"Father in heaven, you heard the constant prayer of your church and set Peter free (12:5, 7). Give me wisdom as I read, and help me keep praying, trusting that your word will grow (12:24)."},{"num":13,"hero":{"src":"img/acts13-hero.jpg","w":1100,"h":733,"alt":"A sailing ship at sea at sunset"},"blocks":[{"type":"h2","text":"Barnabas and Saul Are Sent"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now in the assembly that was at Antioch there were some prophets and teachers: Barnabas, Simeon who was called Niger, Lucius of Cyrene, Manaen the foster brother of Herod the tetrarch, and Saul."},{"type":"img","src":"img/acts13-v02.jpg","w":1100,"h":733,"alt":"The inside of a church"},{"type":"p","html":"<sup class=\"v\">2<\/sup> As they served the Lord and fasted, the Holy Spirit said, “Separate Barnabas and Saul for me, for the work to which I have called them.”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> Then, when they had fasted and prayed and laid their hands on them, they sent them away."},{"type":"q","id":"13.1","field":"q79","text":"<b>Action:<\/b> Look at the image that opens this chapter. The Holy Spirit said, “Separate Barnabas and Saul for me, for the work to which I have called them” (v. 2). What work might God be calling you to? What step will you take toward it?"},{"type":"q","id":"13.2","field":"q80","text":"<b>Head:<\/b> Consider the image of the church. The call came while they were serving the Lord and fasting (v. 2). How does worship prepare us to hear God?"},{"type":"h2","text":"On the Island of Cyprus"},{"type":"p","html":"<sup class=\"v\">4<\/sup> So, being sent out by the Holy Spirit, they went down to Seleucia. From there they sailed to Cyprus. <sup class=\"v\">5<\/sup> When they were at Salamis, they proclaimed God’s word in the Jewish synagogues. They also had John as their attendant. <sup class=\"v\">6<\/sup> When they had gone through the island to Paphos, they found a certain sorcerer, a false prophet, a Jew, whose name was Bar Jesus, <sup class=\"v\">7<\/sup> who was with the proconsul, Sergius Paulus, a man of understanding. This man summoned Barnabas and Saul, and sought to hear the word of God. <sup class=\"v\">8<\/sup> But Elymas the sorcerer (for so is his name by interpretation) withstood them, seeking to turn the proconsul away from the faith. <sup class=\"v\">9<\/sup> But Saul, who is also called Paul, filled with the Holy Spirit, fastened his eyes on him, <sup class=\"v\">10<\/sup> and said, “You son of the devil, full of all deceit and all cunning, you enemy of all righteousness, will you not cease to pervert the right ways of the Lord? <sup class=\"v\">11<\/sup> Now, behold, the hand of the Lord is on you, and you will be blind, not seeing the sun for a season!”"},{"type":"p","html":"Immediately a mist and darkness fell on him. He went around seeking someone to lead him by the hand. <sup class=\"v\">12<\/sup> Then the proconsul, when he saw what was done, believed, being astonished at the teaching of the Lord."},{"type":"q","id":"13.3","field":"q81","text":"<b>Heart:<\/b> The governor “believed, being astonished at the teaching of the Lord” (v. 12). What part of Jesus’ teaching astonishes you?"},{"type":"h2","text":"Paul Preaches in Antioch of Pisidia"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Now Paul and his company set sail from Paphos, and came to Perga in Pamphylia. John departed from them and returned to Jerusalem. <sup class=\"v\">14<\/sup> But they, passing on from Perga, came to Antioch of Pisidia. They went into the synagogue on the Sabbath day, and sat down. <sup class=\"v\">15<\/sup> After the reading of the law and the prophets, the rulers of the synagogue sent to them, saying, “Brothers, if you have any word of exhortation for the people, speak.”"},{"type":"img","src":"img/acts13-v16.jpg","w":1100,"h":733,"alt":"An open scroll of Scripture"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Paul stood up, and beckoning with his hand said, “Men of Israel, and you who fear God, listen. <sup class=\"v\">17<\/sup> The God of this people chose our fathers, and exalted the people when they stayed as aliens in the land of Egypt, and with an uplifted arm, he led them out of it. <sup class=\"v\">18<\/sup> For a period of about forty years he put up with them in the wilderness. <sup class=\"v\">19<\/sup> When he had destroyed seven nations in the land of Canaan, he gave them their land for an inheritance for about four hundred fifty years. <sup class=\"v\">20<\/sup> After these things, he gave them judges until Samuel the prophet. <sup class=\"v\">21<\/sup> Afterward they asked for a king, and God gave to them Saul the son of Kish, a man of the tribe of Benjamin, for forty years. <sup class=\"v\">22<\/sup> When he had removed him, he raised up David to be their king, to whom he also testified, ‘I have found David the son of Jesse, a man after my heart, who will do all my will.’ <sup class=\"v\">23<\/sup> From this man’s offspring, God has brought salvation to Israel according to his promise, <sup class=\"v\">24<\/sup> before his coming, when John had first preached the baptism of repentance to Israel. <sup class=\"v\">25<\/sup> As John was fulfilling his course, he said, ‘What do you suppose that I am? I am not he. But behold, one comes after me, the sandals of whose feet I am not worthy to untie.’ <sup class=\"v\">26<\/sup> Brothers, children of the stock of Abraham, and those among you who fear God, the word of this salvation is sent out to you. <sup class=\"v\">27<\/sup> For those who dwell in Jerusalem, and their rulers, because they didn’t know him, nor the voices of the prophets which are read every Sabbath, fulfilled them by condemning him. <sup class=\"v\">28<\/sup> Though they found no cause for death, they still asked Pilate to have him killed. <sup class=\"v\">29<\/sup> When they had fulfilled all things that were written about him, they took him down from the tree, and laid him in a tomb. <sup class=\"v\">30<\/sup> But God raised him from the dead, <sup class=\"v\">31<\/sup> and he was seen for many days by those who came up with him from Galilee to Jerusalem, who are his witnesses to the people. <sup class=\"v\">32<\/sup> We bring you good news of the promise made to the fathers, <sup class=\"v\">33<\/sup> that God has fulfilled this to us, their children, in that he raised up Jesus. As it is also written in the second psalm,"},{"type":"poem","lines":["‘You are my Son.","Today I have become your father.’"]},{"type":"p","html":"<sup class=\"v\">34<\/sup> “Concerning that he raised him up from the dead, now no more to return to corruption, he has spoken thus: ‘I will give you the holy and sure blessings of David.’ <sup class=\"v\">35<\/sup> Therefore he says also in another psalm, ‘You will not allow your Holy One to see decay.’ <sup class=\"v\">36<\/sup> For David, after he had in his own generation served the counsel of God, fell asleep, was laid with his fathers, and saw decay. <sup class=\"v\">37<\/sup> But he whom God raised up saw no decay. <sup class=\"v\">38<\/sup> Be it known to you therefore, brothers, that through this man is proclaimed to you remission of sins, <sup class=\"v\">39<\/sup> and by him everyone who believes is justified from all things, from which you could not be justified by the law of Moses. <sup class=\"v\">40<\/sup> Beware therefore, lest that come on you which is spoken in the prophets:"},{"type":"poem","lines":[" <sup class=\"v\">41<\/sup> ‘Behold, you scoffers, and wonder, and perish;","for I work a work in your days,","a work which you will in no way believe, if one declares it to you.’ ”"]},{"type":"q","id":"13.4","field":"q82","text":"<b>Head:<\/b> Look at the image of the scroll. Paul told the story of God’s people from Scripture and pointed to Jesus. How does knowing the whole story of the Bible help you understand Jesus?"},{"type":"q","id":"13.5","field":"q83","text":"<b>Heart:<\/b> “Through this man is proclaimed to you remission of sins” (v. 38). What does forgiveness mean to you?"},{"type":"p","html":"<sup class=\"v\">42<\/sup> So when the Jews went out of the synagogue, the Gentiles begged that these words might be preached to them the next Sabbath. <sup class=\"v\">43<\/sup> Now when the synagogue broke up, many of the Jews and of the devout proselytes followed Paul and Barnabas; who, speaking to them, urged them to continue in the grace of God."},{"type":"h2","text":"Turning to the Gentiles"},{"type":"p","html":"<sup class=\"v\">44<\/sup> The next Sabbath, almost the whole city was gathered together to hear the word of God. <sup class=\"v\">45<\/sup> But when the Jews saw the multitudes, they were filled with jealousy, and contradicted the things which were spoken by Paul, and blasphemed."},{"type":"p","html":"<sup class=\"v\">46<\/sup> Paul and Barnabas spoke out boldly, and said, “It was necessary that God’s word should be spoken to you first. Since indeed you thrust it from yourselves, and judge yourselves unworthy of eternal life, behold, we turn to the Gentiles."},{"type":"img","src":"img/acts13-v47.jpg","w":1100,"h":733,"alt":"The earth lit up in space"},{"type":"p","html":"<sup class=\"v\">47<\/sup> For so has the Lord commanded us, saying,"},{"type":"poem","lines":["‘I have set you as a light for the Gentiles,","that you should bring salvation to the uttermost parts of the earth.’ ”"]},{"type":"p","html":"<sup class=\"v\">48<\/sup> As the Gentiles heard this, they were glad, and glorified the word of God. As many as were appointed to eternal life believed. <sup class=\"v\">49<\/sup> The Lord’s word was spread abroad throughout all the region. <sup class=\"v\">50<\/sup> But the Jews stirred up the devout and prominent women and the chief men of the city, and stirred up a persecution against Paul and Barnabas, and threw them out of their borders. <sup class=\"v\">51<\/sup> But they shook off the dust of their feet against them, and came to Iconium. <sup class=\"v\">52<\/sup> The disciples were filled with joy and with the Holy Spirit."},{"type":"q","id":"13.6","field":"q84","text":"<b>Action:<\/b> Consider the image of the light. The Lord said, “I have set you as a light for the Gentiles” (v. 47). How can your life be a light to others this week?"},{"type":"q","id":"13.7","field":"q85","text":"<b>Head:<\/b> Even when they were driven out, “The disciples were filled with joy and with the Holy Spirit” (v. 52). Where does lasting joy come from?"}],"prayer":"God, you sent your servants as “a light for the Gentiles” (13:47). Give me wisdom as I read, and help me listen when your Spirit calls me to your work (13:2)."},{"num":14,"hero":{"src":"img/acts14-hero.jpg","w":1100,"h":731,"alt":"A road winding through green mountains"},"blocks":[{"type":"h2","text":"In Iconium"},{"type":"p","html":"<sup class=\"v\">1<\/sup> In Iconium, they entered together into the synagogue of the Jews, and so spoke that a great multitude both of Jews and of Greeks believed. <sup class=\"v\">2<\/sup> But the disbelieving Jews stirred up and embittered the souls of the Gentiles against the brothers. <sup class=\"v\">3<\/sup> Therefore they stayed there a long time, speaking boldly in the Lord, who testified to the word of his grace, granting signs and wonders to be done by their hands. <sup class=\"v\">4<\/sup> But the multitude of the city was divided. Part sided with the Jews, and part with the apostles. <sup class=\"v\">5<\/sup> When some of both the Gentiles and the Jews, with their rulers, made a violent attempt to mistreat and stone them, <sup class=\"v\">6<\/sup> they became aware of it and fled to the cities of Lycaonia, Lystra, Derbe, and the surrounding region. <sup class=\"v\">7<\/sup> There they preached the Good News."},{"type":"q","id":"14.1","field":"q86","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Paul and Barnabas kept traveling and stayed “speaking boldly in the Lord” (v. 3). What keeps you going when the road is hard?"},{"type":"h2","text":"In Lystra and Derbe"},{"type":"img","src":"img/acts14-v08.jpg","w":1100,"h":733,"alt":"A woman standing beside an empty wheelchair"},{"type":"p","html":"<sup class=\"v\">8<\/sup> At Lystra a certain man sat, impotent in his feet, a cripple from his mother’s womb, who never had walked. <sup class=\"v\">9<\/sup> He was listening to Paul speaking, who, fastening eyes on him, and seeing that he had faith to be made whole, <sup class=\"v\">10<\/sup> said with a loud voice, “Stand upright on your feet!” He leaped up and walked. <sup class=\"v\">11<\/sup> When the multitude saw what Paul had done, they lifted up their voice, saying in the language of Lycaonia, “The gods have come down to us in the likeness of men!” <sup class=\"v\">12<\/sup> They called Barnabas “Jupiter”, and Paul “Mercury”, because he was the chief speaker. <sup class=\"v\">13<\/sup> The priest of Jupiter, whose temple was in front of their city, brought oxen and garlands to the gates, and would have made a sacrifice along with the multitudes. <sup class=\"v\">14<\/sup> But when the apostles, Barnabas and Paul, heard of it, they tore their clothes, and sprang into the multitude, crying out, <sup class=\"v\">15<\/sup> “Men, why are you doing these things? We also are men of like passions with you, and bring you good news, that you should turn from these vain things to the living God, who made the sky, the earth, the sea, and all that is in them; <sup class=\"v\">16<\/sup> who in the generations gone by allowed all the nations to walk in their own ways."},{"type":"img","src":"img/acts14-v17.jpg","w":1100,"h":619,"alt":"Rain falling over green fields"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Yet he didn’t leave himself without witness, in that he did good and gave you rains from the sky and fruitful seasons, filling our hearts with food and gladness.”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Even saying these things, they hardly stopped the multitudes from making a sacrifice to them. <sup class=\"v\">19<\/sup> But some Jews from Antioch and Iconium came there, and having persuaded the multitudes, they stoned Paul, and dragged him out of the city, supposing that he was dead."},{"type":"q","id":"14.2","field":"q87","text":"<b>Action:<\/b> Consider the image of the empty wheelchair. Paul said with a loud voice, “Stand upright on your feet!” (v. 10). What would it mean for you to stand up in faith? Where will you take that step?"},{"type":"q","id":"14.3","field":"q88","text":"<b>Head:<\/b> When the crowd tried to worship them, Paul and Barnabas said, “We also are men of like passions with you” (v. 15). Why is it dangerous to put people on a pedestal?"},{"type":"q","id":"14.4","field":"q89","text":"<b>Heart:<\/b> Look at the image of the rain. God “gave you rains from the sky and fruitful seasons, filling our hearts with food and gladness” (v. 17). Where do you see God’s goodness in creation?"},{"type":"p","html":"<sup class=\"v\">20<\/sup> But as the disciples stood around him, he rose up, and entered into the city. On the next day he went out with Barnabas to Derbe."},{"type":"h2","text":"Return to Antioch"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When they had preached the Good News to that city, and had made many disciples, they returned to Lystra, Iconium, and Antioch, <sup class=\"v\">22<\/sup> strengthening the souls of the disciples, exhorting them to continue in the faith, and that through many afflictions we must enter into God’s Kingdom. <sup class=\"v\">23<\/sup> When they had appointed elders for them in every assembly, and had prayed with fasting, they commended them to the Lord, on whom they had believed."},{"type":"q","id":"14.5","field":"q90","text":"<b>Head:<\/b> Paul told the believers, “Through many afflictions we must enter into God’s Kingdom” (v. 22). How does this honest word help you when life is hard?"},{"type":"p","html":"<sup class=\"v\">24<\/sup> They passed through Pisidia, and came to Pamphylia. <sup class=\"v\">25<\/sup> When they had spoken the word in Perga, they went down to Attalia. <sup class=\"v\">26<\/sup> From there they sailed to Antioch, from where they had been committed to the grace of God for the work which they had fulfilled."},{"type":"img","src":"img/acts14-v27.jpg","w":1100,"h":732,"alt":"An old wooden door opening to the light"},{"type":"p","html":"<sup class=\"v\">27<\/sup> When they had arrived, and had gathered the assembly together, they reported all the things that God had done with them, and that he had opened a door of faith to the nations. <sup class=\"v\">28<\/sup> They stayed there with the disciples for a long time."},{"type":"q","id":"14.6","field":"q91","text":"<b>Action:<\/b> Consider the image of the door. They reported how God “had opened a door of faith to the nations” (v. 27). What door of faith has God opened for you? How will you walk through it?"}],"prayer":"God, you never leave yourself without a witness; you give rain, fruitful seasons and gladness (14:17). Give me wisdom as I read, and help me stay faithful through hard times (14:22)."},{"num":15,"hero":{"src":"img/acts15-hero.jpg","w":1100,"h":733,"alt":"A round meeting table"},"blocks":[{"type":"h2","text":"The Council at Jerusalem"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Some men came down from Judea and taught the brothers, “Unless you are circumcised after the custom of Moses, you can’t be saved.” <sup class=\"v\">2<\/sup> Therefore when Paul and Barnabas had no small discord and discussion with them, they appointed Paul and Barnabas, and some others of them, to go up to Jerusalem to the apostles and elders about this question. <sup class=\"v\">3<\/sup> They, being sent on their way by the assembly, passed through both Phoenicia and Samaria, declaring the conversion of the Gentiles. They caused great joy to all the brothers. <sup class=\"v\">4<\/sup> When they had come to Jerusalem, they were received by the assembly and the apostles and the elders, and they reported everything that God had done with them."},{"type":"p","html":"<sup class=\"v\">5<\/sup> But some of the sect of the Pharisees who believed rose up, saying, “It is necessary to circumcise them, and to command them to keep the law of Moses.”"},{"type":"q","id":"15.1","field":"q92","text":"<b>Head:<\/b> Look at the image that opens this chapter. The church faced a big disagreement, and “The apostles and the elders were gathered together to see about this matter” (v. 6). How should Christians handle disagreements?"},{"type":"p","html":"<sup class=\"v\">6<\/sup> The apostles and the elders were gathered together to see about this matter. <sup class=\"v\">7<\/sup> When there had been much discussion, Peter rose up and said to them, “Brothers, you know that a good while ago God made a choice among you that by my mouth the nations should hear the word of the Good News and believe. <sup class=\"v\">8<\/sup> God, who knows the heart, testified about them, giving them the Holy Spirit, just like he did to us. <sup class=\"v\">9<\/sup> He made no distinction between us and them, cleansing their hearts by faith."},{"type":"img","src":"img/acts15-v10.jpg","w":1100,"h":733,"alt":"A man carrying a heavy load on his head"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Now therefore why do you tempt God, that you should put a yoke on the neck of the disciples which neither our fathers nor we were able to bear? <sup class=\"v\">11<\/sup> But we believe that we are saved through the grace of the Lord Jesus, just as they are.”"},{"type":"q","id":"15.2","field":"q93","text":"<b>Head:<\/b> Peter said God “made no distinction between us and them, cleansing their hearts by faith” (v. 9). What does this teach you about how God sees people?"},{"type":"q","id":"15.3","field":"q94","text":"<b>Heart:<\/b> Consider the image of the heavy load. Peter asked why they would put “a yoke on the neck of the disciples” that no one could bear (v. 10). What heavy burdens do people carry when they try to earn God’s love? Have you ever carried that burden?"},{"type":"q","id":"15.4","field":"q95","text":"<b>Action:<\/b> “We believe that we are saved through the grace of the Lord Jesus” (v. 11). How would you explain grace in your own words? Share that explanation with someone this week."},{"type":"p","html":"<sup class=\"v\">12<\/sup> All the multitude kept silence, and they listened to Barnabas and Paul reporting what signs and wonders God had done among the nations through them. <sup class=\"v\">13<\/sup> After they were silent, James answered, “Brothers, listen to me. <sup class=\"v\">14<\/sup> Simeon has reported how God first visited the nations to take out of them a people for his name. <sup class=\"v\">15<\/sup> This agrees with the words of the prophets. As it is written,"},{"type":"poem","lines":[" <sup class=\"v\">16<\/sup> ‘After these things I will return.","I will again build the tabernacle of David, which has fallen.","I will again build its ruins.","I will set it up <sup class=\"v\">17<\/sup> that the rest of men may seek after the Lord;","all the Gentiles who are called by my name,","says the Lord, who does all these things.’"]},{"type":"p","html":"<sup class=\"v\">18<\/sup> “All of God’s works are known to him from eternity. <sup class=\"v\">19<\/sup> Therefore my judgment is that we don’t trouble those from among the Gentiles who turn to God, <sup class=\"v\">20<\/sup> but that we write to them that they abstain from the pollution of idols, from sexual immorality, from what is strangled, and from blood. <sup class=\"v\">21<\/sup> For Moses from generations of old has in every city those who preach him, being read in the synagogues every Sabbath.”"},{"type":"h2","text":"The Letter to Gentile Believers"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Then it seemed good to the apostles and the elders, with the whole assembly, to choose men out of their company, and send them to Antioch with Paul and Barnabas: Judas called Barsabbas, and Silas, chief men among the brothers. <sup class=\"v\">23<\/sup> They wrote these things by their hand:"},{"type":"p","html":"“The apostles, the elders, and the brothers, to the brothers who are of the Gentiles in Antioch, Syria, and Cilicia: greetings. <sup class=\"v\">24<\/sup> Because we have heard that some who went out from us have troubled you with words, unsettling your souls, saying, ‘You must be circumcised and keep the law,’ to whom we gave no commandment; <sup class=\"v\">25<\/sup> it seemed good to us, having come to one accord, to choose out men and send them to you with our beloved Barnabas and Paul, <sup class=\"v\">26<\/sup> men who have risked their lives for the name of our Lord Jesus Christ. <sup class=\"v\">27<\/sup> We have sent therefore Judas and Silas, who themselves will also tell you the same things by word of mouth. <sup class=\"v\">28<\/sup> For it seemed good to the Holy Spirit, and to us, to lay no greater burden on you than these necessary things: <sup class=\"v\">29<\/sup> that you abstain from things sacrificed to idols, from blood, from things strangled, and from sexual immorality, from which if you keep yourselves, it will be well with you. Farewell.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> So, when they were sent off, they came to Antioch. Having gathered the multitude together, they delivered the letter."},{"type":"img","src":"img/acts15-v31.jpg","w":1100,"h":734,"alt":"A woman reading a letter"},{"type":"p","html":"<sup class=\"v\">31<\/sup> When they had read it, they rejoiced over the encouragement. <sup class=\"v\">32<\/sup> Judas and Silas, also being prophets themselves, encouraged the brothers with many words and strengthened them. <sup class=\"v\">33<\/sup> After they had spent some time there, they were sent back with greetings from the brothers to the apostles. <sup class=\"v\">34<\/sup>  <sup class=\"v\">35<\/sup> But Paul and Barnabas stayed in Antioch, teaching and preaching the word of the Lord, with many others also."},{"type":"q","id":"15.5","field":"q96","text":"<b>Heart:<\/b> Look at the image of the letter. When the believers read the letter, “they rejoiced over the encouragement” (v. 31). When has a letter or message encouraged you?"},{"type":"h2","text":"Paul and Barnabas Separate"},{"type":"p","html":"<sup class=\"v\">36<\/sup> After some days Paul said to Barnabas, “Let’s return now and visit our brothers in every city in which we proclaimed the word of the Lord, to see how they are doing.” <sup class=\"v\">37<\/sup> Barnabas planned to take John, who was called Mark, with them also. <sup class=\"v\">38<\/sup> But Paul didn’t think that it was a good idea to take with them someone who had withdrawn from them in Pamphylia, and didn’t go with them to do the work."},{"type":"img","src":"img/acts15-v39.jpg","w":1100,"h":825,"alt":"A dirt road that splits in two"},{"type":"p","html":"<sup class=\"v\">39<\/sup> Then the contention grew so sharp that they separated from each other. Barnabas took Mark with him and sailed away to Cyprus, <sup class=\"v\">40<\/sup> but Paul chose Silas and went out, being commended by the brothers to the grace of God. <sup class=\"v\">41<\/sup> He went through Syria and Cilicia, strengthening the assemblies."},{"type":"q","id":"15.6","field":"q97","text":"<b>Action:<\/b> Consider the image of the road. Paul and Barnabas had such a sharp disagreement that they separated (v. 39). How can God still work when Christians disagree? Is there a broken relationship you could help mend?"}],"prayer":"God, you know the heart, and you save us “through the grace of the Lord Jesus” (15:8, 11). Give me wisdom as I read, and keep me from putting heavy burdens on others (15:10, 19)."},{"num":16,"hero":{"src":"img/acts16-hero.jpg","w":1100,"h":646,"alt":"Fishing boats leaving a harbor at dawn"},"blocks":[{"type":"h2","text":"Timothy Joins Paul and Silas"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He came to Derbe and Lystra: and behold, a certain disciple was there, named Timothy, the son of a Jewess who believed; but his father was a Greek. <sup class=\"v\">2<\/sup> The brothers who were at Lystra and Iconium gave a good testimony about him. <sup class=\"v\">3<\/sup> Paul wanted to have him go out with him, and he took and circumcised him because of the Jews who were in those parts; for they all knew that his father was a Greek. <sup class=\"v\">4<\/sup> As they went on their way through the cities, they delivered the decrees to them to keep which had been ordained by the apostles and elders who were at Jerusalem. <sup class=\"v\">5<\/sup> So the assemblies were strengthened in the faith, and increased in number daily."},{"type":"h2","text":"Paul’s Vision of the Man of Macedonia"},{"type":"p","html":"<sup class=\"v\">6<\/sup> When they had gone through the region of Phrygia and Galatia, they were forbidden by the Holy Spirit to speak the word in Asia. <sup class=\"v\">7<\/sup> When they had come opposite Mysia, they tried to go into Bithynia, but the Spirit didn’t allow them. <sup class=\"v\">8<\/sup> Passing by Mysia, they came down to Troas. <sup class=\"v\">9<\/sup> A vision appeared to Paul in the night. There was a man of Macedonia standing, begging him, and saying, “Come over into Macedonia and help us.” <sup class=\"v\">10<\/sup> When he had seen the vision, immediately we sought to go out to Macedonia, concluding that the Lord had called us to preach the Good News to them."},{"type":"q","id":"16.1","field":"q98","text":"<b>Action:<\/b> Look at the image that opens this chapter. In a vision, a man of Macedonia begged Paul, “Come over into Macedonia and help us” (v. 9). Who might be calling out for help today? How could you answer?"},{"type":"q","id":"16.2","field":"q99","text":"<b>Heart:<\/b> The Spirit closed some doors before opening another (v. 6-7). How do you respond when God says “not here” or “not yet”?"},{"type":"h2","text":"Lydia Believes"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Setting sail therefore from Troas, we made a straight course to Samothrace, and the day following to Neapolis; <sup class=\"v\">12<\/sup> and from there to Philippi, which is a city of Macedonia, the foremost of the district, a Roman colony. We were staying some days in this city."},{"type":"img","src":"img/acts16-v13.jpg","w":1100,"h":731,"alt":"Purple satin cloth"},{"type":"p","html":"<sup class=\"v\">13<\/sup> On the Sabbath day we went outside of the city by a riverside, where we supposed there was a place of prayer, and we sat down and spoke to the women who had come together. <sup class=\"v\">14<\/sup> A certain woman named Lydia, a seller of purple, of the city of Thyatira, one who worshiped God, heard us. The Lord opened her heart to listen to the things which were spoken by Paul. <sup class=\"v\">15<\/sup> When she and her household were baptized, she begged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” So she persuaded us."},{"type":"q","id":"16.3","field":"q100","text":"<b>Heart:<\/b> Consider the image of the purple cloth. Lydia was a seller of purple, and “The Lord opened her heart” (v. 14). How has God opened your heart?"},{"type":"h2","text":"Paul and Silas in Prison"},{"type":"p","html":"<sup class=\"v\">16<\/sup> As we were going to prayer, a certain girl having a spirit of divination met us, who brought her masters much gain by fortune telling. <sup class=\"v\">17<\/sup> Following Paul and us, she cried out, “These men are servants of the Most High God, who proclaim to us a way of salvation!” <sup class=\"v\">18<\/sup> She was doing this for many days."},{"type":"p","html":"But Paul, becoming greatly annoyed, turned and said to the spirit, “I command you in the name of Jesus Christ to come out of her!” It came out that very hour. <sup class=\"v\">19<\/sup> But when her masters saw that the hope of their gain was gone, they seized Paul and Silas, and dragged them into the marketplace before the rulers. <sup class=\"v\">20<\/sup> When they had brought them to the magistrates, they said, “These men, being Jews, are agitating our city <sup class=\"v\">21<\/sup> and advocate customs which it is not lawful for us to accept or to observe, being Romans.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> The multitude rose up together against them and the magistrates tore their clothes from them, then commanded them to be beaten with rods. <sup class=\"v\">23<\/sup> When they had laid many stripes on them, they threw them into prison, charging the jailer to keep them safely, <sup class=\"v\">24<\/sup> who, having received such a command, threw them into the inner prison, and secured their feet in the stocks."},{"type":"q","id":"16.4","field":"q101","text":"<b>Head:<\/b> Paul and Silas were beaten and thrown into prison for setting a slave girl free (v. 16-24). What does it cost to do what is right?"},{"type":"img","src":"img/acts16-v25.jpg","w":1100,"h":733,"alt":"A lantern glowing at night"},{"type":"p","html":"<sup class=\"v\">25<\/sup> But about midnight Paul and Silas were praying and singing hymns to God, and the prisoners were listening to them. <sup class=\"v\">26<\/sup> Suddenly there was a great earthquake, so that the foundations of the prison were shaken; and immediately all the doors were opened, and everyone’s bonds were loosened. <sup class=\"v\">27<\/sup> The jailer, being roused out of sleep and seeing the prison doors open, drew his sword and was about to kill himself, supposing that the prisoners had escaped. <sup class=\"v\">28<\/sup> But Paul cried with a loud voice, saying, “Don’t harm yourself, for we are all here!”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> He called for lights, sprang in, fell down trembling before Paul and Silas, <sup class=\"v\">30<\/sup> brought them out, and said, “Sirs, what must I do to be saved?”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> They said, “Believe in the Lord Jesus Christ, and you will be saved, you and your household.” <sup class=\"v\">32<\/sup> They spoke the word of the Lord to him, and to all who were in his house."},{"type":"q","id":"16.5","field":"q102","text":"<b>Heart:<\/b> Look at the image of the lantern. “About midnight Paul and Silas were praying and singing hymns to God” (v. 25). How can you praise God in your midnight hours?"},{"type":"q","id":"16.6","field":"q103","text":"<b>Head:<\/b> The jailer asked, “Sirs, what must I do to be saved?” and they answered, “Believe in the Lord Jesus Christ, and you will be saved” (v. 30-31). How would you answer the jailer’s question?"},{"type":"p","html":"<sup class=\"v\">33<\/sup> He took them the same hour of the night and washed their stripes, and was immediately baptized, he and all his household."},{"type":"img","src":"img/acts16-v34.jpg","w":1100,"h":731,"alt":"A family sharing a picnic"},{"type":"p","html":"<sup class=\"v\">34<\/sup> He brought them up into his house, and set food before them, and rejoiced greatly, with all his household, having believed in God."},{"type":"q","id":"16.7","field":"q104","text":"<b>Action:<\/b> Consider the image of the family meal. The jailer washed their wounds, set food before them, “rejoiced greatly, with all his household, having believed in God” (v. 34). How does faith change a home? What could you do to bring Christ’s love into your home this week?"},{"type":"h2","text":"Paul and Silas Are Released"},{"type":"p","html":"<sup class=\"v\">35<\/sup> But when it was day, the magistrates sent the sergeants, saying, “Let those men go.”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> The jailer reported these words to Paul, saying, “The magistrates have sent to let you go; now therefore come out and go in peace.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> But Paul said to them, “They have beaten us publicly without a trial, men who are Romans, and have cast us into prison! Do they now release us secretly? No, most certainly, but let them come themselves and bring us out!”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> The sergeants reported these words to the magistrates, and they were afraid when they heard that they were Romans, <sup class=\"v\">39<\/sup> and they came and begged them. When they had brought them out, they asked them to depart from the city. <sup class=\"v\">40<\/sup> They went out of the prison, and entered into Lydia’s house. When they had seen the brothers, they encouraged them, then departed."}],"prayer":"Father in heaven, you opened Lydia’s heart (16:14) and shook the prison doors at midnight (16:26). Give me wisdom as I read, and help me sing your praise even in dark places (16:25)."},{"num":17,"hero":{"src":"img/acts17-hero.jpg","w":1100,"h":736,"alt":"Ancient stone busts of Greek thinkers"},"blocks":[{"type":"h2","text":"In Thessalonica"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now when they had passed through Amphipolis and Apollonia, they came to Thessalonica, where there was a Jewish synagogue. <sup class=\"v\">2<\/sup> Paul, as was his custom, went in to them, and for three Sabbath days reasoned with them from the Scriptures, <sup class=\"v\">3<\/sup> explaining and demonstrating that the Christ had to suffer and rise again from the dead, and saying, “This Jesus, whom I proclaim to you, is the Christ.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Some of them were persuaded and joined Paul and Silas, of the devout Greeks a great multitude, and not a few of the chief women. <sup class=\"v\">5<\/sup> But the unpersuaded Jews took along some wicked men from the marketplace, and gathering a crowd, set the city in an uproar. Assaulting the house of Jason, they sought to bring them out to the people. <sup class=\"v\">6<\/sup> When they didn’t find them, they dragged Jason and certain brothers before the rulers of the city, crying, “These who have turned the world upside down have come here also, <sup class=\"v\">7<\/sup> whom Jason has received. These all act contrary to the decrees of Caesar, saying that there is another king, Jesus!” <sup class=\"v\">8<\/sup> The multitude and the rulers of the city were troubled when they heard these things. <sup class=\"v\">9<\/sup> When they had taken security from Jason and the rest, they let them go."},{"type":"q","id":"17.1","field":"q105","text":"<b>Head:<\/b> Look at the image that opens this chapter. Paul’s enemies said, “These who have turned the world upside down have come here also” (v. 6). How did the good news turn the world upside down? How has it turned yours?"},{"type":"h2","text":"In Berea"},{"type":"p","html":"<sup class=\"v\">10<\/sup> The brothers immediately sent Paul and Silas away by night to Beroea. When they arrived, they went into the Jewish synagogue."},{"type":"img","src":"img/acts17-v11.jpg","w":1100,"h":733,"alt":"Hands holding an open Bible"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Now these were more noble than those in Thessalonica, in that they received the word with all readiness of mind, examining the Scriptures daily to see whether these things were so. <sup class=\"v\">12<\/sup> Many of them therefore believed; also of the prominent Greek women, and not a few men. <sup class=\"v\">13<\/sup> But when the Jews of Thessalonica had knowledge that the word of God was proclaimed by Paul at Beroea also, they came there likewise, agitating the multitudes. <sup class=\"v\">14<\/sup> Then the brothers immediately sent out Paul to go as far as to the sea, and Silas and Timothy still stayed there. <sup class=\"v\">15<\/sup> But those who escorted Paul brought him as far as Athens. Receiving a commandment to Silas and Timothy that they should come to him very quickly, they departed."},{"type":"q","id":"17.2","field":"q106","text":"<b>Action:<\/b> Consider the image of the open Bible. The Bereans received the word “examining the Scriptures daily to see whether these things were so” (v. 11). How do you test what you hear against Scripture? How could you search the Scriptures daily this week?"},{"type":"h2","text":"Paul in Athens"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Now while Paul waited for them at Athens, his spirit was provoked within him as he saw the city full of idols. <sup class=\"v\">17<\/sup> So he reasoned in the synagogue with the Jews and the devout persons, and in the marketplace every day with those who met him. <sup class=\"v\">18<\/sup> Some of the Epicurean and Stoic philosophers also were conversing with him. Some said, “What does this babbler want to say?”"},{"type":"p","html":"Others said, “He seems to be advocating foreign deities,” because he preached Jesus and the resurrection."},{"type":"p","html":"<sup class=\"v\">19<\/sup> They took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is, which you are speaking about? <sup class=\"v\">20<\/sup> For you bring certain strange things to our ears. We want to know therefore what these things mean.” <sup class=\"v\">21<\/sup> Now all the Athenians and the strangers living there spent their time in nothing else, but either to tell or to hear some new thing."},{"type":"q","id":"17.3","field":"q107","text":"<b>Head:<\/b> Paul’s spirit was troubled when he saw the city full of idols (v. 16). What do people in our culture worship instead of God?"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Paul stood in the middle of the Areopagus, and said, “You men of Athens, I perceive that you are very religious in all things."},{"type":"img","src":"img/acts17-v23.jpg","w":1100,"h":733,"alt":"An ancient inscription carved in stone"},{"type":"p","html":"<sup class=\"v\">23<\/sup> For as I passed along and observed the objects of your worship, I also found an altar with this inscription: ‘TO AN UNKNOWN GOD.’ What therefore you worship in ignorance, I announce to you. <sup class=\"v\">24<\/sup> The God who made the world and all things in it, he, being Lord of heaven and earth, doesn’t dwell in temples made with hands. <sup class=\"v\">25<\/sup> He isn’t served by men’s hands, as though he needed anything, seeing he himself gives to all life and breath, and all things. <sup class=\"v\">26<\/sup> He made from one blood every nation of men to dwell on all the surface of the earth, having determined appointed seasons, and the boundaries of their dwellings, <sup class=\"v\">27<\/sup> that they should seek the Lord, if perhaps they might reach out for him and find him, though he is not far from each one of us."},{"type":"img","src":"img/acts17-v28.jpg","w":1100,"h":1096,"alt":"A woman breathing in fresh air"},{"type":"p","html":"<sup class=\"v\">28<\/sup> ‘For in him we live, move, and have our being.’ As some of your own poets have said, ‘For we are also his offspring.’ <sup class=\"v\">29<\/sup> Being then the offspring of God, we ought not to think that the Divine Nature is like gold, or silver, or stone, engraved by art and design of man. <sup class=\"v\">30<\/sup> The times of ignorance therefore God overlooked. But now he commands that all people everywhere should repent, <sup class=\"v\">31<\/sup> because he has appointed a day in which he will judge the world in righteousness by the man whom he has ordained; of which he has given assurance to all men, in that he has raised him from
