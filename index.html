":"q","id":"28.2","field":"q176","text":"<b>Action:<\/b> Consider the image of the fire. The islanders “showed us uncommon kindness; for they kindled a fire and received us all, because of the present rain and because of the cold” (v. 2). Who has shown you uncommon kindness? To whom could you show it this week?"},{"type":"p","html":"<sup class=\"v\">7<\/sup> Now in the neighborhood of that place were lands belonging to the chief man of the island, named Publius, who received us, and courteously entertained us for three days. <sup class=\"v\">8<\/sup> The father of Publius lay sick of fever and dysentery. Paul entered in to him, prayed, and laying his hands on him, healed him. <sup class=\"v\">9<\/sup> Then when this was done, the rest also who had diseases in the island came and were cured. <sup class=\"v\">10<\/sup> They also honored us with many honors, and when we sailed, they put on board the things that we needed."},{"type":"q","id":"28.3","field":"q177","text":"<b>Action:<\/b> Paul healed many on the island (v. 8-9). How can you bring God’s care to the people around you this week?"},{"type":"h2","text":"Paul Arrives in Rome"},{"type":"p","html":"<sup class=\"v\">11<\/sup> After three months, we set sail in a ship of Alexandria which had wintered in the island, whose sign was “The Twin Brothers.” <sup class=\"v\">12<\/sup> Touching at Syracuse, we stayed there three days. <sup class=\"v\">13<\/sup> From there we circled around and arrived at Rhegium. After one day, a south wind sprang up, and on the second day we came to Puteoli, <sup class=\"v\">14<\/sup> where we found brothers, and were entreated to stay with them for seven days. So we came to Rome."},{"type":"img","src":"img/acts28-v15.jpg","w":1100,"h":746,"alt":"Three older friends talking over tea"},{"type":"p","html":"<sup class=\"v\">15<\/sup> From there the brothers, when they heard of us, came to meet us as far as The Market of Appius and The Three Taverns. When Paul saw them, he thanked God and took courage. <sup class=\"v\">16<\/sup> When we entered into Rome, the centurion delivered the prisoners to the captain of the guard, but Paul was allowed to stay by himself with the soldier who guarded him."},{"type":"q","id":"28.4","field":"q178","text":"<b>Heart:<\/b> Look at the image of the friends talking. When Paul saw the believers who came to meet him, “he thanked God and took courage” (v. 15). Who gives you courage? Whom could you encourage?"},{"type":"h2","text":"Paul Preaches in Rome"},{"type":"p","html":"<sup class=\"v\">17<\/sup> After three days Paul called together those who were the leaders of the Jews. When they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers, still was delivered prisoner from Jerusalem into the hands of the Romans, <sup class=\"v\">18<\/sup> who, when they had examined me, desired to set me free, because there was no cause of death in me. <sup class=\"v\">19<\/sup> But when the Jews spoke against it, I was constrained to appeal to Caesar, not that I had anything about which to accuse my nation. <sup class=\"v\">20<\/sup> For this cause therefore I asked to see you and to speak with you. For because of the hope of Israel I am bound with this chain.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> They said to him, “We neither received letters from Judea concerning you, nor did any of the brothers come here and report or speak any evil of you. <sup class=\"v\">22<\/sup> But we desire to hear from you what you think. For, as concerning this sect, it is known to us that everywhere it is spoken against.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> When they had appointed him a day, many people came to him at his lodging. He explained to them, testifying about God’s Kingdom, and persuading them concerning Jesus, both from the law of Moses and from the prophets, from morning until evening. <sup class=\"v\">24<\/sup> Some believed the things which were spoken, and some disbelieved. <sup class=\"v\">25<\/sup> When they didn’t agree among themselves, they departed after Paul had spoken one word, “The Holy Spirit spoke rightly through Isaiah the prophet to our fathers, <sup class=\"v\">26<\/sup> saying,"},{"type":"poem","lines":["‘Go to this people and say,","in hearing, you will hear,","but will in no way understand.","In seeing, you will see,","but will in no way perceive.","<sup class=\"v\">27<\/sup> For this people’s heart has grown callous.","Their ears are dull of hearing.","Their eyes they have closed.","Lest they should see with their eyes,","hear with their ears,","understand with their heart,","and would turn again,","then I would heal them.’"]},{"type":"p","html":"<sup class=\"v\">28<\/sup> “Be it known therefore to you, that the salvation of God is sent to the nations, and they will listen.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> When he had said these words, the Jews departed, having a great dispute among themselves."},{"type":"q","id":"28.5","field":"q179","text":"<b>Head:<\/b> Paul tried to persuade them “concerning Jesus, both from the law of Moses and from the prophets” (v. 23). Some believed and some did not (v. 24). How do you keep sharing your faith when people respond in different ways?"},{"type":"img","src":"img/acts28-v30.jpg","w":1100,"h":729,"alt":"An open door into a welcoming home"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Paul stayed two whole years in his own rented house and received all who were coming to him, <sup class=\"v\">31<\/sup> preaching God’s Kingdom, and teaching the things concerning the Lord Jesus Christ with all boldness, without hindrance."},{"type":"q","id":"28.6","field":"q180","text":"<b>Head:<\/b> Consider the image of the open door. Paul “received all who were coming to him, preaching God’s Kingdom… with all boldness, without hindrance” (v. 30-31). What does an open home and an open heart look like?"},{"type":"q","id":"28.7","field":"q181","text":"<b>Heart:<\/b> Acts ends with the gospel still spreading. As you look back over the images in Acts, which one will stay with you? Why?"}],"prayer":"God, your salvation “is sent to the nations” (28:28), and your word goes out “without hindrance” (28:31). Give me wisdom as I read, and help me share your Kingdom with all boldness."}],"discussion":{"intro":"Linking LIFE and SCRIPTURE using IMAGES is best done by asking questions. Visual Acts provides many such questions within the chapters. Below are ten types of image-based questions. These types and examples can help you craft your own questions as you lead group discussions and reflect personally on a passage.","types":[["Image to Story",null,["What story do you see in this image?","If an image is worth a thousand words, what words would you put with this image?"]],["Response to Image",null,["How do you respond to this image?","What emotions or feelings surface in you as you look at the picture?","How might these emotions link to your life story?"]],["Imaginations","a mental image, without looking at a picture",["As you consider the Bible story, how would you imagine it playing out?","How might you imagine yourself in that story?"]],["Link Image to Person",null,["If you put yourself in this picture, where would you be?","What would you be feeling? Thinking? Doing? Saying?","How might this image connect with your longings as a human being? (Consider longings such as: belong, intimacy, protect, provide, build, order, nurture, change, justice, mercy, explore, know, create, transcend.)","What message does this image convey? How might the image appeal to your decisions in life (choice of friends, career, purchases)?"]],["Link Image to Concept",null,["As you look at this image, how might it connect with the concept of grace, mercy, identity or power?","Consider these deep metaphors: balance, transformation, journey, container, connection, resource, control. (Gerald and Lindsay Zaltman, 2008). Which metaphor best relates to this image? Explain."]],["Link Image to Attractions, Aversions and Decisions",null,["Are you attracted to this image? If so, why? How do you usually manage your attractions?","Do you dislike this image? If so, why? How do you usually manage your aversions?","How might this image influence the way you make decisions?"]],["Link Image to God",null,["Where would you imagine God in this picture?","What is he doing? Thinking? Feeling? Saying? Explain why."]],["Link Image to Bible",null,["How do you see this image connecting with this passage?","What image might better connect with this passage for you?"]],["Link Image to Culture",null,["Our culture surrounds us with images. Which images in the past week relate to this passage? How did you respond to them?","What is the message of that image from the culture?","Does that cultural message align with the message of the Bible? Explain."]],["Link Image to Transformation",null,["As you reflect on this image and the passage, what surfaces in your heart? Where are you open to change, or closed to change?","How do this image and passage shape your view of God and his purposes? Is your heart aligned with God’s purposes?","How might this image encourage you in your daily walk with God?"]]]},"credits":[{"where":"Cover","desc":"A palm-lined Mediterranean road","page":"https://pixabay.com/photos/road-2746528/","user":""},{"where":"Welcome page","desc":"An old map of the Mediterranean","page":"https://pixabay.com/photos/globe-599486/","user":""},{"where":"Welcome page","desc":"Flames of fire","page":"https://pixabay.com/photos/fire-2573724/","user":""},{"where":"Welcome page","desc":"A path along a green ridge","page":"https://pixabay.com/photos/path-1826605/","user":""},{"where":"Acts 1, opening photo","desc":"Rays of light streaming through clouds","page":"https://pixabay.com/photos/sun-2643866/","user":""},{"where":"Acts 1, Jesus Is Taken Up into Heaven","desc":"The earth seen from space","page":"https://pixabay.com/photos/earth-11009/","user "A royal carriage procession","page":"https://pixabay.com/photos/ceremonial-coach-343398/","user":""},{"where":"Acts 26, opening photo","desc":"A road leading into the morning mist","page":"https://pixabay.com/photos/road-5731886/","user":""},{"where":"Acts 26, Paul Speaks to King Agrippa","desc":"The bright sun in a blue sky","page":"https://pixabay.com/photos/nature-3298353/","user":""},{"where":"Acts 26, Paul Speaks to King Agrippa","desc":"Light coming through a doorway into a dark room","page":"https://pixabay.com/photos/lost-places-3215405/","user":""},{"where":"Acts 26, Almost Persuaded","desc":"A statue of two men in conversation","page":"https://pixabay.com/photos/sculpture-6564439/","user":""},{"where":"Acts 27, opening photo","desc":"An old sailing ship","page":"https://pixabay.com/photos/boat-1713079/","user":""},{"where":"Acts 27, The Storm at Sea","desc":"A huge wave on a stormy sea","page":"https://pixabay.com/photos/water-1555170/","user":""},{"where":"Acts 27, The Shipwreck","desc":"A loaf of bread on a wooden table","page":"https://pixabay.com/photos/bread-1750987/","user":""},{"where":"Acts 27, The Shipwreck","desc":"Driftwood on a beach at sunset","page":"https://pixabay.com/photos/sea-7528351/","user":""},{"where":"Acts 28, opening photo","desc":"The harbor of Malta from the air","page":"https://pixabay.com/photos/lighthouse-2482778/","user":""},{"where":"Acts 28, On the Island of Malta","desc":"A bonfire burning at dusk","page":"https://pixabay.com/photos/fire-123784/","user":""},{"where":"Acts 28, Paul Arrives in Rome","desc":"Three older friends talking over tea","page":"https://pixabay.com/photos/grandma-1335722/","user":""},{"where":"Acts 28, Paul Preaches in Rome","desc":"An open door into a welcoming home","page":"https://pixabay.com/photos/pedorido-2209636/","user":""}],"master":{"welcome":"Master Questions. Three questions go with you through the whole book. You will find them again at the end of every chapter, with a box for your response, and the Summary after Acts 28 reviews them for the whole book. Responses and highlights are kept on this device only.","after":2,"chapter":"Step back and look at Acts {n} as a whole.","items":[["head","HEAD","What was the historical and cultural context of the original readers? What did this passage mean to them? (Context can be hard to know for sure, but it is important and helpful to consider.)"],["heart","HEART","What does this passage reveal about who God is? How does my heart respond to who He is? Is my heart open to Him as He reveals Himself? Am I judging God?"],["action","ACTION","What actions is God impressing on me to take? What should I carry with me into the future from this book?"]]},"summary":{"img":null,"intro":"You have read all 28 chapters of Acts. This Summary looks back over the whole book through the three Master Questions. Read each review, then write your own response in the boxes at the end.","respond":"Now answer the Master Questions for the whole book of Acts.","parts":[["head","Here is what we can say about the people who first read Acts.",[["Written to Theophilus","Luke wrote to “Theophilus” (1:1), as he had in his Gospel. His name means friend of God. He may have been a Roman official or a new believer who wanted to be sure the story was true."],["A church of many peoples","The first believers were Jews in Jerusalem. By the end of Acts the church included Samaritans, an official from Ethiopia, a Roman centurion and Greeks in many cities (8:5, 27; 10:1; 17:4)."],["Questions about Gentiles","Some taught, “Unless you are circumcised after the custom of Moses, you can’t be saved” (15:1). The church answered, “we believe that we are saved through the grace of the Lord Jesus, just as they are” (15:11)."],["Under Roman rule","Believers were often accused of causing trouble: “These who have turned the world upside down have come here also” (17:6). Luke shows that Roman officials kept finding Paul innocent (23:29; 26:31)."],["What the book meant to them","Acts showed believers that they were part of a story God was still writing. The same Spirit who filled the first disciples was with them, and the good news would go on “without hindrance” (28:31)."]],"Knowing their world helps you hear Acts as they did. Then ask what God is saying to you through it."],["heart","In Acts, God keeps his promise to send the Holy Spirit (1:4–5; 2:33). Here is what Acts shows about who God is.",[["Creator and Lord of all","“O Lord, you are God, who made the heaven, the earth, the sea, and all that is in them” (4:24). He “gives to all life and breath, and all things” (17:25)."],["The God who raises the dead","God raised Jesus, “because it was not possible that he should be held by it” (2:24)."],["Jesus, Lord and Christ","“God has made him both Lord and Christ, this Jesus whom you crucified” (2:36). “There is salvation in no one else” (4:12)."],["The Spirit who gives power","“They were all filled with the Holy Spirit, and they spoke the word of God with boldness” (4:31)."],["No favorites","“God doesn’t show favoritism; but in every nation he who fears him and works righteousness is acceptable to him” (10:34–35)."],["Near to every person","God made “every nation of men” so that people would seek him, “though he is not far from each one of us” (17:26–27)."],["Gracious and forgiving","“Through this man is proclaimed to you remission of sins” (13:38)."],["In control of history","Prison, storms and trials could not stop God’s plan. “Don’t be afraid, Paul. You must stand before Caesar” (27:24)."]],"Am I judging God? Some who heard about Jesus were “cut to the heart” and asked, “what shall we do?” (2:37). Others “stopped their ears” (7:57) or said, “Go your way for this time” (24:25). How does your heart respond to who God is? Is your heart open to him, or are you judging him?"],["action","Acts ends with Paul still “preaching God’s Kingdom” (28:31). Here are steps the book impresses on its readers.",[["Repent and believe","“Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins” (2:38). “Believe in the Lord Jesus Christ, and you will be saved” (16:31)."],["Devote yourself to the church","“They continued steadfastly in the apostles’ teaching and fellowship, in the breaking of bread, and prayer” (2:42)."],["Pray for boldness","“Grant to your servants to speak your word with all boldness” (4:29)."],["Obey God","“We must obey God rather than men” (5:29)."],["Give generously","“It is more blessed to give than to receive” (20:35)."],["Search the Scriptures","Like the Bereans, receive the word “with all readiness of mind, examining the Scriptures daily” (17:11)."],["Be a witness","“You will be a witness for him to all men of what you have seen and heard” (22:15)."],["Finish the race","Paul’s goal was to “finish my race with joy” (20:24)."]],"Carry this with you: “you will receive power when the Holy Spirit has come upon you. You will be witnesses to me” (1:8)."]]},"deeper":{"img":null,"intro":"Going Deeper is a short study guide to the whole book of Acts. Use it after you finish reading, or alongside it, to see the big picture: who wrote Acts and when, the world it comes from, how the book is built, the themes and emotions that run through it, and free websites for further study.","sections":[["overview","Author and book overview"],["history","Historical and cultural insights"],["chart","Chart of the book"],["themes","Major themes and emotions"],["resources","Free resources online"]],"overviewLead":"Acts continues the story Luke began in his Gospel, which told “all that Jesus began both to do and to teach” (1:1). Acts tells what the risen Jesus kept doing through his Spirit and his people, from Jerusalem to Rome.","overview":[["Author","The book does not name its author, but it continues “The first book” written to Theophilus (1:1), the Gospel of Luke. The early church agreed that both were written by Luke, a doctor who traveled with Paul."],["Date","Many scholars date Acts to the early 60s A.D., because it ends with Paul still waiting in Rome (28:30). Others date it to the 70s or 80s A.D."],["Readers","Theophilus (1:1) and, through him, believers everywhere who wanted to know how the good news reached them."],["Structure","Jesus’ words in 1:8 give the outline: witnesses “in Jerusalem” (chapters 1–7), “in all Judea and Samaria” (8–12) and “to the uttermost parts of the earth” (13–28)."],["Main people","Peter leads in chapters 1–12, and Paul, first called Saul, in chapters 13–28. Others include Stephen, Philip, Barnabas, Silas, Timothy, Lydia, Priscilla and Aquila."],["Purpose","To show how the risen Jesus, by the Holy Spirit, carried the good news across every barrier of people and place, and that God “doesn’t show favoritism” (10:34)."],["Key verses","1:8; 2:38–42; 4:12; 4:31; 10:34–35; 13:47; 15:11; 16:31; 17:26–28; 20:24; 28:31."],["“We” passages","In some passages Luke writes “we” (16:10–17; 20:5–21:18; 27:1–28:16), which suggests that he traveled with Paul on those parts of the journey."],["Acts and the Old Testament","Peter, Stephen and Paul preach from the Scriptures, quoting Joel (2:16–21), the Psalms (2:25–28) and Isaiah (8:32–33; 13:47; 28:26–27)."]],"history":[["Pentecost","Pentecost, the Feast of Weeks, came fifty days after Passover. Jews “from every nation under the sky” (2:5) were in Jerusalem for it, so the first sermon reached people from many lands."],["Jews and Gentiles","Jews did not normally eat with Gentiles or enter their homes. Peter said, “You yourselves know how it is an unlawful thing for a man who is a Jew to join himself or come to one of another nation” (10:28)."],["Samaritans","Jews and Samaritans had been divided for centuries. When “Samaria had received the word of God” (8:14), an old wall came down."],["The synagogue","In most cities Jews met in a synagogue to read “the law and the prophets” (13:15). Paul usually went there first (13:5; 17:1–2; 18:4)."],["Roman citizenship","A Roman citizen could not be beaten without a trial and had the right to appeal to Caesar. Paul used these rights (16:37; 22:25; 25:11)."],["Governors and kings","Felix and Festus were Roman governors of Judea, and Agrippa was a Jewish king under Rome. Paul spoke before all three (chapters 24–26)."],["Athens","Athens was famous for its philosophers and its many altars. Paul found one with the inscription “TO AN UNKNOWN GOD” (17:23)."],["Ephesus","Ephesus had a great temple to the goddess Artemis, and silversmiths made a living from it. When people turned to Christ, the silversmiths started a riot (19:24–29)."],["Travel by sea","Ships rarely sailed in winter. Paul’s voyage to Rome began late in the season, after “the Fast had now already gone by” (27:9), and it ended in shipwreck on Malta."]],"chart":[["Witnesses in Jerusalem","1:1–7:60",1,253,"Jesus ascends, the Spirit comes at Pentecost, the church grows, and Stephen is killed.","4:12","“There is salvation in no one else”"],["Judea and Samaria","8:1–12:25",8,186,"Philip in Samaria, Saul meets Jesus, Peter at Cornelius’ house, and the church in Antioch.","10:34","“Truly I perceive that God doesn’t show favoritism”"],["Paul’s first journey","13:1–14:28",13,80,"Barnabas and Saul are sent to Cyprus and the towns of Galatia.","13:47","“I have set you as a light for the Gentiles”"],["The Jerusalem council","15:1–35",15,35,"The church agrees that Gentiles are saved by grace without becoming Jews.","15:11","“we believe that we are saved through the grace of the Lord Jesus”"],["Paul’s second journey","15:36–18:22",15,102,"Paul and Silas take the good news to Philippi, Thessalonica, Athens and Corinth.","16:31","“Believe in the Lord Jesus Christ, and you will be saved”"],["Paul’s third journey","18:23–21:16",18,101,"Paul spends years in Ephesus and says goodbye to the Ephesian elders.","20:24","“so that I may finish my race with joy”"],["Paul on trial","21:17–26:32",21,175,"Paul is arrested in Jerusalem and tells his story before councils, governors and a king.","26:18","“that they may turn from darkness to light”"],["To Rome","27:1–28:31",27,75,"Storm and shipwreck, winter on Malta, and Paul preaching in Rome.","28:31","“with all boldness, without hindrance.”"]],"chartLead":"The whole book of Acts, drawn to scale by verses. Tap a color to open that part of the book.","chartLabel":"Chart of the book of Acts","ticks":[["Acts 1",0],["7",22.14],["14",50.15],["21",75.57],["28",100]],"refHead":"Passage","refWord":"Acts","roundsTitle":"Paul’s journeys","roundsHead":["Journey","Passage","Main places","Key words"],"roundsEmph":[],"rounds":[["First journey","13:1–14:28","Cyprus, Antioch of Pisidia, Iconium, Lystra and Derbe","“he had opened a door of faith to the nations” (14:27)"],["Second journey","15:36–18:22","Philippi, Thessalonica, Berea, Athens and Corinth","“Come over into Macedonia and help us” (16:9)"],["Third journey","18:23–21:16","Ephesus, Macedonia, Greece, Troas and Miletus","“the word of the Lord was growing and becoming mighty” (19:20)"],["Journey to Rome","27:1–28:16","Crete, Malta and Rome","“God has granted you all those who sail with you” (27:24)"]],"roundsNote":"In each new city Paul usually went to the synagogue first and then turned to the Gentiles (13:5, 46; 17:1–2; 18:4–6). Between journeys he returned to report “all the things that God had done” (14:27).","themes":[["The Holy Spirit","The Spirit comes at Pentecost (2:4), gives boldness (4:31) and sends out missionaries (13:2)."],["Witness","Jesus said, “You will be witnesses to me” (1:8), and the apostles said, “we can’t help telling the things which we saw and heard” (4:20)."],["Good news for every nation","“God doesn’t show favoritism” (10:34), and “God has also granted to the Gentiles repentance to life!” (11:18)."],["Prayer","The church prays before choosing leaders, in danger and in prison (1:14; 4:24–31; 12:5; 16:25)."],["Suffering and joy","The apostles left the council “rejoicing that they were counted worthy to suffer dishonor for Jesus’ name” (5:41). “Through many afflictions we must enter into God’s Kingdom” (14:22)."],["The word grows","Again and again Luke reports that the word grew: “the word of God grew and multiplied” (6:7; 12:24; 19:20)."],["A sharing community","The believers “were of one heart and soul” and “had all things in common” (4:32)."],["God’s plan cannot be stopped","Gamaliel warned, “if it is of God, you will not be able to overthrow it” (5:39)."]],"emotionsTitle":"Emotions: from fear to great joy","emotionsLead":"Acts shows the feelings of the first believers and of the people who heard them. Follow them through the book, and let them help you bring your own feelings to God.","emotions":[["Amazement","2:12"],["Cut to the heart","2:37"],["Gladness","2:46"],["Leaping and praising","3:8"],["Great fear","5:11"],["Rejoicing in suffering","5:41"],["Rage","7:54"],["Grief","8:2"],["Great joy","8:8"],["Suspicion","9:26"],["Filled with joy","13:52"],["Tears of farewell","20:37"],["Terror","24:25"],["Courage","28:15"]],"resourcesLead":"These free websites can help you study Acts further. They are independent of Visual Acts, and you need an internet connection to open them.","resources":[["Blue Letter Bible: Acts with Greek word study","https://www.blueletterbible.org/kjv/act/1/1/ss1","Read Acts with Strong’s numbers linked to Greek definitions, plus cross-references and commentaries for every verse."],["Blue Letter Bible: Introduction to Acts","https://www.blueletterbible.org/esv-study-bible/new-testament/introductions/introduction-to-acts.cfm","The ESV Global Study Bible’s introduction, with author, date, themes and an outline of the book."],["Blue Letter Bible: Map of Paul’s first missionary journey","https://www.blueletterbible.org/esv-study-bible/new-testament/maps/pauls-first-missionary-journey.cfm","A map from the ESV Global Study Bible. Maps of the second and third journeys are on the same site."],["Matthew Henry’s Commentary on Acts","https://www.biblegateway.com/resources/matthew-henry/Acts","A classic devotional commentary from the early 1700s, chapter by chapter."],["Enduring Word Commentary on Acts","https://enduringword.com/bible-commentary/acts-1/","David Guzik’s verse-by-verse commentary, with audio teaching on each section."],["BibleProject: Videos on Acts","https://bibleproject.com/videos/acts-1-12/","Two short animated videos on the design and message of Acts, chapters 1–12 and 13–28."],["OpenBible.info: Map of places in Acts","https://www.openbible.info/geo/acts","An interactive map of the places named in Acts, such as Jerusalem, Antioch, Philippi, Athens, Ephesus and Rome."]]},"stats":{"questions":181,"photos":112,"chapters":28}}</script>
<script>
(function () {

  var BOOK = JSON.parse(document.getElementById("book-data").textContent);

  var KEY = "visual-acts.responses.v1";

  var IN_FRAME = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var STANDALONE = window.navigator.standalone === true || (!!window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (STANDALONE) document.documentElement.classList.add("standalone");
  var SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-label="Share"><path d="M8 1.5v8M5 4.5l3-3 3 3M4.5 7H3.5v7h9V7h-1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var store = null;
  try { var t = "__vl"; window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t); store = window.localStorage; } catch (e) { store = null; }
  function readJSON(k) { if (!store) return {}; try { return JSON.parse(store.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
  function writeJSON(k, v) { if (!store) return false; try { store.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  if (store) OLD_KEYS.forEach(function (k) { try { store.removeItem(k); } catch (e) {} });
  var responses = readJSON(KEY);
  var prefs = readJSON(PREF);

  var QUESTIONS = [];
  CH.forEach(function (c) {
    c.sections = [];
    c.questions = [];

      b.domId = "c" + c.num + "-b" + i;
      if (b.type === "h2") c.sections.push({ text: b.text, id: b.domId });
      if (b.type === "q") { var q = { ch: c.num, id: b.id, field: b.field, text: b.text, domId: b.domId }; c.questions.push(q); QUESTIONS.push(q); }
    });
  });
  var MQ = BOOK.master.items;
  var MQFIELDS = [];
  CH.forEach(function (c) {
    c.mq = MQ.map(function (m) { var f = { ch: c.num, key: m[0], label: m[1], text: m[2], field: "mq" + c.num + "-" + m[0], domId: "c" + c.num + "-mq-" + m[0] }; MQFIELDS.push(f); return f; });
  });
  var SUMQ = MQ.map(function (m) { var f = { ch: "summary", key: m[0], label: m[1], text: m[2], field: "mqs-" + m[0], domId: "sum-" + m[0] }; MQFIELDS.push(f); return f; });
  function answered(field) { return !!(responses[field] && responses[field].trim()); }
  function mqAnswered() { return MQFIELDS.filter(function (q) { return answered(q.field); }).length; }
  function answeredIn(c) { return c.questions.filter(function (q) { return answered(q.field); }).length; }
  function totalAnswered() { return QUESTIONS.filter(function (q) { return answered(q.field); }).length; }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function strip(h) { return String(h).replace(/<sup class="v">(\d+)<\/sup>/g, "$1").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
  function img(src, w, h, alt, cls, eager) {
    return '<img src="' + esc(src) + '" width="' + w + '" height="' + h + '" alt="' + esc(alt || "") + '"' +
      (cls ? ' class="' + cls + '"' : "") + (eager ? "" : ' loading="lazy" decoding="async"') + ">";
  }

  /* ---------- chrome ---------- */
  var chapgrid = document.getElementById("chapgrid");
  var chapmenu = document.getElementById("chapmenu");
  ["nav-deeper", "nav-summary"].forEach(function (id) { document.getElementById(id).addEventListener("click", function () { chapmenu.open = false; }); });

    chapgrid.innerHTML = CH.map(function (c) {
      var a = answeredIn(c);
      return '<a href="#acts-' + c.num + '"' + (current === c.num ? ' aria-current="page"' : "") + (a ? ' class="done"' : "") +
        ' title="Acts ' + c.num + (a ? " · " + a + " answered" : "") + '">' + c.num + "</a>";
    }).join("");
  }
  function updateCount() { document.getElementById("resp-count").textContent = totalAnswered() + mqAnswered(); }
  document.addEventListener("click", function (e) {
    if (chapmenu.open && !chapmenu.contains(e.target)) chapmenu.open = false;
  });
  chapgrid.addEventListener("click", function () { chapmenu.open = false; });

  /* ---------- search ---------- */
  var SEARCH = [];
  CH.forEach(function (c) {
    var section = "";
    c.blocks.forEach(function (b) {
      if (b.type === "h2") { section = b.text; SEARCH.push({ ch: c.num, domId: b.domId, kind: "Heading", text: strip(b.text), section: section }); }
      else if (b.type === "p") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.html), section: section });
      else if (b.type === "poem") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.lines.join(" ")), section: section });
      else if (b.type === "q") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Question " + b.id, text: strip(b.text), section: section });
    });
  });
  SEARCH.forEach(function (s) { s.lower = s.text.toLowerCase(); });
  var searchBtn = document.getElementById("search-btn");
  var searchbar = document.getElementById("searchbar");
  var searchInput = document.getElementById("search-input");
  var resultsEl = document.getElementById("results");
  var noteEl = document.getElementById("results-note");
  searchBtn.addEventListener("click", function () {
    var open = searchbar.hidden;
    searchbar.hidden = !open;
    searchBtn.setAttribute("aria-expanded", String(open));
    if (open) searchInput.focus();
  });
  function snippet(text, q) {

      var sel = window.getSelection();
      if (!sel || !sel.rangeCount || sel.isCollapsed) return hlMode.rect || null;
      return sel.getRangeAt(0).getBoundingClientRect();
    }
    return hlMode.el && hlMode.el.isConnected ? hlMode.el.getBoundingClientRect() : null;
  }
  function placeBar() {
    var r = barRect();
    if (!r || r.bottom < 56 || r.top > window.innerHeight) { hlbar.hidden = true; return; }
    hlbar.hidden = false;
    var bw = hlbar.offsetWidth, bh = hlbar.offsetHeight, vw = document.documentElement.clientWidth;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - bw / 2, vw - bw - 8));
    var top = r.bottom + 12;
    if (top + bh > window.innerHeight - 10) top = Math.max(62, r.top - bh - 12);
    hlbar.style.left = Math.round(left) + "px"; hlbar.style.top = Math.round(top) + "px";
  }
  function showBar() {
    var b = '<button type="button" data-hl-color="green"><span class="sw green"></span>Green</button>' +
            '<button type="button" data-hl-color="blue"><span class="sw blue"></span>Blue</button>';
    if (hlMode.kind === "edit") {
      var h = findHL(hlMode.id); if (!h) { hideBar(); return; }
      b = b.replace('data-hl-color="' + h.color + '"', 'data-hl-color="' + h.color + '" aria-pressed="true"') +
        '<span class="sep"></span><button type="button" data-hl-remove>Remove highlight</button>';
    } else if (overlapsAny(hlMode.parts)) {
      b += '<span class="sep"></span><button type="button" data-hl-erase>Clear</button>';
    }
    b = b.replace('data-hl-color="green"', 'data-hl-color="green" aria-label="Highlight in light green"')
         .replace('data-hl-color="blue"', 'data-hl-color="blue" aria-label="Highlight in light blue"');
    hlbar.innerHTML = b;
    placeBar();
  }
  function checkSelection() {
    var parts = selectionParts();
    if (!parts) { if (hlMode && hlMode.kind === "new") hideBar(); return; }
    var sel = window.getSelection();
    hlMode = { kind: "new", parts: parts, rect: sel.getRangeAt(0).getBoundingClientRect() };
    showBar();
  }
  document.addEventListener("selectionchange", function () {
    if (pressing) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(checkSelection, 220);
  });
  hlbar.addEventListener("pointerdown", function (e) { pressing = true; if (e.pointerType === "mouse") e.preventDefault(); });
  hlbar.addEventListener("mousedown", function (e) { e.preventDefault(); });
  document.addEventListener("pointerup", function () { setTimeout(function () { pressing = false; }, 400); }, true);
  document.addEventListener("pointercancel", function () { pressing = false; }, true);
  hlbar.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    pressing = false;
    if (!b || !hlMode) return;
    var mode = hlMode, c = b.getAttribute("data-hl-color");
    if (c) {
      if (mode.kind === "new") { addHL(mode.parts, c); try { window.getSelection().removeAllRanges(); } catch (x) {} }
      else { var h = findHL(mode.id); if (h) { h.color = c; saveHL(); applyHL(); } }
      hideBar();
    } else if (b.hasAttribute("data-hl-remove")) {
      var g = findHL(mode.id); hideBar();
      if (g) removeHL([g], "Highlight removed.");
    } else if (b.hasAttribute("data-hl-erase")) {
      var before = JSON.stringify(HL);
      cutOut(mode.parts); saveHL(); applyHL();
      try { window.getSelection().removeAllRanges(); } catch (x) {}
      hideBar();
      showToast("Highlight cleared from the selected words.", "Undo", function () { HL = JSON.parse(before); saveHL(); refreshView(); }, 7000);
    }
  });
  // tap a highlight to change or remove it; clear buttons in the guide and on My responses
  main.addEventListener("click", function (e) {
    var m = e.target.closest && e.target.closest("mark.hl");
    if (m) {
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      hlMode = { kind: "edit", id: m.getAttribute("data-hl"), el: m };
      showBar();
      return;
    }
    var clr = e.target.closest && e.target.closest("[data-hl-clear]");
    if (clr) {
      var scope = clr.getAttribute("data-hl-clear");
      var list = scope === "chapter" ? hlFor(currentChapter) : HL.slice();
      removeHL(list, plural(list.length, "highlight") + " cleared" + (scope === "chapter" ? " from Acts " + currentChapter : "") + ".");
      return;
    }
    var del = e.target.closest && e.target.closest("[data-hl-del]");
    if (del) { var h = findHL(del.getAttribute("data-hl-del")); if (h) removeHL([h], "Highlight removed."); }
  });
  document.addEventListener("click", function (e) {
    if (hlbar.hidden || !hlMode) return;
    if (hlbar.contains(e.target) || (e.target.closest && e.target.closest("mark.hl"))) return;
    var sel = window.getSelection();
    if (hlMode.kind === "edit" || !sel || sel.isCollapsed) hideBar();
  });
  var barRAF = 0;
  window.addEventListener("scroll", function () {
    if (!hlMode) return;
    if (barRAF) return;
    barRAF = requestAnimationFrame(function () { barRAF = 0; if (hlMode) placeBar(); });
  }, { passive: true });
  window.addEventListener("resize", function () { if (hlMode) placeBar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && hlMode) hideBar(); });

  /* ---------- toast ---------- */
  var toastTimer = null;
  function showToast(text, label, onClick, ms) {
    var t = document.getElementById("toast");
    clearTimeout(toastTimer);
    document.getElementById("toast-text").textContent = text;
    var b = document.getElementById("toast-btn");
    b.textContent = label; b.onclick = function () { clearTimeout(toastTimer); t.hidden = true; onClick(); };
    t.hidden = false;
    if (ms) toastTimer = setTimeout(function () { t.hidden = true; }, ms);
  }

  /* ---------- offline app (service worker) ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !IN_FRAME) {
    var hadController = !!navigator.serviceWorker.controller, updating = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && updating) location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function offer(worker) {
          showToast("A new version of Visual Acts is ready.", "Update", function () { updating = true; worker.postMessage("skipWaiting"); });
        }
        if (reg.waiting && hadController) offer(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
          });
        });
      }).catch(function () {});
      if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
    });
  }

  // home-screen card, continue button (delegated, since views re-render)
  main.addEventListener("click", function (e) {
    if (e.target.closest("#install-dismiss")) {
      prefs.hideInstall = true; writeJSON(PREF, prefs);
      var c = document.getElementById("install-card"); if (c) c.remove();
    }
    if (e.target.closest("#continue-btn")) resume = true;
  });

  // keyboard: [ and ] for previous/next chapter when not typing
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("textarea, input")) return;
    var m = /^#acts-(\d+)$/.exec(location.hash);
    if (!m) return;
    var n = +m[1];
    if (e.key === "]" && n < CH.length) location.hash = "#acts-" + (n + 1);
    if (e.key === "[" && n > 1) location.hash = "#acts-" + (n - 1);
  });

  route();
})();
</script>
<script>/* brand-fit */(function () { var b = document.querySelector(".brand"); if (!b) return;
  function fit() { b.classList.remove("fit1", "fit2", "fit3"); b.parentNode.classList.remove("tight"); if (b.scrollWidth > b.clientWidth + 1) { b.classList.add("fit1"); if (b.scrollWidth > b.clientWidth + 1) { b.classList.add("fit2"); if (b.scrollWidth > b.clientWidth + 1) { b.parentNode.classList.add("tight"); if (b.scrollWidth > b.clientWidth + 1) b.classList.add("fit3"); } } } }
  fit(); addEventListener("resize", fit); addEventListener("hashchange", function () { setTimeout(fit, 0); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  var bb = document.getElementById("back-btn"); if (bb && window.MutationObserver) new MutationObserver(fit).observe(bb, { attributes: true, attributeFilter: ["hidden"] });
})();</script>
</body>
</html>
