<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Acts</title>
<meta name="description" content="Acts (World English Bible) with photographs and reflection questions.">
<meta name="theme-color" content="#F7F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111517" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visual Acts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a book you read online. One reading column (~66ch) beside a sticky chapter guide; photos run the full column; reflection panels sit in the flow where the book put them. */
  --paper: #F7F8F6;
  --surface: #FFFFFF;
  --ink: #15191C;
  --muted: #5A646A;
  --line: #D9DFDD;
  --teal: #0F6B70;
  --teal-soft: #E3EFEE;
  --panel: #EDF1EF;
  --mark: #FBE38E;
  --mark-ink: #15191C;
  --hl-green: #D4F3C8;
  --hl-blue: #CDE5FA;
  --band: rgba(9, 15, 17, 0.58);
  --display: "Libre Franklin", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.5rem, 6vw, 3.75rem);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111517;
    --surface: #171C1E;
    --ink: #E5E9E7;
    --muted: #9CA7AB;
    --line: #2B3336;
    --teal: #63BFC2;
    --teal-soft: #17292B;
    --panel: #1A2123;
    --mark: #6B5A1F;
    --mark-ink: #FFF6D6;
    --hl-green: rgba(118, 196, 104, 0.34);
    --hl-blue: rgba(104, 160, 232, 0.38);
    --band: rgba(5, 8, 9, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111517;
  --surface: #171C1E;
  --ink: #E5E9E7;
  --muted: #9CA7AB;
  --line: #2B3336;
  --teal: #63BFC2;
  --teal-soft: #17292B;
  --panel: #1A2123;
  --mark: #6B5A1F;
  --mark-ink: #FFF6D6;
  --hl-green: rgba(118, 196, 104, 0.34);
  --hl-blue: rgba(104, 160, 232, 0.38);
  --band: rgba(5, 8, 9, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-1);
  line-height: 1.65;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--teal); text-underline-offset: 0.18em; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font-family: var(--display);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand {
  font-weight: 700; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; white-space: nowrap; margin-right: auto;
}
.brand span { color: var(--teal); }
.navbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 6px 10px; font-size: var(--step--1); font-weight: 500; color: var(--ink);
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.navbtn:hover { background: var(--teal-soft); }
.navbtn[aria-current="page"] { border-color: var(--line); background: var(--surface); }
.count {
  font-variant-numeric: tabular-nums; font-size: 0.75rem; font-weight: 600;
  background: var(--teal); color: var(--paper); border-radius: 999px; padding: 1px 7px; min-width: 1.6em; text-align: center;
}
.chapmenu { position: relative; }
.chapmenu > summary { list-style: none; }
.chapmenu > summary::-webkit-details-marker { display: none; }
.chapmenu-panel {
  position: absolute; right: 0; top: calc(100% + 8px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  padding: 14px; width: 300px;
}
.chapmenu-panel p { margin: 0 0 8px; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.chapgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.chapgrid a {
  display: grid; place-items: center; aspect-ratio: 1; border-radius: 6px;
  text-decoration: none; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); font-size: 0.95rem;
}
.chapgrid a:hover { border-color: var(--teal); color: var(--teal); }
.chapgrid a.done { background: var(--teal-soft); }
.chapgrid a[aria-current="page"] { background: var(--teal); color: var(--paper); border-color: var(--teal); }

.searchbar { border-top: 1px solid var(--line); }
.searchbar[hidden] { display: none; }
.searchbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px 16px; }
.searchbar input {
  width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--display); font-size: 1rem;
}
.results { list-style: none; margin: 10px 0 0; padding: 0; max-height: 55vh; overflow-y: auto; }
.results li + li { border-top: 1px solid var(--line); }
.results button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer;
  font-family: var(--body); font-size: 1rem; line-height: 1.45;
}
.results button:hover { background: var(--teal-soft); }
.results .ref { font-family: var(--display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); display: block; }
.results b { background: var(--mark); color: var(--mark-ink); font-weight: inherit; }
.results-note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 10px 0 0; }

/* ---------- shared layout ---------- */
main { min-height: 70vh; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.eyebrow { font-family: var(--display); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--teal); margin: 0 0 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 600; font-size: 0.95rem;
  padding: 11px 18px; border-radius: 6px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--teal); background: var(--teal); color: var(--paper);
}
.btn.ghost { background: transparent; color: var(--teal); }
.btn:hover { filter: brightness(1.08); }

/* ---------- home ---------- */
.cover {
  display: grid; grid-template-columns: minmax(200px, 330px) 1fr; gap: clamp(28px, 5vw, 64px);
  align-items: center; padding: clamp(32px, 6vw, 72px) 0 clamp(32px, 5vw, 56px);
}
.cover-img { border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.cover h1 { font-size: var(--step-4); letter-spacing: -0.02em; font-weight: 700; }
.cover .lede { font-size: var(--step-1); color: var(--muted); max-width: 34em; margin: 14px 0 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 26px; padding: 0; list-style: none; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.stats strong { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 1.05rem; margin-right: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.progress-line { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 16px 0 0; }

.welcome {
  display: grid; grid-template-columns: 1fr minmax(240px, 380px); gap: clamp(28px, 5vw, 64px);
  padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line);
}
.welcome h2 { font-size: var(--step-3); margin-bottom: 14px; }
.welcome p { margin: 0 0 1em; max-width: 36em; }
.strips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-self: start; }
.strips img { width: 100%; aspect-ratio: 143 / 374; object-fit: cover; border-radius: 3px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.section-head h2 { font-size: var(--step-3); }
.section-head p { margin: 0; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.chapters { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--teal); transform: translateY(-2px); }
.card-img { position: relative; aspect-ratio: 16 / 10; background: #222; overflow: hidden; }
.card-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card-num {
  position: absolute; left: 0; bottom: 0; padding: 6px 12px 4px; background: var(--band); color: #fff;
  font-family: var(--display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em;
  display: flex; align-items: baseline; gap: 8px;
}
.card-num b { font-family: var(--body); font-weight: 400; font-size: 1.9rem; letter-spacing: 0; line-height: 1; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-body ul { list-style: none; margin: 0; padding: 0; font-family: var(--display); font-size: 0.85rem; line-height: 1.4; color: var(--muted); }
.card-body li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body li:first-child { color: var(--ink); font-weight: 600; white-space: normal; }
.card-meta { margin-top: auto; display: flex; gap: 8px; align-items: center; font-family: var(--display); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); }
.pill.on { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

.feature { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 0 clamp(32px, 5vw, 56px); }
.feature a.tile {
  display: block; padding: 22px 24px; border-radius: 8px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); background: var(--panel);
}
.feature a.tile:hover { border-color: var(--teal); }
.feature h3 { font-size: var(--step-2); margin-bottom: 6px; }
.feature p { margin: 0; color: var(--muted); font-size: 1rem; }

.about { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr minmax(220px, 300px); gap: clamp(28px, 5vw, 64px); }
.about h2 { font-size: var(--step-2); margin-bottom: 4px; }
.about h3 { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
.about p { margin: 0 0 0.8em; font-size: 1.05rem; max-width: 40em; }
.about-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-self: start; }
.about-imgs img { width: 100%; aspect-ratio: 143 / 486; object-fit: cover; border-radius: 3px; }

/* ---------- chapter ---------- */
.hero { position: relative; margin: 24px 0 0; border-radius: 6px; overflow: hidden; background: #1d2326; }
.hero img { width: 100%; max-height: min(64vh, 600px); object-fit: cover; }
.band {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--band); color: #fff;
  padding: 14px clamp(18px, 3vw, 32px) 12px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
}
.band-title { display: flex; flex-direction: column; }
.band .lk { font-family: var(--display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.42em; }
.band .num { font-family: var(--body); font-size: clamp(4rem, 11vw, 7rem); line-height: 0.82; font-weight: 400; }
.band .meta { font-family: var(--display); font-size: 0.8rem; text-align: right; opacity: 0.92; line-height: 1.5; }

.chapter-grid {
  display: grid; grid-template-columns: 230px minmax(0, 700px); gap: clamp(28px, 5vw, 72px);
  justify-content: center; padding: 36px 0 24px;
}
.guide { position: sticky; top: 76px; align-self: start; font-family: var(--display); font-size: 0.9rem; max-height: calc(100vh - 96px); overflow-y: auto; }
.guide h2 { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.guide ol { list-style: none; margin: 0 0 22px; padding: 0; border-left: 2px solid var(--line); }
.guide li button {
  display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 5px 0 5px 12px; margin-left: -2px; border-left: 2px solid transparent; line-height: 1.35; color: var(--muted);
}
.guide li button:hover { color: var(--ink); }
.guide li button.active { color: var(--ink); border-left-color: var(--teal); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0 0 12px; color: var(--ink); }
.toggle input { width: 18px; height: 18px; accent-color: var(--teal); }
.guide .tally { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.guide-mobile { display: none; }

.reader h2 {
  font-size: 1.3rem; font-weight: 700; margin: 2.2em 0 0.7em; scroll-margin-top: 90px;
}
.reader > :first-child { margin-top: 0; }
.reader p { margin: 0 0 1em; max-width: 66ch; }
.reader p, .reader .poem { scroll-margin-top: 90px; }
sup.v {
  font-family: var(--display); font-weight: 700; font-size: 0.6em; color: var(--teal);
  line-height: 0; vertical-align: 0.6em; margin-right: 0.12em; font-variant-numeric: tabular-nums;
}
.poem { margin: 0 0 1.1em; padding-left: 1.6em; border-left: 2px solid var(--teal-soft); }
.poem .l { display: block; padding-left: 1.2em; text-indent: -1.2em; }
.photo { margin: 1.6em 0; }
.photo img { width: 100%; border-radius: 4px; }
.photo.portrait img { max-height: 760px; width: auto; max-width: 100%; margin: 0 auto; }

.q {
  background: var(--panel); border-left: 3px solid var(--teal); border-radius: 0 6px 6px 0;
  padding: 18px 20px 16px; margin: 1.4em 0; font-family: var(--display); scroll-margin-top: 90px;
}
.q + .q { margin-top: -0.6em; }
.q-num { font-family: var(--display); font-size: 0.78rem; font-weight: 700; color: var(--teal); letter-spacing: 0.06em; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.q-text { font-size: 1rem; line-height: 1.5; margin: 0 0 12px; }
.q-text b { color: var(--teal); font-family: var(--display); font-weight: 700; }
.q textarea {
  display: block; width: 100%; min-height: 96px; resize: vertical;
  padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--body); font-size: 1.05rem; line-height: 1.55;
}
.q textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
.q-status { min-height: 1.2em; margin: 6px 0 0; font-size: 0.75rem; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 28px 0 56px; border-top: 1px solid var(--line); margin-top: 24px; }
.pager a {
  display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink);
  font-family: var(--display); background: var(--surface);
}
.pager a:hover { border-color: var(--teal); }
.pager small { display: block; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.pager strong { font-size: 1.05rem; }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- responses / discussion pages ---------- */
.page { max-width: 820px; margin: 0 auto; padding: clamp(32px, 6vw, 64px) 20px 64px; }
.page h1 { font-size: var(--step-3); margin-bottom: 10px; }
.page .lede { color: var(--muted); margin: 0 0 24px; font-size: 1.05rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 28px; }
.toolbar .note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.group { margin: 0 0 34px; }
.group h2 { font-size: 1.15rem; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.group h2 a { font-size: 0.85rem; font-weight: 500; }
.answer { margin: 0 0 20px; }
.answer .q-num { margin-bottom: 2px; }
.answer .q-text { margin-bottom: 8px; color: var(--muted); font-family: var(--display); font-size: 0.95rem; }
.answer .text { white-space: pre-wrap; margin: 0; padding-left: 14px; border-left: 3px solid var(--teal); }
.answer button.link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font-family: var(--display); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 0.18em; margin-top: 6px; }
.empty { font-family: var(--display); color: var(--muted); padding: 22px; border: 1px dashed var(--line); border-radius: 8px; }
.copybox { margin: 0 0 24px; }
.copybox[hidden] { display: none; }
.copybox textarea { width: 100%; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--display); font-size: 0.9rem; }

.types { list-style: none; counter-reset: t; padding: 0; margin: 0; display: grid; gap: 16px; }
.types > li { counter-increment: t; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px 64px; position: relative; }
.types > li::before {
  content: counter(t); position: absolute; left: 18px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--teal); color: var(--paper);
  font-family: var(--display); font-weight: 700; font-size: 0.95rem;
}
.types h2 { font-size: 1.1rem; margin: 4px 0 8px; }
.types h2 span { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.types ol { margin: 0; padding-left: 1.3em; list-style: lower-alpha; font-size: 1.02rem; }
.types ol li { margin: 0 0 6px; }

/* ---------- opening prayer ---------- */
.prayer { margin: 0 0 2em; padding: 16px 22px 16px 20px; max-width: 66ch; background: rgba(200, 150, 62, 0.11);
  border-left: 4px solid #C8963E; border-radius: 0 8px 8px 0; }
.reader .prayer p { margin: 0; max-width: none; }
.reader .prayer .prayer-label { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em;
  text-transform: uppercase; color: #9A6B1E; margin: 0 0 6px; }
.reader .prayer .prayer-text { font-style: italic; font-size: 1.06rem; line-height: 1.6; }
:root[data-theme="dark"] .reader .prayer .prayer-label { color: #E2B866; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .reader .prayer .prayer-label { color: #E2B866; } }
@media print { .prayer { background: none; } }

/* ---------- master questions and summary ---------- */
.mq-box { margin: 1.4em 0 1.6em; padding: 18px 20px 6px; border: 1px solid var(--line); border-top: 3px solid var(--teal); border-radius: 0 0 8px 8px; background: var(--panel); max-width: 40em; }
.mq-box h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 8px; color: var(--teal); letter-spacing: 0.02em; }
.welcome .mq-box p, .mq-box p { margin: 0 0 12px; font-size: 0.97rem; font-family: var(--display); max-width: none; line-height: 1.5; }
.mq-list { margin: 0 0 12px; padding: 0; list-style: none; }
.mq-list li { margin: 0 0 10px; font-family: var(--display); font-size: 0.97rem; line-height: 1.5; }
.mq-list b, .mq-q .q-text b, .sm-q b { color: var(--teal); font-weight: 700; letter-spacing: 0.04em; }
.mq { margin: 2.4em 0 0.4em; padding-top: 1.2em; border-top: 2px solid var(--teal); }

<script type="application/json" id="book-data">{"cover":{"src":"img/cover.jpg","w":850,"h":1280,"alt":"A palm-lined Mediterranean road"},"coverAlt":"A palm-lined Mediterranean road","welcome":["Acts continues the story Luke began in his Gospel. Jesus promised his followers, “you will receive power when the Holy Spirit has come upon you. You will be witnesses to me in Jerusalem, in all Judea and Samaria, and to the uttermost parts of the earth.” Acts tells how that promise came true, as ordinary people filled with the Spirit carried the good news from Jerusalem to Rome.","Visual Acts sets the full text of Acts, in the World English Bible, beside photographs and questions for reflection. The photographs are not pictures of Bible scenes. They are images from everyday life, chosen to help you connect your own story with the story of the early church.","As you read, take time with each image. Notice what you see and what you feel. The questions are marked HEAD, HEART and ACTION. Head questions help you understand what the passage says. Heart questions invite you to notice your feelings and attitudes before God. Action questions ask what you will do in response. Use them on your own, with a friend or in a group. The goal is to link LIFE and SCRIPTURE through IMAGES.","You can write your responses right on the page, in the boxes beneath each question, and highlight words in the text that speak to you.","At the end of the book, after Acts 28, you will find two more sections. The Summary reviews the Master Questions for the whole book of Acts, with boxes for your responses. Going Deeper is a short study guide with an overview of the author and the book, historical and cultural insights, a chart of the whole book, its major themes and emotions, and free online resources such as Blue Letter Bible, commentaries and maps."],"strips":[{"src":"img/welcome-1.jpg","w":853,"h":1280,"alt":"An old map of the Mediterranean"},{"src":"img/welcome-2.jpg","w":1002,"h":1280,"alt":"Flames of fire"},{"src":"img/welcome-3.jpg","w":853,"h":1280,"alt":"A path along a green ridge"}],"chapters":[{"num":1,"hero":{"src":"img/acts01-hero.jpg","w":1100,"h":733,"alt":"Rays of light streaming through clouds"},"blocks":[{"type":"h2","text":"The Promise of the Holy Spirit"},{"type":"p","html":"<sup class=\"v\">1<\/sup> The first book I wrote, Theophilus, concerned all that Jesus began both to do and to teach, <sup class=\"v\">2<\/sup> until the day in which he was received up, after he had given commandment through the Holy Spirit to the apostles whom he had chosen. <sup class=\"v\">3<\/sup> To these he also showed himself alive after he suffered, by many proofs, appearing to them over a period of forty days, and speaking about God’s Kingdom. <sup class=\"v\">4<\/sup> Being assembled together with them, he commanded them, “Don’t depart from Jerusalem, but wait for the promise of the Father, which you heard from me. <sup class=\"v\">5<\/sup> For John indeed baptized in water, but you will be baptized in the Holy Spirit not many days from now.”"},{"type":"q","id":"1.1","field":"q1","text":"<b>Head:<\/b> Jesus told his followers, “you will be baptized in the Holy Spirit not many days from now” (v. 5). Why do you think they needed the Holy Spirit before they began their work?"},{"type":"h2","text":"Jesus Is Taken Up into Heaven"},{"type":"p","html":"<sup class=\"v\">6<\/sup> Therefore when they had come together, they asked him, “Lord, are you now restoring the kingdom to Israel?”"},{"type":"img","src":"img/acts01-v07.jpg","w":1100,"h":1100,"alt":"The earth seen from space"},{"type":"p","html":"<sup class=\"v\">7<\/sup> He said to them, “It isn’t for you to know times or seasons which the Father has set within his own authority. <sup class=\"v\">8<\/sup> But you will receive power when the Holy Spirit has come upon you. You will be witnesses to me in Jerusalem, in all Judea and Samaria, and to the uttermost parts of the earth.”"},{"type":"q","id":"1.2","field":"q2","text":"<b>Head:<\/b> Look at the image that opens this chapter. Luke begins Acts by remembering “all that Jesus began both to do and to teach” (v. 1). What do you think Jesus continues to do through his followers today?"},{"type":"q","id":"1.3","field":"q3","text":"<b>Action:<\/b> Consider the image of the globe. Jesus said, “You will be witnesses to me in Jerusalem, in all Judea and Samaria, and to the uttermost parts of the earth” (v. 8). Where is your “Jerusalem,” the place where your witness begins? What will you do there this week?"},{"type":"img","src":"img/acts01-v09.jpg","w":1100,"h":619,"alt":"Looking up at the sky between buildings"},{"type":"p","html":"<sup class=\"v\">9<\/sup> When he had said these things, as they were looking, he was taken up, and a cloud received him out of their sight. <sup class=\"v\">10<\/sup> While they were looking steadfastly into the sky as he went, behold, two men stood by them in white clothing, <sup class=\"v\">11<\/sup> who also said, “You men of Galilee, why do you stand looking into the sky? This Jesus, who was received up from you into the sky, will come back in the same way as you saw him going into the sky.”"},{"type":"q","id":"1.4","field":"q4","text":"<b>Heart:<\/b> Look at the image of the sky. The angels asked, “why do you stand looking into the sky?” (v. 11). When have you been so caught up in wonder that you were slow to act? What helps you move from wonder to action?"},{"type":"h2","text":"Matthias Is Chosen"},{"type":"img","src":"img/acts01-v12.jpg","w":1100,"h":730,"alt":"A group of people praying together"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Then they returned to Jerusalem from the mountain called Olivet, which is near Jerusalem, a Sabbath day’s journey away. <sup class=\"v\">13<\/sup> When they had come in, they went up into the upper room where they were staying; that is Peter, John, James, Andrew, Philip, Thomas, Bartholomew, Matthew, James the son of Alphaeus, Simon the Zealot, and Judas the son of James. <sup class=\"v\">14<\/sup> All these with one accord continued steadfastly in prayer and supplication, along with the women, and Mary the mother of Jesus, and with his brothers."},{"type":"q","id":"1.5","field":"q5","text":"<b>Action:<\/b> Consider the image of the group praying. “All these with one accord continued steadfastly in prayer” (v. 14). What happens when believers pray together? With whom could you pray this week?"},{"type":"p","html":"<sup class=\"v\">15<\/sup> In these days, Peter stood up in the middle of the disciples (and the number of names was about one hundred twenty), and said, <sup class=\"v\">16<\/sup> “Brothers, it was necessary that this Scripture should be fulfilled, which the Holy Spirit spoke before by the mouth of David concerning Judas, who was guide to those who took Jesus. <sup class=\"v\">17<\/sup> For he was counted with us, and received his portion in this ministry. <sup class=\"v\">18<\/sup> Now this man obtained a field with the reward for his wickedness, and falling headlong, his body burst open, and all his intestines gushed out. <sup class=\"v\">19<\/sup> It became known to everyone who lived in Jerusalem that in their language that field was called ‘Akeldama,’ that is, ‘The field of blood.’ <sup class=\"v\">20<\/sup> For it is written in the book of Psalms,"},{"type":"poem","lines":["‘Let his habitation be made desolate.","Let no one dwell in it;’"]},{"type":"p","html":"and,"},{"type":"poem","lines":["‘Let another take his office.’"]},{"type":"p","html":"<sup class=\"v\">21<\/sup> “Of the men therefore who have accompanied us all the time that the Lord Jesus went in and out among us, <sup class=\"v\">22<\/sup> beginning from the baptism of John, to the day that he was received up from us, of these one must become a witness with us of his resurrection.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> They put forward two, Joseph called Barsabbas, who was also called Justus, and Matthias. <sup class=\"v\">24<\/sup> They prayed and said, “You, Lord, who know the hearts of all men, show which one of these two you have chosen <sup class=\"v\">25<\/sup> to take part in this ministry and apostleship from which Judas fell away, that he might go to his own place.” <sup class=\"v\">26<\/sup> They drew lots for them, and the lot fell on Matthias, and he was counted with the eleven apostles."},{"type":"q","id":"1.6","field":"q6","text":"<b>Heart:<\/b> Before choosing a new apostle, they prayed, “You, Lord, who know the hearts of all men, show which one of these two you have chosen” (v. 24). How do you seek God’s guidance in big decisions?"},{"type":"q","id":"1.7","field":"q7","text":"<b>Heart:<\/b> Which image in this chapter helps you think about your own calling? Why?"}],"prayer":"God, your Son promised, “you will receive power when the Holy Spirit has come upon you” (1:8). Give me wisdom as I read, and help me be a witness to Jesus where you have placed me."},{"num":2,"hero":{"src":"img/acts02-hero.jpg","w":1100,"h":733,"alt":"A row of candle flames in the dark"},"blocks":[{"type":"h2","text":"The Holy Spirit Comes at Pentecost"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now when the day of Pentecost had come, they were all with one accord in one place. <sup class=\"v\">2<\/sup> Suddenly there came from the sky a sound like the rushing of a mighty wind, and it filled all the house where they were sitting. <sup class=\"v\">3<\/sup> Tongues like fire appeared and were distributed to them, and one sat on each of them. <sup class=\"v\">4<\/sup> They were all filled with the Holy Spirit, and began to speak with other languages, as the Spirit gave them the ability to speak."},{"type":"q","id":"2.1","field":"q8","text":"<b>Head:<\/b> Look at the image that opens this chapter. “Tongues like fire” appeared and “they were all filled with the Holy Spirit” (v. 3-4). What do you think the fire tells us about the Holy Spirit?"},{"type":"img","src":"img/acts02-v05.jpg","w":1100,"h":733,"alt":"Flags of many nations flying in a row"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Now there were dwelling in Jerusalem Jews, devout men, from every nation under the sky. <sup class=\"v\">6<\/sup> When this sound was heard, the multitude came together and were bewildered, because everyone heard them speaking in his own language. <sup class=\"v\">7<\/sup> They were all amazed and marveled, saying to one another, “Behold, aren’t all these who speak Galileans? <sup class=\"v\">8<\/sup> How do we hear, everyone in our own native language? <sup class=\"v\">9<\/sup> Parthians, Medes, Elamites, and people from Mesopotamia, Judea, Cappadocia, Pontus, Asia, <sup class=\"v\">10<\/sup> Phrygia, Pamphylia, Egypt, the parts of Libya around Cyrene, visitors from Rome, both Jews and proselytes, <sup class=\"v\">11<\/sup> Cretans and Arabians: we hear them speaking in our languages the mighty works of God!” <sup class=\"v\">12<\/sup> They were all amazed, and were perplexed, saying to one another, “What does this mean?” <sup class=\"v\">13<\/sup> Others, mocking, said, “They are filled with new wine.”"},{"type":"q","id":"2.2","field":"q9","text":"<b>Head:<\/b> Consider the image of the flags of many nations. People from many nations heard the good news, each “in our own native language” (v. 8). What does this tell you about God’s heart for every people?"},{"type":"q","id":"2.3","field":"q10","text":"<b>Head:<\/b> Some were amazed, and others mocked (v. 12-13). How do people respond to God’s work today?"},{"type":"h2","text":"Peter Speaks to the Crowd"},{"type":"p","html":"<sup class=\"v\">14<\/sup> But Peter, standing up with the eleven, lifted up his voice, and spoke out to them, “You men of Judea, and all you who dwell at Jerusalem, let this be known to you, and listen to my words. <sup class=\"v\">15<\/sup> For these aren’t drunken, as you suppose, seeing it is only the third hour of the day. <sup class=\"v\">16<\/sup> But this is what has been spoken through the prophet Joel:"},{"type":"poem","lines":[" <sup class=\"v\">17<\/sup> ‘It will be in the last days, says God,","that I will pour out my Spirit on all flesh.","Your sons and your daughters will prophesy.","Your young men will see visions.","Your old men will dream dreams.","<sup class=\"v\">18<\/sup> Yes, and on my servants and on my handmaidens in those days,","I will pour out my Spirit, and they will prophesy.","<sup class=\"v\">19<\/sup> I will show wonders in the sky above,","and signs on the earth beneath:","blood, and fire, and billows of smoke.","<sup class=\"v\">20<\/sup> The sun will be turned into darkness,","and the moon into blood,","before the great and glorious day of the Lord comes.","<sup class=\"v\">21<\/sup> It will be that whoever will call on the name of the Lord will be saved.’"]},{"type":"p","html":"<sup class=\"v\">22<\/sup> “Men of Israel, hear these words! Jesus of Nazareth, a man approved by God to you by mighty works and wonders and signs which God did by him among you, even as you yourselves know, <sup class=\"v\">23<\/sup> him, being delivered up by the determined counsel and foreknowledge of God, you have taken by the hand of lawless men, crucified and killed; <sup class=\"v\">24<\/sup> whom God raised up, having freed him from the agony of death, because it was not possible that he should be held by it. <sup class=\"v\">25<\/sup> For David says concerning him,"},{"type":"poem","lines":["‘I saw the Lord always before my face,","for he is on my right hand, that I should not be moved.","<sup class=\"v\">26<\/sup> Therefore my heart was glad, and my tongue rejoiced.","Moreover my flesh also will dwell in hope;","<sup class=\"v\">27<\/sup> because you will not leave my soul in Hades,","neither will you allow your Holy One to see decay.","<sup class=\"v\">28<\/sup> You made known to me the ways of life.","You will make me full of gladness with your presence.’"]},{"type":"p","html":"<sup class=\"v\">29<\/sup> “Brothers, I may tell you freely of the patriarch David, that he both died and was buried, and his tomb is with us to this day. <sup class=\"v\">30<\/sup> Therefore, being a prophet, and knowing that God had sworn with an oath to him that of the fruit of his body, according to the flesh, he would raise up the Christ to sit on his throne, <sup class=\"v\">31<\/sup> he foreseeing this spoke about the resurrection of the Christ, that his soul wasn’t left in Hades, and his flesh didn’t see decay. <sup class=\"v\">32<\/sup> This Jesus God raised up, to which we all are witnesses. <sup class=\"v\">33<\/sup> Being therefore exalted by the right hand of God, and having received from the Father the promise of the Holy Spirit, he has poured out this, which you now see and hear. <sup class=\"v\">34<\/sup> For David didn’t ascend into the heavens, but he says himself,"},{"type":"poem","lines":["‘The Lord said to my Lord, “Sit by my right hand","<sup class=\"v\">35<\/sup> until I make your enemies a footstool for your feet.” ’"]},{"type":"p","html":"<sup class=\"v\">36<\/sup> “Let all the house of Israel therefore know certainly that God has made him both Lord and Christ, this Jesus whom you crucified.”"},{"type":"q","id":"2.4","field":"q11","text":"<b>Action:<\/b> Peter said, “whoever will call on the name of the Lord will be saved” (v. 21). Who is included in this promise? Who do you know who needs to hear it?"},{"type":"h2","text":"Three Thousand Believe"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Now when they heard this, they were cut to the heart, and said to Peter and the rest of the apostles, “Brothers, what shall we do?”"},{"type":"img","src":"img/acts02-v38.jpg","w":1100,"h":825,"alt":"A baptism in a river"},{"type":"p","html":"<sup class=\"v\">38<\/sup> Peter said to them, “Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins, and you will receive the gift of the Holy Spirit. <sup class=\"v\">39<\/sup> For the promise is to you, and to your children, and to all who are far off, even as many as the Lord our God will call to himself.” <sup class=\"v\">40<\/sup> With many other words he testified, and exhorted them, saying, “Save yourselves from this crooked generation!”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Then those who gladly received his word were baptized. There were added that day about three thousand souls."},{"type":"q","id":"2.5","field":"q12","text":"<b>Heart:<\/b> Look at the image of the water. Peter said, “Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins” (v. 38). What does it mean to you to be forgiven and given a new start?"},{"type":"h2","text":"The Life of the Believers"},{"type":"p","html":"<sup class=\"v\">42<\/sup> They continued steadfastly in the apostles’ teaching and fellowship, in the breaking of bread, and prayer. <sup class=\"v\">43<\/sup> Fear came on every soul, and many wonders and signs were done through the apostles. <sup class=\"v\">44<\/sup> All who believed were together, and had all things in common. <sup class=\"v\">45<\/sup> They sold their possessions and goods, and distributed them to all, according as anyone had need."},{"type":"img","src":"img/acts02-v46.jpg","w":1100,"h":619,"alt":"People sharing a meal at a table"},{"type":"p","html":"<sup class=\"v\">46<\/sup> Day by day, continuing steadfastly with one accord in the temple, and breaking bread at home, they took their food with gladness and singleness of heart, <sup class=\"v\">47<\/sup> praising God, and having favor with all the people. The Lord added to the assembly day by day those who were being saved."},{"type":"q","id":"2.6","field":"q13","text":"<b>Action:<\/b> Consider the image of the shared meal. “They continued steadfastly in the apostles’ teaching and fellowship, in the breaking of bread, and prayer” (v. 42). Which of these four is strongest in your life? Which needs to grow? What step will you take this week?"},{"type":"q","id":"2.7","field":"q14","text":"<b>Heart:<\/b> The believers ate together “with gladness and singleness of heart” (v. 46). What makes a community of faith attractive to others? When have you felt that kind of gladness among believers?"}],"prayer":"Father in heaven, you poured out your Spirit, and you added to your people “day by day” (2:47). Give me wisdom as I read, and help me continue steadfastly in teaching, fellowship, the breaking of bread and prayer (2:42)."},{"num":3,"hero":{"src":"img/acts03-hero.jpg","w":1100,"h":743,"alt":"An ornate old stone gateway"},"blocks":[{"type":"h2","text":"A Lame Man Is Healed"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Peter and John were going up into the temple at the hour of prayer, the ninth hour. <sup class=\"v\">2<\/sup> A certain man who was lame from his mother’s womb was being carried, whom they laid daily at the door of the temple which is called Beautiful, to ask gifts for the needy of those who entered into the temple. <sup class=\"v\">3<\/sup> Seeing Peter and John about to go into the temple, he asked to receive gifts for the needy. <sup class=\"v\">4<\/sup> Peter, fastening his eyes on him, with John, said, “Look at us.” <sup class=\"v\">5<\/sup> He listened to them, expecting to receive something from them."},{"type":"q","id":"3.1","field":"q15","text":"<b>Action:<\/b> Look at the image that opens this chapter. A man who had been lame from birth was carried daily to the temple gate called Beautiful to beg (v. 2). Who sits at the “gates” of your community hoping for help? How could you help them this week?"},{"type":"img","src":"img/acts03-v06.jpg","w":1100,"h":733,"alt":"A man showing empty pockets"},{"type":"p","html":"<sup class=\"v\">6<\/sup> But Peter said, “I have no silver or gold, but what I have, that I give you. In the name of Jesus Christ of Nazareth, get up and walk!” <sup class=\"v\">7<\/sup> He took him by the right hand and raised him up. Immediately his feet and his ankle bones received strength."},{"type":"img","src":"img/acts03-v08.jpg","w":1100,"h":733,"alt":"A man leaping for joy on a desert road"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Leaping up, he stood and began to walk. He entered with them into the temple, walking, leaping, and praising God. <sup class=\"v\">9<\/sup> All the people saw him walking and praising God. <sup class=\"v\">10<\/sup> They recognized him, that it was he who used to sit begging for gifts for the needy at the Beautiful Gate of the temple. They were filled with wonder and amazement at what had happened to him."},{"type":"q","id":"3.2","field":"q16","text":"<b>Action:<\/b> Consider the image of the empty pockets. Peter said, “I have no silver or gold, but what I have, that I give you” (v. 6). What do you have to give that is worth more than money? To whom will you give it this week?"},{"type":"q","id":"3.3","field":"q17","text":"<b>Heart:<\/b> Look at the image of the man leaping. The man went into the temple “walking, leaping, and praising God” (v. 8). When has God given you a reason to leap for joy?"},{"type":"h2","text":"Peter Speaks in Solomon’s Porch"},{"type":"p","html":"<sup class=\"v\">11<\/sup> As the lame man who was healed held on to Peter and John, all the people ran together to them in the porch that is called Solomon’s, greatly wondering."},{"type":"p","html":"<sup class=\"v\">12<\/sup> When Peter saw it, he responded to the people, “You men of Israel, why do you marvel at this man? Why do you fasten your eyes on us, as though by our own power or godliness we had made him walk? <sup class=\"v\">13<\/sup> The God of Abraham, Isaac, and Jacob, the God of our fathers, has glorified his Servant Jesus, whom you delivered up, and denied in the presence of Pilate, when he had determined to release him. <sup class=\"v\">14<\/sup> But you denied the Holy and Righteous One and asked for a murderer to be granted to you, <sup class=\"v\">15<\/sup> and killed the Prince of life, whom God raised from the dead, to which we are witnesses. <sup class=\"v\">16<\/sup> By faith in his name, his name has made this man strong, whom you see and know. Yes, the faith which is through him has given him this perfect soundness in the presence of you all."},{"type":"q","id":"3.4","field":"q18","text":"<b>Head:<\/b> Peter said it was faith in Jesus’ name that made the man strong (v. 16). Why did Peter refuse to take credit for the healing?"},{"type":"p","html":"<sup class=\"v\">17<\/sup> “Now, brothers, I know that you did this in ignorance, as did also your rulers. <sup class=\"v\">18<\/sup> But the things which God announced by the mouth of all his prophets, that Christ should suffer, he thus fulfilled."},{"type":"img","src":"img/acts03-v19.jpg","w":1100,"h":733,"alt":"Morning dew on fresh grass"},{"type":"p","html":"<sup class=\"v\">19<\/sup> “Repent therefore, and turn again, that your sins may be blotted out, so that there may come times of refreshing from the presence of the Lord, <sup class=\"v\">20<\/sup> and that he may send Christ Jesus, who was ordained for you before, <sup class=\"v\">21<\/sup> whom heaven must receive until the times of restoration of all things, which God spoke long ago by the mouth of his holy prophets. <sup class=\"v\">22<\/sup> For Moses indeed said to the fathers, ‘The Lord God will raise up a prophet for you from among your brothers, like me. You shall listen to him in all things whatever he says to you. <sup class=\"v\">23<\/sup> It will be that every soul that will not listen to that prophet will be utterly destroyed from among the people.’ <sup class=\"v\">24<\/sup> Yes, and all the prophets from Samuel and those who followed after, as many as have spoken, they also told of these days. <sup class=\"v\">25<\/sup> You are the children of the prophets, and of the covenant which God made with our fathers, saying to Abraham, ‘All the families of the earth will be blessed through your offspring.’ <sup class=\"v\">26<\/sup> God, having raised up his servant Jesus, sent him to you first to bless you, in turning away every one of you from your wickedness.”"},{"type":"q","id":"3.5","field":"q19","text":"<b>Head:<\/b> Consider the image of the morning. “Repent therefore, and turn again, that your sins may be blotted out, so that there may come times of refreshing from the presence of the Lord” (v. 19). What does it mean to repent and turn again? Where do you need times of refreshing?"},{"type":"q","id":"3.6","field":"q20","text":"<b>Heart:<\/b> Which image in this chapter speaks to you most? Why?"}],"prayer":"God, you raised “the Prince of life” from the dead (3:15), and you send “times of refreshing” (3:19). Give me wisdom as I read, and help me turn to you with my whole heart."},{"num":4,"hero":{"src":"img/acts04-hero.jpg","w":1100,"h":733,"alt":"Stone steps and columns of a courthouse"},"blocks":[{"type":"h2","text":"Peter and John Before the Council"},{"type":"p","html":"<sup class=\"v\">1<\/sup> As they spoke to the people, the priests and the captain of the temple and the Sadducees came to them, <sup class=\"v\">2<\/sup> being upset because they taught the people and proclaimed in Jesus the resurrection from the dead. <sup class=\"v\">3<\/sup> They laid hands on them, and put them in custody until the next day, for it was now evening. <sup class=\"v\">4<\/sup> But many of those who heard the word believed, and the number of the men came to be about five thousand."},{"type":"p","html":"<sup class=\"v\">5<\/sup> In the morning, their rulers, elders, and scribes were gathered together in Jerusalem. <sup class=\"v\">6<\/sup> Annas the high priest was there, with Caiaphas, John, Alexander, and as many as were relatives of the high priest. <sup class=\"v\">7<\/sup> When they had stood Peter and John in the middle of them, they inquired, “By what power, or in what name, have you done this?”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Then Peter, filled with the Holy Spirit, said to them, “You rulers of the people, and elders of Israel, <sup class=\"v\">9<\/sup> if we are examined today concerning a good deed done to a crippled man, by what means this man has been healed, <sup class=\"v\">10<\/sup> may it be known to you all, and to all the people of Israel, that in the name of Jesus Christ of Nazareth, whom you crucified, whom God raised from the dead, this man stands here before you whole in him. <sup class=\"v\">11<\/sup> He is ‘the stone which was regarded as worthless by you, the builders, which has become the head of the corner.’ <sup class=\"v\">12<\/sup> There is salvation in no one else, for there is no other name under heaven that is given among men, by which we must be saved!”"},{"type":"q","id":"4.1","field":"q21","text":"<b>Head:<\/b> Look at the image that opens this chapter. Peter told the rulers, “There is salvation in no one else” (v. 12). How would you explain this to a friend?"},{"type":"img","src":"img/acts04-v13.jpg","w":1100,"h":736,"alt":"A fisherman’s hands mending a net"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Now when they saw the boldness of Peter and John, and had perceived that they were unlearned and ignorant men, they marveled. They recognized that they had been with Jesus. <sup class=\"v\">14<\/sup> Seeing the man who was healed standing with them, they could say nothing against it. <sup class=\"v\">15<\/sup> But when they had commanded them to go aside out of the council, they conferred among themselves, <sup class=\"v\">16<\/sup> saying, “What shall we do to these men? Because indeed a notable miracle has been done through them, as can be plainly seen by all who dwell in Jerusalem, and we can’t deny it. <sup class=\"v\">17<\/sup> But so that this spreads no further among the people, let’s threaten them, that from now on they don’t speak to anyone in this name.” <sup class=\"v\">18<\/sup> They called them, and commanded them not to speak at all nor teach in the name of Jesus."},{"type":"p","html":"<sup class=\"v\">19<\/sup> But Peter and John answered them, “Whether it is right in the sight of God to listen to you rather than to God, judge for yourselves, <sup class=\"v\">20<\/sup> for we can’t help telling the things which we saw and heard.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When they had further threatened them, they let them go, finding no way to punish them, because of the people; for everyone glorified God for that which was done. <sup class=\"v\">22<\/sup> For the man on whom this miracle of healing was performed was more than forty years old."},{"type":"q","id":"4.2","field":"q22","text":"<b>Heart:<\/b> Consider the image of the fisherman’s hands. The leaders saw that Peter and John were “unlearned and ignorant men,” and they “recognized that they had been with Jesus” (v. 13). How can others tell that you have been with Jesus?"},{"type":"q","id":"4.3","field":"q23","text":"<b>Action:<\/b> They said, “we can’t help telling the things which we saw and heard” (v. 20). What have you seen and heard of God that you can’t keep to yourself? Whom will you tell this week?"},{"type":"h2","text":"The Believers Pray for Boldness"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Being let go, they came to their own company and reported all that the chief priests and the elders had said to them. <sup class=\"v\">24<\/sup> When they heard it, they lifted up their voice to God with one accord, and said, “O Lord, you are God, who made the heaven, the earth, the sea, and all that is in them; <sup class=\"v\">25<\/sup> who by the mouth of your servant, David, said,"},{"type":"poem","lines":["‘Why do the nations rage,","and the peoples plot a vain thing?","<sup class=\"v\">26<\/sup> The kings of the earth take a stand,","and the rulers take council together,","against the Lord, and against his Christ.’"]},{"type":"p","html":"<sup class=\"v\">27<\/sup> “For truly, both Herod and Pontius Pilate, with the Gentiles and the people of Israel, were gathered together against your holy servant, Jesus, whom you anointed, <sup class=\"v\">28<\/sup> to do whatever your hand and your council foreordained to happen. <sup class=\"v\">29<\/sup> Now, Lord, look at their threats, and grant to your servants to speak your word with all boldness, <sup class=\"v\">30<\/sup> while you stretch out your hand to heal; and that signs and wonders may be done through the name of your holy Servant Jesus.”"},{"type":"img","src":"img/acts04-v31.jpg","w":1100,"h":726,"alt":"Wind sweeping over a green field under dark clouds"},{"type":"p","html":"<sup class=\"v\">31<\/sup> When they had prayed, the place was shaken where they were gathered together. They were all filled with the Holy Spirit, and they spoke the word of God with boldness."},{"type":"q","id":"4.4","field":"q24","text":"<b>Heart:<\/b> Look at the image of the wind in the grass. The believers prayed, “grant to your servants to speak your word with all boldness” (v. 29). Where do you need boldness?"},{"type":"h2","text":"The Believers Share Everything"},{"type":"img","src":"img/acts04-v32.jpg","w":1100,"h":763,"alt":"Friends sharing food around a table"},{"type":"p","html":"<sup class=\"v\">32<\/sup> The multitude of those who believed were of one heart and soul. Not one of them claimed that anything of the things which he possessed was his own, but they had all things in common. <sup class=\"v\">33<\/sup> With great power, the apostles gave their testimony of the resurrection of the Lord Jesus. Great grace was on them all. <sup class=\"v\">34<\/sup> For neither was there among them any who lacked, for as many as were owners of lands or houses sold them, and brought the proceeds of the things that were sold, <sup class=\"v\">35<\/sup> and laid them at the apostles’ feet, and distribution was made to each, according as anyone had need. <sup class=\"v\">36<\/sup> Joses, who by the apostles was also called Barnabas (which is, being interpreted, Son of Encouragement), a Levite, a man of Cyprus by race, <sup class=\"v\">37<\/sup> having a field, sold it and brought the money and laid it at the apostles’ feet."},{"type":"q","id":"4.5","field":"q25","text":"<b>Head:<\/b> Consider the image of the shared food. “The multitude of those who believed were of one heart and soul” and shared what they had (v. 32). What made the early believers so willing to share? What could sharing look like in your church?"},{"type":"q","id":"4.6","field":"q26","text":"<b>Action:<\/b> Barnabas was called “Son of Encouragement” (v. 36). Who has been a Barnabas to you? Whom will you encourage this week?"}],"prayer":"God, you made “the heaven, the earth, the sea, and all that is in them” (4:24). Give me wisdom as I read, and help me speak your word “with all boldness” (4:29)."},{"num":5,"hero":{"src":"img/acts05-hero.jpg","w":1100,"h":732,"alt":"A coin held between fingers"},"blocks":[{"type":"h2","text":"Ananias and Sapphira"},{"type":"p","html":"<sup class=\"v\">1<\/sup> But a certain man named Ananias, with Sapphira, his wife, sold a possession, <sup class=\"v\">2<\/sup> and kept back part of the price, his wife also being aware of it, then brought a certain part and laid it at the apostles’ feet. <sup class=\"v\">3<\/sup> But Peter said, “Ananias, why has Satan filled your heart to lie to the Holy Spirit and to keep back part of the price of the land? <sup class=\"v\">4<\/sup> While you kept it, didn’t it remain your own? After it was sold, wasn’t it in your power? How is it that you have conceived this thing in your heart? You haven’t lied to men, but to God.”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Ananias, hearing these words, fell down and died. Great fear came on all who heard these things. <sup class=\"v\">6<\/sup> The young men arose and wrapped him up, and they carried him out and buried him. <sup class=\"v\">7<\/sup> About three hours later, his wife, not knowing what had happened, came in. <sup class=\"v\">8<\/sup> Peter answered her, “Tell me whether you sold the land for so much.”"},{"type":"p","html":"She said, “Yes, for so much.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> But Peter asked her, “How is it that you have agreed together to tempt the Spirit of the Lord? Behold, the feet of those who have buried your husband are at the door, and they will carry you out.”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> She fell down immediately at his feet and died. The young men came in and found her dead, and they carried her out and buried her by her husband. <sup class=\"v\">11<\/sup> Great fear came on the whole assembly, and on all who heard these things."},{"type":"q","id":"5.1","field":"q27","text":"<b>Head:<\/b> Look at the image that opens this chapter. Peter asked, “why has Satan filled your heart to lie to the Holy Spirit” (v. 3)? Why is honesty so important in a community of faith?"},{"type":"h2","text":"The Apostles Heal Many"},{"type":"img","src":"img/acts05-v12.jpg","w":1100,"h":733,"alt":"A lone figure casting a long shadow on a street"},{"type":"p","html":"<sup class=\"v\">12<\/sup> By the hands of the apostles many signs and wonders were done among the people. They were all with one accord in Solomon’s porch. <sup class=\"v\">13<\/sup> None of the rest dared to join them, however the people honored them. <sup class=\"v\">14<\/sup> More believers were added to the Lord, multitudes of both men and women. <sup class=\"v\">15<\/sup> They even carried out the sick into the streets, and laid them on cots and mattresses, so that as Peter came by, at the least his shadow might overshadow some of them. <sup class=\"v\">16<\/sup> The multitude also came together from the cities around Jerusalem, bringing sick people and those who were tormented by unclean spirits: and they were all healed."},{"type":"q","id":"5.2","field":"q28","text":"<b>Heart:<\/b> Consider the image of the shadow. People hoped that “at the least his shadow might overshadow some of them” (v. 15). What does this show about how desperate people were for help? When have you felt that desperate for God’s help?"},{"type":"h2","text":"The Apostles Are Persecuted"},{"type":"p","html":"<sup class=\"v\">17<\/sup> But the high priest rose up, and all those who were with him (which is the sect of the Sadducees), and they were filled with jealousy <sup class=\"v\">18<\/sup> and laid hands on the apostles, then put them in public custody."},{"type":"img","src":"img/acts05-v19.jpg","w":1100,"h":733,"alt":"An old prison corridor"},{"type":"p","html":"<sup class=\"v\">19<\/sup> But an angel of the Lord opened the prison doors by night, and brought them out and said, <sup class=\"v\">20<\/sup> “Go stand and speak in the temple to the people all the words of this life.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When they heard this, they entered into the temple about daybreak and taught. But the high priest came, and those who were with him, and called the council together, and all the senate of the children of Israel, and sent to the prison to have them brought. <sup class=\"v\">22<\/sup> But the officers who came didn’t find them in the prison. They returned and reported, <sup class=\"v\">23<\/sup> “We found the prison shut and locked, and the guards standing before the doors, but when we opened them, we found no one inside!”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Now when the high priest, the captain of the temple, and the chief priests heard these words, they were very perplexed about them and what might become of this. <sup class=\"v\">25<\/sup> One came and told them, “Behold, the men whom you put in prison are in the temple, standing and teaching the people.” <sup class=\"v\">26<\/sup> Then the captain went with the officers, and brought them without violence, for they were afraid that the people might stone them."},{"type":"q","id":"5.3","field":"q29","text":"<b>Action:<\/b> Look at the image of the prison. An angel opened the prison doors and said, “Go stand and speak in the temple to the people all the words of this life” (v. 20). What are “the words of this life” for you? With whom could you share them this week?"},{"type":"p","html":"<sup class=\"v\">27<\/sup> When they had brought them, they set them before the council. The high priest questioned them, <sup class=\"v\">28<\/sup> saying, “Didn’t we strictly command you not to teach in this name? Behold, you have filled Jerusalem with your teaching, and intend to bring this man’s blood on us.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> But Peter and the apostles answered, “We must obey God rather than men. <sup class=\"v\">30<\/sup> The God of our fathers raised up Jesus, whom you killed, hanging him on a tree. <sup class=\"v\">31<\/sup> God exalted him with his right hand to be a Prince and a Savior, to give repentance to Israel, and remission of sins. <sup class=\"v\">32<\/sup> We are his witnesses of these things; and so also is the Holy Spirit, whom God has given to those who obey him.”"},{"type":"q","id":"5.4","field":"q30","text":"<b>Heart:<\/b> Peter answered, “We must obey God rather than men” (v. 29). When have you had to choose between pleasing people and obeying God?"},{"type":"h2","text":"Gamaliel’s Advice"},{"type":"p","html":"<sup class=\"v\">33<\/sup> But they, when they heard this, were cut to the heart, and were determined to kill them. <sup class=\"v\">34<\/sup> But one stood up in the council, a Pharisee named Gamaliel, a teacher of the law, honored by all the people, and commanded to put the apostles out for a little while. <sup class=\"v\">35<\/sup> He said to them, “You men of Israel, be careful concerning these men, what you are about to do. <sup class=\"v\">36<\/sup> For before these days Theudas rose up, making himself out to be somebody; to whom a number of men, about four hundred, joined themselves. He was slain; and all, as many as obeyed him, were dispersed, and came to nothing. <sup class=\"v\">37<\/sup> After this man, Judas of Galilee rose up in the days of the enrollment, and drew away some people after him. He also perished, and all, as many as obeyed him, were scattered abroad. <sup class=\"v\">38<\/sup> Now I tell you, withdraw from these men, and leave them alone. For if this counsel or this work is of men, it will be overthrown. <sup class=\"v\">39<\/sup> But if it is of God, you will not be able to overthrow it, and you would be found even to be fighting against God!”"},{"type":"q","id":"5.5","field":"q31","text":"<b>Head:<\/b> Gamaliel said, “if it is of God, you will not be able to overthrow it” (v. 39). What was Gamaliel’s reasoning? How does it give you confidence in God’s work?"},{"type":"p","html":"<sup class=\"v\">40<\/sup> They agreed with him. Summoning the apostles, they beat them and commanded them not to speak in the name of Jesus, and let them go."},{"type":"img","src":"img/acts05-v41.jpg","w":1100,"h":731,"alt":"A group celebrating on a hilltop at dusk"},{"type":"p","html":"<sup class=\"v\">41<\/sup> They therefore departed from the presence of the council, rejoicing that they were counted worthy to suffer dishonor for Jesus’ name."},{"type":"p","html":"<sup class=\"v\">42<\/sup> Every day, in the temple and at home, they never stopped teaching and preaching Jesus, the Christ."},{"type":"q","id":"5.6","field":"q32","text":"<b>Head:<\/b> Consider the image of the celebration. The apostles left “rejoicing that they were counted worthy to suffer dishonor for Jesus’ name” (v. 41). How could they rejoice in suffering?"},{"type":"q","id":"5.7","field":"q33","text":"<b>Action:<\/b> “Every day… they never stopped teaching and preaching Jesus” (v. 42). What helps you keep sharing your faith day by day? What will you do this week?"}],"prayer":"God, when a work is from you, people “will not be able to overthrow it” (5:39). Give me wisdom as I read, and help me obey you rather than people (5:29)."},{"num":6,"hero":{"src":"img/acts06-hero.jpg","w":1100,"h":733,"alt":"People serving food at a long table"},"blocks":[{"type":"h2","text":"Seven Chosen to Serve"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now in those days, when the number of the disciples was multiplying, a complaint arose from the Hellenists against the Hebrews, because their widows were neglected in the daily service. <sup class=\"v\">2<\/sup> The twelve summoned the multitude of the disciples and said, “It is not appropriate for us to forsake the word of God and serve tables. <sup class=\"v\">3<\/sup> Therefore select from among you, brothers, seven men of good report, full of the Holy Spirit and of wisdom, whom we may appoint over this business. <sup class=\"v\">4<\/sup> But we will continue steadfastly in prayer and in the ministry of the word.”"},{"type":"q","id":"6.1","field":"q34","text":"<b>Action:<\/b> Look at the image that opens this chapter. Some widows “were neglected in the daily service” (v. 1). Who might be overlooked in your community? How could you care for them this week?"},{"type":"q","id":"6.2","field":"q35","text":"<b>Head:<\/b> The apostles asked for “seven men of good report, full of the Holy Spirit and of wisdom” to serve (v. 3). Why do you think serving tables required people full of the Spirit?"},{"type":"img","src":"img/acts06-v05.jpg","w":1100,"h":733,"alt":"People laying hands on a young man in prayer"},{"type":"p","html":"<sup class=\"v\">5<\/sup> These words pleased the whole multitude. They chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus, a proselyte of Antioch; <sup class=\"v\">6<\/sup> whom they set before the apostles. When they had prayed, they laid their hands on them."},{"type":"img","src":"img/acts06-v07.jpg","w":1100,"h":734,"alt":"Rows of young plants growing in a field"},{"type":"p","html":"<sup class=\"v\">7<\/sup> The word of God increased and the number of the disciples greatly multiplied in Jerusalem. A great company of the priests were obedient to the faith."},{"type":"q","id":"6.3","field":"q36","text":"<b>Head:<\/b> Consider the image of the blessing. The apostles prayed and laid their hands on them (v. 6). Why is it meaningful to pray over people as they begin to serve?"},{"type":"q","id":"6.4","field":"q37","text":"<b>Action:<\/b> Look at the image of the young plants. “The word of God increased and the number of the disciples greatly multiplied” (v. 7). How does caring for people help the church grow? Where could you serve this week?"},{"type":"h2","text":"Stephen Is Seized"},{"type":"img","src":"img/acts06-v08.jpg","w":1100,"h":730,"alt":"A girl’s face in warm golden light"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Stephen, full of faith and power, performed great wonders and signs among the people. <sup class=\"v\">9<\/sup> But some of those who were of the synagogue called “The Libertines”, and of the Cyrenians, of the Alexandrians, and of those of Cilicia and Asia arose, disputing with Stephen. <sup class=\"v\">10<\/sup> They weren’t able to withstand the wisdom and the Spirit by which he spoke. <sup class=\"v\">11<\/sup> Then they secretly induced men to say, “We have heard him speak blasphemous words against Moses and God.” <sup class=\"v\">12<\/sup> They stirred up the people, the elders, and the scribes, and came against him and seized him, then brought him in to the council, <sup class=\"v\">13<\/sup> and set up false witnesses who said, “This man never stops speaking blasphemous words against this holy place and the law. <sup class=\"v\">14<\/sup> For we have heard him say that this Jesus of Nazareth will destroy this place, and will change the customs which Moses delivered to us.” <sup class=\"v\">15<\/sup> All who sat in the council, fastening their eyes on him, saw his face like it was the face of an angel."},{"type":"q","id":"6.5","field":"q38","text":"<b>Heart:<\/b> Stephen was “full of faith and power” (v. 8), yet people lied about him (v. 13). How do you respond when people misunderstand or accuse you?"},{"type":"q","id":"6.6","field":"q39","text":"<b>Heart:<\/b> Consider the image of the face in the light. The council “saw his face like it was the face of an angel” (v. 15). What gives a person that kind of peace under pressure?"}],"prayer":"Father in heaven, your word increased and your people multiplied (6:7). Give me wisdom as I read, and fill me with your Spirit and wisdom so that I can serve others well (6:3)."},{"num":7,"hero":{"src":"img/acts07-hero.jpg","w":1100,"h":722,"alt":"A long desert road at sunset"},"blocks":[{"type":"h2","text":"Stephen’s Speech"},{"type":"p","html":"<sup class=\"v\">1<\/sup> The high priest said, “Are these things so?”"},{"type":"img","src":"img/acts07-v02.jpg","w":1100,"h":714,"alt":"A starry night sky over still water"},{"type":"p","html":"<sup class=\"v\">2<\/sup> He said, “Brothers and fathers, listen. The God of glory appeared to our father Abraham when he was in Mesopotamia, before he lived in Haran, <sup class=\"v\">3<\/sup> and said to him, ‘Get out of your land and away from your relatives, and come into a land which I will show you.’ <sup class=\"v\">4<\/sup> Then he came out of the land of the Chaldaeans and lived in Haran. From there, when his father was dead, God moved him into this land, where you are now living. <sup class=\"v\">5<\/sup> He gave him no inheritance in it, no, not so much as to set his foot on. He promised that he would give it to him for a possession, and to his offspring after him, when he still had no child. <sup class=\"v\">6<\/sup> God spoke in this way: that his offspring would live as aliens in a strange land, and that they would be enslaved and mistreated for four hundred years. <sup class=\"v\">7<\/sup> ‘I will judge the nation to which they will be in bondage,’ said God, ‘and after that they will come out, and serve me in this place.’ <sup class=\"v\">8<\/sup> He gave him the covenant of circumcision. So Abraham became the father of Isaac, and circumcised him the eighth day. Isaac became the father of Jacob, and Jacob became the father of the twelve patriarchs."},{"type":"q","id":"7.1","field":"q40","text":"<b>Heart:<\/b> Look at the image of the stars. God told Abraham, “Get out of your land and away from your relatives, and come into a land which I will show you” (v. 3). When has God asked you to step into the unknown?"},{"type":"p","html":"<sup class=\"v\">9<\/sup> “The patriarchs, moved with jealousy against Joseph, sold him into Egypt. God was with him, <sup class=\"v\">10<\/sup> and delivered him out of all his afflictions, and gave him favor and wisdom before Pharaoh, king of Egypt. He made him governor over Egypt and all his house. <sup class=\"v\">11<\/sup> Now a famine came over all the land of Egypt and Canaan, and great affliction. Our fathers found no food. <sup class=\"v\">12<\/sup> But when Jacob heard that there was grain in Egypt, he sent out our fathers the first time. <sup class=\"v\">13<\/sup> On the second time Joseph was made known to his brothers, and Joseph’s race was revealed to Pharaoh. <sup class=\"v\">14<\/sup> Joseph sent and summoned Jacob, his father, and all his relatives, seventy-five souls. <sup class=\"v\">15<\/sup> Jacob went down into Egypt and he died, himself and our fathers, <sup class=\"v\">16<\/sup> and they were brought back to Shechem, and laid in the tomb that Abraham bought for a price in silver from the children of Hamor of Shechem."},{"type":"q","id":"7.2","field":"q41","text":"<b>Heart:<\/b> Joseph was sold into Egypt, but “God was with him” (v. 9). When has God been with you in a hard place?"},{"type":"p","html":"<sup class=\"v\">17<\/sup> “But as the time of the promise came close which God had sworn to Abraham, the people grew and multiplied in Egypt, <sup class=\"v\">18<\/sup> until there arose a different king, who didn’t know Joseph. <sup class=\"v\">19<\/sup> The same took advantage of our race, and mistreated our fathers, and forced them to throw out their babies, so that they wouldn’t stay alive. <sup class=\"v\">20<\/sup> At that time Moses was born, and was exceedingly handsome. He was nourished three months in his father’s house. <sup class=\"v\">21<\/sup> When he was thrown out, Pharaoh’s daughter took him up and reared him as her own son. <sup class=\"v\">22<\/sup> Moses was instructed in all the wisdom of the Egyptians. He was mighty in his words and works. <sup class=\"v\">23<\/sup> But when he was forty years old, it came into his heart to visit his brothers, the children of Israel. <sup class=\"v\">24<\/sup> Seeing one of them suffer wrong, he defended him, and avenged him who was oppressed, striking the Egyptian. <sup class=\"v\">25<\/sup> He supposed that his brothers understood that God, by his hand, was giving them deliverance; but they didn’t understand."},{"type":"p","html":"<sup class=\"v\">26<\/sup> “The day following, he appeared to them as they fought, and urged them to be at peace again, saying, ‘Sirs, you are brothers. Why do you wrong one another?’ <sup class=\"v\">27<\/sup> But he who did his neighbor wrong pushed him away, saying, ‘Who made you a ruler and a judge over us? <sup class=\"v\">28<\/sup> Do you want to kill me, as you killed the Egyptian yesterday?’ <sup class=\"v\">29<\/sup> Moses fled at this saying, and became a stranger in the land of Midian, where he became the father of two sons."},{"type":"img","src":"img/acts07-v30.jpg","w":1100,"h":825,"alt":"A bush on fire"},{"type":"p","html":"<sup class=\"v\">30<\/sup> “When forty years were fulfilled, an angel of the Lord appeared to him in the wilderness of Mount Sinai, in a flame of fire in a bush. <sup class=\"v\">31<\/sup> When Moses saw it, he wondered at the sight. As he came close to see, a voice of the Lord came to him, <sup class=\"v\">32<\/sup> ‘I am the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob.’ Moses trembled, and dared not look. <sup class=\"v\">33<\/sup> The Lord said to him, ‘Take off your sandals, for the place where you stand is holy ground. <sup class=\"v\">34<\/sup> I have surely seen the affliction of my people that is in Egypt, and have heard their groaning. I have come down to deliver them. Now come, I will send you into Egypt.’"},{"type":"q","id":"7.3","field":"q42","text":"<b>Head:<\/b> Consider the image of the flaming bush. God said to Moses, “Take off your sandals, for the place where you stand is holy ground” (v. 33). Why did God tell Moses to take off his sandals? Where have you sensed that God was near?"},{"type":"p","html":"<sup class=\"v\">35<\/sup> “This Moses, whom they refused, saying, ‘Who made you a ruler and a judge?’—God has sent him as both a ruler and a deliverer by the hand of the angel who appeared to him in the bush. <sup class=\"v\">36<\/sup> This man led them out, having worked wonders and signs in Egypt, in the Red Sea, and in the wilderness for forty years. <sup class=\"v\">37<\/sup> This is that Moses, who said to the children of Israel, ‘The Lord our God will raise up a prophet for you from among your brothers, like me.’ <sup class=\"v\">38<\/sup> This is he who was in the assembly in the wilderness with the angel that spoke to him on Mount Sinai, and with our fathers, who received living revelations to give to us, <sup class=\"v\">39<\/sup> to whom our fathers wouldn’t be obedient, but rejected him, and turned back in their hearts to Egypt, <sup class=\"v\">40<\/sup> saying to Aaron, ‘Make us gods that will go before us, for as for this Moses, who led us out of the land of Egypt, we don’t know what has become of him.’ <sup class=\"v\">41<\/sup> They made a calf in those days, and brought a sacrifice to the idol, and rejoiced in the works of their hands. <sup class=\"v\">42<\/sup> But God turned, and gave them up to serve the army of the sky, as it is written in the book of the prophets,"},{"type":"poem","lines":["‘Did you offer to me slain animals and sacrifices","forty years in the wilderness, O house of Israel?","<sup class=\"v\">43<\/sup> You took up the tabernacle of Moloch,","the star of your god Rephan,","the figures which you made to worship.","I will carry you away beyond Babylon.’"]},{"type":"q","id":"7.4","field":"q43","text":"<b>Action:<\/b> Look at the image that opens this chapter. Stephen retold the long journey of God’s people. How has God led you on your own journey? Tell someone that story this week."},{"type":"h2","text":"God Does Not Live in Houses Made by Hands"},{"type":"p","html":"<sup class=\"v\">44<\/sup> “Our fathers had the tabernacle of the testimony in the wilderness, even as he who spoke to Moses commanded him to make it according to the pattern that he had seen; <sup class=\"v\">45<\/sup> which also our fathers, in their turn, brought in with Joshua when they entered into the possession of the nations, whom God drove out before the face of our fathers, to the days of David, <sup class=\"v\">46<\/sup> who found favor in the sight of God, and asked to find a habitation for the God of Jacob. <sup class=\"v\">47<\/sup> But Solomon built him a house. <sup class=\"v\">48<\/sup> However, the Most High doesn’t dwell in temples made with hands, as the prophet says,"},{"type":"poem","lines":[" <sup class=\"v\">49<\/sup> ‘heaven is my throne,","and the earth a footstool for my feet.","What kind of house will you build me?’ says the Lord.","‘Or what is the place of my rest?","<sup class=\"v\">50<\/sup> Didn’t my hand make all these things?’"]},{"type":"q","id":"7.5","field":"q44","text":"<b>Head:<\/b> “However, the Most High doesn’t dwell in temples made with hands” (v. 48). Where can you meet God?"},{"type":"p","html":"<sup class=\"v\">51<\/sup> “You stiff-necked and uncircumcised in heart and ears, you always resist the Holy Spirit! As your fathers did, so you do. <sup class=\"v\">52<\/sup> Which of the prophets didn’t your fathers persecute? They killed those who foretold the coming of the Righteous One, of whom you have now become betrayers and murderers. <sup class=\"v\">53<\/sup> You received the law as it was ordained by angels, and didn’t keep it!”"},{"type":"h2","text":"Stephen Is Killed"},{"type":"img","src":"img/acts07-v54.jpg","w":1100,"h":591,"alt":"Light breaking through clouds over a lone tree"},{"type":"p","html":"<sup class=\"v\">54<\/sup> Now when they heard these things, they were cut to the heart, and they gnashed at him with their teeth. <sup class=\"v\">55<\/sup> But he, being full of the Holy Spirit, looked up steadfastly into heaven and saw the glory of God, and Jesus standing on the right hand of God, <sup class=\"v\">56<\/sup> and said, “Behold, I see the heavens opened, and the Son of Man standing at the right hand of God!”"},{"type":"p","html":"<sup class=\"v\">57<\/sup> But they cried out with a loud voice and stopped their ears, then rushed at him with one accord. <sup class=\"v\">58<\/sup> They threw him out of the city and stoned him. The witnesses placed their garments at the feet of a young man named Saul. <sup class=\"v\">59<\/sup> They stoned Stephen as he called out, saying, “Lord Jesus, receive my spirit!” <sup class=\"v\">60<\/sup> He kneeled down, and cried with a loud voice, “Lord, don’t hold this sin against them!” When he had said this, he fell asleep."},{"type":"q","id":"7.6","field":"q45","text":"<b>Head:<\/b> Consider the image of the light breaking through. Stephen said, “Behold, I see the heavens opened, and the Son of Man standing at the right hand of God!” (v. 56). How does this vision encourage those who suffer for their faith?"},{"type":"q","id":"7.7","field":"q46","text":"<b>Action:<\/b> As he died, Stephen prayed, “Lord, don’t hold this sin against them!” (v. 60). Whom do you need to forgive? What step toward forgiveness will you take?"}],"prayer":"God, “the Most High doesn’t dwell in temples made with hands” (7:48), and Stephen saw your Son “standing at the right hand of God” (7:56). Give me wisdom as I read, and help me forgive as Stephen did (7:60)."},{"num":8,"hero":{"src":"img/acts08-hero.jpg","w":1100,"h":733,"alt":"Dandelion seeds blowing in the wind"},"blocks":[{"type":"h2","text":"Saul Persecutes the Churc
